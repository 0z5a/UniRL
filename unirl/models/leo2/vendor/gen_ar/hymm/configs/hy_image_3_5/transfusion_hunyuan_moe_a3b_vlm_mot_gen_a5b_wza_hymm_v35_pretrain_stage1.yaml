  t2i_task_kwargs:
    # required
    batch_size: 1
    modality: [ vae_image ]
    max_token_length: 3756 # 256（image） + 3500 (text) ### 仅当打开 independent-seq-length时，该参数才会生效，否则按照统一的max-position-embeddings参数
