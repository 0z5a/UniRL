# IMPORTANT NOTE: Write PTM args in YAML format:
# 0. all arguments specified here are one-one correspondences with PTM arguments; un-specified arguments use PTM default values.
# 1. arguments like '--hidden-size=2560' are written as 'hidden-size: 2560' (see below, note the space after colon).
# 2. YAML format is like a tree, and only the leaf nodes are considered as arguments.
#    Non-leaf nodes and structures are ignored, so arguments can be grouped as you like.
# 3. arguments like '--sequence-parallel' can be written as 'enabled: \n  - sequence-parallel' (see below, note the indent).
#    multiple `enabled` arguments in a same sub-tree must be put in a `enabled` list (see below for an example).
# --------------------------------------------------------------------------------
# 本配置用于 Gemini-3.5 模型一阶段预训练：只训练 t2i 任务，不包含 image shape token.
# --------------------------------------------------------------------------------

__GLOBAL_VARS__:
  _DEFAULT_OUTPUT_PATH: "/apdcephfs_wza2/share_304227829/hunyuan/xiangtikong/gemini/ptm2/a3b_mot_48_pp"
  DATA_PATH: "/root/dummy_data"
  OUTPUT_PATH: ${oc.env:OUTPUT_PATH,${__GLOBAL_VARS__._DEFAULT_OUTPUT_PATH}}

MODEL_ARGS:
  model-name: multimodal.hunyuan-moe-a3b-vlm-gemini-mot-gen-a5b
  model-structure: HunyuanMultimodal

  # Mcore required.
  num-layers: 48
  hidden-size: 2048
  num-attention-heads: 32
  ffn-hidden-size: 6912
  kv-channels: 128
  # max-position-embeddings: 32768 # 32k
  # max-position-embeddings: 65536 # 64k
  max-position-embeddings: 131072 # 128k
  # max-position-embeddings: 256000 # 256k
  seq-length: ${MODEL_ARGS.max-position-embeddings}
  vocab-size: 126309
  normalization: RMSNorm
  num-query-groups: 4
  num-experts: 128
  init-method-std: 0.012757759
  moe-router-topk: 8
  moe-ffn-hidden-size: 768
  moe-shared-expert-intermediate-size: 768
  # moe-layer-freq: '([0]+[1]*1)'
  moe-layer-freq: '([0]+[1]*47)'
  moe-router-load-balancing-type: aux_loss
  moe-token-dispatcher-type: flex
  moe-router-dtype: fp32
  attention-dropout: 0.0
  hidden-dropout: 0.0

  init-device: meta  # [cpu, cuda, meta] pure torch specific
  autocast-dtype: bf16  # pure torch specific
  enabled:
      # common
    - bf16
      # mcore
    - qk-layernorm
    - group-query-attention
    - swiglu
    - use-mcore-models
    - moe-grouped-gemm
    - use-hunyuan-arch
    - disable-bias-linear
      # torch
    - split-qkv
    - split-gate-and-up
    # mot
    - use-mot
    # - mot-und-frozen
    # - mot-embed-norm-lm-head-frozen
    - use-global-diffusion-loss-average
    - use-global-discrete-loss-average
    - dist-ckpt-save-pre-mcore-014  # 沿用旧逻辑，不拆分weights_w和weights_v

  patch-size: 1
  rope-type-extended: "xdrope"
  rope-scaling: 1000.0
  moe-impl: ep_moe
  cond-image-type: vae_vit
  cond-token-attn-type: full_causal


EXTRA_MODEL_ARGS:
  enabled:
    - use-vae
    - use-vit
    # - vit-frozen
    - vit-recompute
  vae-type: 16x16-64c-hy3.5
  vae-latent-dim: 64
  vae-precision: fp32
  vae-autocast-dtype: fp32
  vit-type: anyres-vit-for-a3b

DENOISE_ARGS:
  denoise-type: flow
  flow-path-type: linear
  flow-predict-type: velocity
  flow-snr-type: lognorm
  flow-reverse: True
  # flow-shift: 1.0
  use-flux-shift: True
  flux-base-num-tokens: 256
  flux-base-log-shift: 0.5
  flux-max-num-tokens: 16384
  flux-max-log-shift: 1.61

DATA_ARGS:
  tokenizer-type: NullTokenizer
  dataloader-type: external

  # extra args provider
  tokenizer-name: hymm-v3-5
  tokenizer-class: tokenization_hymm_v3_5.HunyuanMultimodalV3d5TokenizerFast
  conv-template: hymm-v3-5
  sequence-template: pretrain
  gen-image-template: default
  shuffle-by: dataset
  combined-iterator-sampling-mode: fixed
  cos-base:
    - "/cos_nj1/share_302243067 -> /apdcephfs_wza2/share_304227829/hunyuan_data/{stem2}"
  ignore-start-tokens: []
  enabled:
    - cos-file-is-encrypted
    - enable-resample
    - fast-shuffle
    - first-epoch-no-shuffle
    - use-numpy-indices
    - add-timestep-token
    # - add-image-shape-token
    - add-tw-th-token
    - use-front-src-image
    - ignore-boi-token
    # - independent-seq-length
    - use-rope-sample-offsets
    
  # vae
  vae-image-token-length: 16384 # 2048*2048/16/16
  # reso strategy and config
  reso-strategy: anyres
  reso-base-size: 1024
  reso-max-area: 4194304 # 2048*2048
  # reso-strategy: reso_group
  # reso-preset: arc33
  # reso-base-size: 2048
  reso-align: 16
  # vit
  vit-image-token-length: 4354  # 2048*2048/32/32+(2048*4/32)+2

  modality: [ text, vae_image, vit_image ]
  dummy-type: ["ts_proj", "vit"]
  sampling-probs: '{"t2i_style_new": 0.3, "lm": 0.2, "mmu": 0.2, "interleave": 0.3, "interleave_multiref": 0.3}' # TODO

  und-token-type: [ "bos", "text", "boi", "vit", "eoi", "joint_image_sep", "eoi", "eos", "pad", "vae_info" ]
  gen-token-type: [ "vae" ]

  # Dataloader
  num-workers: 24
  prefetch-factor: 12

  # pack-buffer-factor: 1 # TODO

