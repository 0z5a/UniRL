__GLOBAL_VARS__:
  _DEFAULT_OUTPUT_PATH: ""
  DATA_PATH: "/root/dummy_data"
  OUTPUT_PATH: ${oc.env:OUTPUT_PATH,${__GLOBAL_VARS__._DEFAULT_OUTPUT_PATH}}

MODEL_ARGS:
  model-name: diffusion.leo-2-moe-v1-1-pack-noTR
  model-structure: LeoModelHF
  text-branch-model-name: diffusion.leo-2-moe-v1-1-pack-txt-branch
  audio-branch-model-name: diffusion.leo-2-moe-v1-1-pack-audio-branch

  init-device: meta  # [cpu, cuda, meta] pure torch specific
  autocast-dtype: bf16  # pure torch specific
  enabled:
    - bf16
    - main-params-fp32
  #    - fsdp-cast-forward-inputs
  noise-dtype: fp32

  patch-size: 1
  seq-length: 148096 # 15s -> 91*40*40 + 2048 + 373 = 148021, pad up to a multiple of 2*CP(=8)
  attn-impl: flash_packed
  #attn-impl: flash
  rope-type-extended: 3d
  rope-audio-rescale-factor: 0.24
  moe-impl: ep_moe
  img-latent-in-channels: 97  # 2 * 48 + 1
  cond-image-type: vae
  cond-token-attn-type: full
  cond-video-type: none
  cond-video-token-attn-type: none


EXTRA_MODEL_ARGS:
  enabled:
    - use-vae
    - use-vae-decoder
    - use-audio-vae
    - use-text-encoder
    - disable-cp-info
#    - use-repa

  vae-type: 16x16x4-48c-hy-v3
  vae-latent-dim: 48
  vae-precision: fp32
  vae-autocast-dtype: fp16
  vae-encode-type: mode

  audio-vae-type: dual_channel_48k
  audio-vae-latent-dim: 96
  __FROZEN__AUDIO_VAE_ARGS:
    audio_branch_audio_vae_latent_dim: ${EXTRA_MODEL_ARGS.audio-vae-latent-dim}

  text-encoder-type: qwen-3.5-9b
  __FROZEN__TEXT_ENCODER_ARGS:
    text_encoder_text_len: 1024
    text_encoder_precision: bf16
    text_encoder_hidden_state_skip_layer: 2
    text_encoder_uncond_token: "<|cfg|>"
    text_encoder_use_fsdp: True
    text_encoder_use_pack: True

#  repa-encoder-type: qwen-3.5-9b
#  repa-encoder-precision: bf16
#  repa-loss-weight: 0.05


DENOISE_ARGS:
  denoise-type: flow
  flow-path-type: linear
  flow-predict-type: velocity
  flow-snr-type: lognorm
  flow-reverse: True
  flow-shift: 1.0
  flow-shift-video: 7.0
  flow-shift-audio: 1.0


DATA_ARGS:
  tokenizer-type: NullTokenizer
  dataloader-type: external
  tokenizer-name: qwen-3.5-9b
  tokenizer-class: tokenization_qwen_multimodal.Qwen3TokenizerFast
  conv-template: qwen-vl-v2-li-dit
  sequence-template: pretrain
  uncond-length: equal

  # extra args provider
  shuffle-by: dataset
  combined-iterator-sampling-mode: fixed
  cos-base:
    - "/apdcephfs_wza2/share_304227829/hunyuan_data/{stem2}/ -> /cos_wzd1/share_305640887/"
    - "/cos_nj1/share_302243067/ -> /cos_wzd1/share_305640887/"
    - "/apdcephfs_wzd2/share_305640887/hy_dp/ -> /cos_wzd1/share_305640887/"
  video-cos-base: "/cos_wzd1/share_305640887"
  audio-cos-base: ${DATA_ARGS.video-cos-base}
  enabled:
    - enable-resample
    - drop-resampled-samples
    - fast-shuffle
    - use-numpy-indices
    - extend-latent-channels
    - independent-seq-length
    - use-input-ids

  # vae
  vae-image-token-length: 640
  vae-video-token-length: 145600
  vae-audio-token-length: 1000
  # -- resolution group kwargs
  reso-base-size: 640
  reso-align: 16
  reso-preset: zigzag
  duration-range: [49, 361]
  duration-step: 4
  additional-durations: []   # for image, not used
  # -- audio
  audio-channels: 2
  audio-sample-rate: 48000


  modality: [ vae_image, vae_video, vae_audio ]
  gen-template: multi_stream_dit
  # sampling-probs: '{"t2i": 1.0, "t2i_ocr": 1.0}'
  #sampling-probs: '{"t2i": 0.029, "t2i_ocr": 0.029, "t2va_single": 0.1, "t2va_multi": 0.55, "i2va_single": 0.05, "i2va_multi": 0.05, "fl2va_single": 0.05, "fl2va_multi": 0.05, "t2a_multi_slice_tts": 0.2}'
  sampling-probs: '{"t2vi2v": 1.0}'

  # Dataloader
  num-workers: 8
  prefetch-factor: 8


__FROZEN__DATA_ARGS:
  t2vi2v_task_kwargs:
    # required
    batch_size: 1
    #modality: [ vae_video, vae_audio ]
    modality: [ vae_video ]
    max_token_length: 148021
    attn_type: flash
    shuffle_seed: 1111
    latent_channel_extend_type: t2v
    # dit specific
    extra_num_tokens: 0
    crop_start: 108
    # sp
    system_prompt_type: li-dit-encode-visual-qwen-3.5
    system_prompt_token_length: 111
    # video caption
    uncond_p: 0.1
    prompt_token_length: 2048
    patcher_names: []
    sft_sources: ['kling', 'seedance2']
    #dpo_mode: sft_dpo
    dpo_mode: dpo
    dpo_beta: 500
    # eval config
    bot_task: av
    image_size: 480x848
    num_frames: 121
    video_fps: 24 
    flow_shift_video: 9.0
    diff_infer_steps: 50 
    ref_mode: channel
    eval_script: 'python3 /apdcephfs_nj8/share_301739632/jodai/hunyuan_text2video_data_preprocess/video/video_autoeval_qsave_v2.py --input {video_dir} --output {out_csv_path} --label {label} --overwrite'

  t2vi2v_index_kwargs:
      # index_file:
      #   - /apdcephfs_zwfy/share_303793872/jodai/hunyuan_text2video_data_preprocess/outputs/dpo/t2va_highquality_5k_6k_prompt_2k_v2_2_seedance2_ltx_pair_fake_dpo.csv
      # testsets:
      #   - /apdcephfs_nj8/share_301739632/jodai/hunyuan_multimoda_gen_ar/data/test_video/t2va_single_captions_64.csv
      index_file:
        #- /apdcephfs_zwfy/share_303793872/jodai/hunyuan_text2video_data_preprocess/outputs/dpo/i2v_dpo_0228_all_leo2_480p24fps_strict_56k_checked.csv
        #- /apdcephfs_zwfy/share_303793872/jodai/hunyuan_text2video_data_preprocess/outputs/dpo/t2v_dpo_0228_all_leo2_480p24fps_strict_37k_checked.csv
        #- /apdcephfs_nj8/share_301739632/jodai/hunyuan_text2video_data_preprocess/outputs/dpo/t2v_dpo_0509_all_leo2_480p24fps_strict_34k.csv
        - /apdcephfs_zwfy/share_303793872/jodai/hunyuan_text2video_data_preprocess/outputs/dpo/i2v_dpo_0707_va_leo2_480p24fps_strict_4k.csv
      testsets:
        #- /apdcephfs_nj10/share_301739632/hunyuan/jefxiong/dev/leo_main/hymm/dataset/data_kits/test_video/SSAE_0901_recaption/ssae_0901_en_v4_rev8_64.csv
        #- /apdcephfs_nj8/share_301739632/jodai/HunyuanVideo_pureTorch/data/odpo/i2v_eval_64_qw.csv@@src_img_path=ref_image_path
        #- /apdcephfs_zwfy8/share_303937731/hunyuan/public_service/testdata/lanqing_sample_20260622_i2v.csv
        #- /apdcephfs_zwfy8/share_303937731/hunyuan/public_service/testdata/lanqing_sample_20260622_t2v.csv
        - /apdcephfs_zwfy8/share_303937731/hunyuan/public_service/testdata/minjie_eval_50_gemini_new50_json_480p.csv


TRAINING_ARGS:
  micro-batch-size: 1
  gradient-accumulation-steps: 1
  global-batch-size: ${mul:${div:${mul:${oc.env:HOST_GPU_NUM}, ${oc.env:HOST_NUM}}, ${mul:${mul:${MODEL_PARALLEL_ARGS.tensor-model-parallel-size}, ${MODEL_PARALLEL_ARGS.pipeline-model-parallel-size}}, ${MODEL_PARALLEL_ARGS.context-parallel-size}}}, ${mul:${TRAINING_ARGS.gradient-accumulation-steps}, ${TRAINING_ARGS.micro-batch-size}}} # GLOBAL_BATCH_SIZE = HOST_GPU_NUM * HOST_NUM / (TP_SIZE*PP_SIZE*CP_SIZE) * GRADIENT_ACCUMULATION_STEPS * MICRO_BATCH_SIZE
  lr: 5e-6
  train-iters: 100_000_000
  lr-decay-iters: 100_000_000
  lr-decay-style: cosine
  optimizer: muon
  momentum: 0.95
  adam-beta1: 0.9
  adam-beta2: 0.999
  min-lr: 1e-4
  weight-decay: 0.01
  lr-warmup-iters: 0
  clip-grad: 1.0
  val-interval: 500
  seed: 42
    # - optimizer-cpu-offload
  # - use-precision-aware-optimizer
  __FROZEN__OPTIMIZER_ARGS:  # pure torch specific
    optimizer_params:
      lr: ${TRAINING_ARGS.lr}
      betas:
        - ${TRAINING_ARGS.adam-beta1}
        - ${TRAINING_ARGS.adam-beta2}
      weight_decay: ${TRAINING_ARGS.weight-decay}
      momentum: ${TRAINING_ARGS.momentum}
      adamw_eps: 0.00000001 # adam eps 1e-8
    special_adamw_params: ["*embed_tokens*", "*lm_head*", "*final_layer*", "*time_embed*", "*timestep_emb*", "*patch_embed*", "*embedding*"]

  __FROZEN__LR_SCHEDULER_ARGS:  # pure torch specific
    lr_scheduler_params:
      num_warmup_steps: ${TRAINING_ARGS.lr-warmup-iters}
      num_training_steps: ${TRAINING_ARGS.train-iters}
      min_lr: ${TRAINING_ARGS.min-lr}

  image-loss-weight: 1.0
  audio-loss-weight: 3.0
  moe-aux-loss-coeff: 0.001
  enabled:
    #- moe-aux-loss
    - use-global-diffusion-loss-average

PERFORMANCE_ARGS:
  manual-gc-interval: 5
  recompute-granularity: full
  enabled:
    - manual-gc
    - use-flash-attn
    # - moe-enable-deepep
    - enable-experimental
    # - moe-permute-fusion
    # - moe-router-fusion
    # - moe-shared-expert-overlap
    - overlap-grad-reduce
    - overlap-param-gather


MODEL_PARALLEL_ARGS:
  tensor-model-parallel-size: 1
  pipeline-model-parallel-size: 1
  expert-model-parallel-size: 1
  context-parallel-size: 8
  fsdp-impl: new
  activation-offloading: False
  dp-shard: 32
  enabled:
    - use-distributed-optimizer
    # - tp-comm-overlap
    # - sequence-parallel


CHECKPOINT_ARGS:
  ckpt-format: torch_dist
  dist-ckpt-strictness: log_all
  save-interval: 500
  save: ${__GLOBAL_VARS__.OUTPUT_PATH}/ckpt
#  load: /apdcephfs_wzd2/share_305640887/nj10/hunyuan/jarvizhang/basic_train_jarvizhang_20260509224103_ae711a27/95a8ce269e02770a019e0d2fa28b0436/ckpt.torch/iter_0032000
  enabled:
    - resume
    - use-dist-ckpt
    #    - no-load-optim
    #    - no-load-rng
    #    - finetune
    - ckpt-fully-parallel-load
    - ckpt-fully-parallel-save


LOGGING_ARGS:
  log-interval: 1
  tensorboard-dir: ${__GLOBAL_VARS__.OUTPUT_PATH}/events
  saved-training-batch-dir: ${__GLOBAL_VARS__.OUTPUT_PATH}/saved_training_data
  save-n-training-data: 16
  enabled:
    - log-timers-to-tensorboard
    - log-memory-to-tensorboard
    - log-num-zeros-in-grad
    - log-params-norm
    - log-validation-ppl-to-tensorboard
    - log-throughput
