__GLOBAL_VARS__:
  _DEFAULT_OUTPUT_PATH: ""
  DATA_PATH: "/root/dummy_data"
  OUTPUT_PATH: ${oc.env:OUTPUT_PATH,${__GLOBAL_VARS__._DEFAULT_OUTPUT_PATH}}
  # Unified max_token_length for all *2v* (video) tasks; change here once.
  VIDEO_MAX_TOKEN_LENGTH: 25720 # 15s 16*16*91+376+2048
  # Unified max_token_length for all t2i* (image) and t2a* (audio) tasks
  IMAGE_AUDIO_MAX_TOKEN_LENGTH: 16384

MODEL_ARGS:
  model-name: diffusion.leo-2-moe-v1-1-pack-noTR
  model-structure: LeoModel
  text-branch-model-name: diffusion.leo-2-moe-v1-1-pack-txt-branch
  audio-branch-model-name: diffusion.leo-2-moe-v1-1-pack-audio-branch

  # Cross-branch shared system / VAE flags
  __FROZEN__BRANCH_OVERRIDE_ARGS:
    text_branch_moe_enable_deepep: True
    audio_branch_moe_enable_deepep: True
    audio_branch_audio_vae_latent_dim: 96

  # The following args are ineffective, only used to pass the argument check in mcore
  num-layers: 48 # must be the same as double_layer or single_layer to pass the check
  # The following args will not be used, only used to pass the check
  vocab-size: 60000

  hidden-size: 4096 # overwrite
  ffn-hidden-size: 13824 # overwrite
  moe-ffn-hidden-size: 1536 # overwrite
  num-attention-heads: 32 # overwrite
  max-position-embeddings: 327600 # overwrite
  moe-router-topk: 8 # overwrite
  num-experts: 64 # overwrite
  moe-layer-freq: '([0]+[1]*47)' # for MoE aux loss
  moe-token-dispatcher-type: flex
  moe-router-dtype: fp32
  transformer-impl: local

  attention-dropout: 0.0
  hidden-dropout: 0.0
  init-method-std: 0.012757759
  data-path: ${__GLOBAL_VARS__.DATA_PATH}
  split: 100,0,0

  init-device: meta  # [cpu, cuda, meta] pure torch specific
  autocast-dtype: bf16  # pure torch specific
  enabled:
    - sft # don't change the args
    - qk-layernorm # don't change the args, otherwise it will affect TP backwards
    - swiglu
    - bf16
    - dist-ckpt-save-pre-mcore-014  # 沿用旧逻辑，不拆分weights_w和weights_v
    - disable-bias-linear
    - moe-grouped-gemm
    - moe-use-legacy-grouped-gemm
    - use-gate-torch-mm

  noise-dtype: fp32

  patch-size: 1
  seq-length: ${__GLOBAL_VARS__.VIDEO_MAX_TOKEN_LENGTH}
  attn-impl: flash3_packed
  rope-type-extended: 3d
  rope-theta: 10000
  rope-fixed-space: 256
  rope-audio-rescale-factor: 0.24
  img-latent-in-channels: 97  # 2 * 48 + 1
  cond-image-type: vae
  cond-token-attn-type: full
  cond-video-type: none
  cond-video-token-attn-type: none


EXTRA_MODEL_ARGS:
  enabled:
    - use-vae
#    - use-audio-vae
    - use-text-encoder

  vae-type: 16x16x4-48c-hy-v3_3-release
  vae-latent-dim: 48
  vae-precision: fp32
  vae-autocast-dtype: fp16
  vae-encode-type: mode

  audio-vae-type: dual_channel_48k
  audio-vae-latent-dim: 96
  __FROZEN__AUDIO_VAE_ARGS:
    audio_branch_audio_vae_latent_dim: ${EXTRA_MODEL_ARGS.audio-vae-latent-dim}

  text-encoder-type: qwen-3.5-9b
  text-encoder-attn: flash_attention_3
  __FROZEN__TEXT_ENCODER_ARGS:
    text_encoder_text_len: 1024
    text_encoder_precision: bf16
    text_encoder_hidden_state_skip_layer: 2
    text_encoder_uncond_token: "<|cfg|>"
    text_encoder_use_fsdp: True
    text_encoder_fsdp_overlap: True
    text_encoder_use_pack: True
    text_encoder_pack_microbatches: True
    intra_dp_text_balance_by_tokens: True
    text_encoder_fla_disable_autotune: True
    text_encoder_fsdp_scope: block
    text_encoder_fsdp_max_group_size: 16


DENOISE_ARGS:
  denoise-type: flow
  flow-path-type: linear
  flow-predict-type: velocity
  flow-snr-type: lognorm
  flow-reverse: True
  flow-shift: 1.0
  flow-shift-video: 4.0
  flow-shift-audio: 1.0
  enabled:
    - decouple-va-timestep


DATA_ARGS:
  tokenizer-type: NullTokenizer
  dataloader-type: external
  tokenizer-name: qwen-3.5-9b
  tokenizer-class: tokenization_qwen_multimodal.Qwen3TokenizerFast
  conv-template: qwen-vl-v2-li-dit
  sequence-template: pretrain
  uncond-length: equal

  # extra args provider
  shuffle-by: dataset
  combined-iterator-sampling-mode: fixed
  cos-base:
    - "/apdcephfs_wza2/share_304227829/hunyuan_data/{stem2}/ -> /cos_wzd1/share_305640887/"
    - "/cos_nj1/share_302243067/ -> /cos_wzd1/share_305640887/"
    - "/apdcephfs_wzd2/share_305640887/hy_dp/ -> /cos_wzd1/share_305640887/"
  video-cos-base: "/cos_wzd1/share_305640887"
  audio-cos-base: ${DATA_ARGS.video-cos-base}
  enabled:
    - enable-resample
    - drop-resampled-samples
    - fast-shuffle
    - first-epoch-no-shuffle
    - use-numpy-indices
    - extend-latent-channels
    - independent-seq-length
    - pack-seq-reduce-pad
    - use-input-ids

  # vae
  vae-image-token-length: 256
  vae-video-token-length: 23296
  vae-audio-token-length: 1000
  # -- resolution group kwargs
  reso-base-size: 256
  reso-align: 16
  reso-preset: zigzag
  duration-range: [49, 361]
  duration-step: 4
  additional-durations: []

  modality: [ vae_image, vae_video, vae_audio ]
  gen-template: multi_stream_dit
  # prod 7040gpus, 新增t2va_ip_part3, t2v_ip_part3
  sampling-probs: '{"t2va_part3": 0.21486175115207373, "t2v_part3": 0.08640552995391705, "t2i": 0.0189873417721519, "t2i_ocr": 0.00863060989643268, "t2i_ip": 0.0005753739930955121, "t2i_style": 0.0005753739930955121, "t2va_part2": 0.07891705069124424, "t2v_part2": 0.010368663594470046, "t2va_part1_ms": 0.03164556962025317, "i2va_part2": 0.06962025316455696, "i2v_part2": 0.012082853855005753, "fl2va_part2": 0.06962025316455696, "fl2v_part2": 0.012082853855005753, "t2va_motion_part2": 0.0805523590333717, "t2v_motion_part2": 0.01611047180667434, "t2va_motion_part1": 0.02704257767548907, "t2va_style_game_part2": 0.017836593785960874, "t2v_style_game_part2": 0.00863060989643268, "t2va_style_game_part1": 0.004027617951668585, "t2va_ip_part2": 0.015535097813578827, "t2v_ip_part2": 0.007479861910241657, "t2va_ip_part3": 0.13003452243958574, "t2v_ip_part3": 0.014959723820483314, "t2a_part2": 0.06271576524741082}'

  # Dataloader
  num-workers: 2
  prefetch-factor: 32
  pack-buffer-factor: 16


