  t2va_single_task_kwargs:
    # required
    cls: av_loader.MultimodalAVIndexDataset
    batch_size: 1
    modality: [ vae_video, vae_audio ]
    max_token_length: 148032
    attn_type: ${MODEL_ARGS.attn-impl}
