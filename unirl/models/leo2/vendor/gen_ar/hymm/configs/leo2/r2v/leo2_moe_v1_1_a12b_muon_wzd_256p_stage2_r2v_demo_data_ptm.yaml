__GLOBAL_VARS__:
  _DEFAULT_OUTPUT_PATH: ""
  DATA_PATH: "/root/dummy_data"
  OUTPUT_PATH: ${oc.env:OUTPUT_PATH,${__GLOBAL_VARS__._DEFAULT_OUTPUT_PATH}}
  # Unified max_token_length for all *2v* (video) tasks; change here once.
  VIDEO_MAX_TOKEN_LENGTH: 25976
  # Unified max_token_length for all t2i* (image) tasks
  IMAGE_MAX_TOKEN_LENGTH: 16384
  # Unified max_token_length for all t2a* (audio) tasks
  AUDIO_MAX_TOKEN_LENGTH: 16384
  AUDIO_HALF_MAX_TOKEN_LENGTH: 8192
  # video * 2 + 9 * image + 1 * audio
  R2V_MAX_TOKEN_LENGTH: 54632

MODEL_ARGS:
  model-name: diffusion.leo-2-moe-v1-1-pack-noTR
  model-structure: LeoModel
  text-branch-model-name: diffusion.leo-2-moe-v1-1-pack-txt-branch
  audio-branch-model-name: diffusion.leo-2-moe-v1-1-pack-audio-branch

  # Cross-branch shared system / VAE flags
  __FROZEN__BRANCH_OVERRIDE_ARGS:
    text_branch_moe_enable_deepep: True
    audio_branch_moe_enable_deepep: True
    audio_branch_audio_vae_latent_dim: 96

  # The following args are ineffective, only used to pass the argument check in mcore
  num-layers: 48 # must be the same as double_layer or single_layer to pass the check
  # The following args will not be used, only used to pass the check
  vocab-size: 60000

  hidden-size: 4096 # overwrite
  ffn-hidden-size: 13824 # overwrite
  moe-ffn-hidden-size: 1536 # overwrite
  num-attention-heads: 32 # overwrite
  max-position-embeddings: 327600 # overwrite
  moe-router-topk: 8 # overwrite
  num-experts: 64 # overwrite
  moe-layer-freq: '([0]+[1]*47)' # for MoE aux loss
  moe-token-dispatcher-type: flex
  moe-router-dtype: fp32
  transformer-impl: local

  attention-dropout: 0.0
  hidden-dropout: 0.0
  init-method-std: 0.012757759
  data-path: ${__GLOBAL_VARS__.DATA_PATH}
  split: 100,0,0

  init-device: meta  # [cpu, cuda, meta] pure torch specific
  autocast-dtype: bf16  # pure torch specific
  enabled:
    - sft # don't change the args
    - qk-layernorm # don't change the args, otherwise it will affect TP backwards
    - swiglu
    - bf16
    - dist-ckpt-save-pre-mcore-014  # 沿用旧逻辑，不拆分weights_w和weights_v
    - disable-bias-linear
    - moe-grouped-gemm
    - moe-use-legacy-grouped-gemm
    - use-gate-torch-mm

  noise-dtype: fp32

  # fp32 权重 + fp32 计算，分组与 pure torch 侧的 --fp32-modules 一致：
  # timestep -> time_embed / timestep_emb / audio_time_embed
  # proj_in  -> patch_embed / audio_projector
  # proj_out -> final_layer / audio_final_layer
  fp32-modules: ['proj_in', 'proj_out', 'timestep']

  patch-size: 1
  seq-length: ${__GLOBAL_VARS__.R2V_MAX_TOKEN_LENGTH}
  attn-impl: flash3_packed
  rope-type-extended: 3d
  rope-theta: 10000
  rope-fixed-space: 256
  rope-cond-image-fixed-space: 128
  rope-cond-video-fixed-space: 128
  rope-audio-rescale-factor: 0.24
  img-latent-in-channels: 97  # 2 * 48 + 1
  cond-image-type: vae_vit       # r2v needs joint vae+vit cond image
  cond-token-attn-type: full
  cond-video-type: vae_vit
  cond-video-token-attn-type: full
  cond-video-frame-cache-interval-sec: 1.0 # 这个是demo数据的配置，正式实验应该是0.5


EXTRA_MODEL_ARGS:
  enabled:
    - use-vae
#    - use-audio-vae
    - use-text-encoder

  vae-type: 16x16x4-48c-hy-v3_3-release
  vae-latent-dim: 48
  vae-precision: fp32
  vae-autocast-dtype: fp16
  vae-encode-type: mode

  audio-vae-type: dual_channel_48k
  audio-vae-latent-dim: 96
  __FROZEN__AUDIO_VAE_ARGS:
    audio_branch_audio_vae_latent_dim: ${EXTRA_MODEL_ARGS.audio-vae-latent-dim}

  text-encoder-type: qwen-3.5-9b
  text-encoder-attn: flash_attention_3
  vit-type: qwen3vl-vit-for-qwen3.5-9b
  vit-image-token-length: 256
  # Max post-merge ViT tokens for the whole clip, all frames included. smart_resize only shrinks
  # h/w (aspect kept) to stay within it, so more sampled frames buy less spatial resolution.
  # 512 折算像素预算 512*32*32*2 = 1048576，约束 frames*h*w
  # （32 = patch_size*merge_size，2 = temporal_patch_size）
  vit-video-token-length: 512
  __FROZEN__TEXT_ENCODER_ARGS:
    text_encoder_text_len: 1024
    text_encoder_precision: bf16
    text_encoder_hidden_state_skip_layer: 2
    text_encoder_uncond_token: "<|cfg|>"
    text_encoder_use_fsdp: True
    text_encoder_fsdp_overlap: True
    text_encoder_use_pack: True
    text_encoder_pack_microbatches: True
    intra_dp_text_balance_by_tokens: True
    text_encoder_fla_disable_autotune: True
    text_encoder_fsdp_scope: block
    text_encoder_fsdp_max_group_size: 16


DENOISE_ARGS:
  denoise-type: flow
  flow-path-type: linear
  flow-predict-type: velocity
  flow-snr-type: lognorm
  flow-reverse: True
  flow-shift: 1.0
  flow-shift-video: 4.0
  flow-shift-audio: 3.0
  enabled:
    - decouple-va-timestep


DATA_ARGS:
  tokenizer-type: NullTokenizer
  dataloader-type: external
  tokenizer-name: qwen-3.5-9b
  tokenizer-class: tokenization_qwen_multimodal.Qwen3TokenizerFast
  conv-template: qwen-vl-v2-li-dit
  sequence-template: pretrain
  uncond-length: equal

  # extra args provider
  shuffle-by: dataset
  combined-iterator-sampling-mode: fixed
  cos-base:
    - "/apdcephfs_wza2/share_304227829/hunyuan_data/{stem2}/ -> /cos_wzd1/share_305640887/"
    - "/cos_nj1/share_302243067/ -> /cos_wzd1/share_305640887/"
    - "/apdcephfs_wzd2/share_305640887/hy_dp/ -> /cos_wzd1/share_305640887/"
  video-cos-base: "/cos_wzd1/share_305640887"
  audio-cos-base: ${DATA_ARGS.video-cos-base}
  enabled:
    - enable-resample
    - drop-resampled-samples
    - fast-shuffle
    # - first-epoch-no-shuffle
    - use-numpy-indices
    - extend-latent-channels
    - independent-seq-length
    - pack-seq-reduce-pad
    - use-input-ids

  # vae
  vae-image-token-length: 256
  vae-video-token-length: 15616
  vae-audio-token-length: 1000
  # -- resolution group kwargs
  reso-base-size: 256
  reso-align: 16
  reso-preset: zigzag
  duration-range: [45, 361]
  duration-step: 4
  additional-durations: []

  modality: [ vae_image, vit_image, vae_video, vae_audio ]
  gen-template: multi_stream_dit
  sampling-probs: '{"r2v_ref_image": 0.5, "r2v_ref_video": 0.5}'

  # Dataloader
  num-workers: 2
  prefetch-factor: 32
  pack-buffer-factor: 16


__FROZEN__DATA_ARGS:
  # 多人参考 - 参考图：cond_image * (1~4) + cond_caption + gen_av
  r2v_ref_image_task_kwargs:
    cls: av_loader.MultimodalAVIndexDataset
    batch_size: 1
    modality: [ vae_image, vit_image, vae_video, vae_audio ]
    # 这份数据没有源视频，关掉源视频条件，避免 setup_video 去建 ViT 视频处理器
    cond_video_type: none
    max_token_length: ${__GLOBAL_VARS__.R2V_MAX_TOKEN_LENGTH}
    attn_type: ${MODEL_ARGS.attn-impl}
    shuffle_seed: 1111
    sequence_pack: True
    num_workers: 8
    prefetch_factor: 16
    # dit specific
    extra_num_tokens: 0
    latent_channel_extend_type: t2v  # one of {t2i, t2a, t2v, i2v, fl2v}
    # sp
    system_prompt_type: li-dit-encode-visual-qwen-3.5
    system_prompt_token_length: 111
    data_format: message
    uncond_p: 0.1
    prompt_token_length: 2048
    patcher_names: []
    cond_after_gen: true
    video_caption_resource:
      - plain:
          plain_src: '{"text_en": 0.5, "text_zh": 0.5}'
          plain_caption_processor: simple_caption_process
          plain_caption_sample_ratio: null
    apply_exif: false
    # gen_av 的音频是离线 latent
    audio_data_format: single_slice_latent
  r2v_ref_image_index_kwargs:
    index_file:
      - /apdcephfs_wzd2/share_305640887/jarvizhang/data/r2v_demo_data/dev/p3s11_more_3k_subset1_ref_edit/base_dev.json
    dar_bucket_kwargs:
      base_size: ${DATA_ARGS.reso-base-size}
      align: ${DATA_ARGS.reso-align}
      preset: ${DATA_ARGS.reso-preset}
      duration_range: ${DATA_ARGS.duration-range}
      duration_step: ${DATA_ARGS.duration-step}
      additional_durations: ${DATA_ARGS.additional-durations}
    verbose: 1
    index_columns:
      message_col: messages
    index_keys:
      image_key: cos_path
      video_key: video_vae_latent_cos_path
      # 必须与 video_key 不同：gen_av 一条 message 同时装着视频和音频 latent
      audio_key: audio_av_clip_vae_leo_v1_0_0_latent_cos_path
      url_cos_key: url_cos

  # 多人参考 - 参考视频：cond_video * (1~3) + cond_caption + gen_av
  # 每个 cond_video 既有 VAE latent（进生成流），也有 2~4 张已抽好的帧图（进理解流）
  r2v_ref_video_task_kwargs:
    cls: av_loader.MultimodalAVIndexDataset
    batch_size: 1
    modality: [ vae_video, vit_video, vae_audio ]
    cond_video_type: vae_vit
    max_token_length: ${__GLOBAL_VARS__.R2V_MAX_TOKEN_LENGTH}
    attn_type: ${MODEL_ARGS.attn-impl}
    shuffle_seed: 1111
    sequence_pack: True
    num_workers: 4
    prefetch_factor: 16
    # dit specific
    extra_num_tokens: 0
    latent_channel_extend_type: t2v
    # sp
    system_prompt_type: li-dit-encode-visual-qwen-3.5
    system_prompt_token_length: 111
    data_format: message
    uncond_p: 0.1
    prompt_token_length: 2048
    patcher_names: []
    cond_after_gen: true
    video_caption_resource:
      - plain:
          plain_src: '{"text_en": 0.5, "text_zh": 0.5}'
          plain_caption_processor: simple_caption_process
          plain_caption_sample_ratio: null
    apply_exif: false
    audio_data_format: single_slice_latent
  r2v_ref_video_index_kwargs:
    index_file:
      - /apdcephfs_wzd2/share_305640887/jarvizhang/data/r2v_demo_data/dev/p3s11_more_3k_subset2_ref_edit_video/base_dev.json
    dar_bucket_kwargs:
      base_size: ${DATA_ARGS.reso-base-size}
      align: ${DATA_ARGS.reso-align}
      preset: ${DATA_ARGS.reso-preset}
      duration_range: ${DATA_ARGS.duration-range}
      duration_step: ${DATA_ARGS.duration-step}
      additional_durations: ${DATA_ARGS.additional-durations}
    verbose: 1
    index_columns:
      message_col: messages
    index_keys:
      image_key: cos_path
      video_key: video_vae_latent_cos_path
      audio_key: audio_av_clip_vae_leo_v1_0_0_latent_cos_path
      # 源视频 ViT 读帧缓存（1fps 的 2~4 帧，时间戳按 cond-video-frame-cache-interval-sec 换算）。
      # 想要更密的时间采样就改成 cos_path 直接解原视频，vit_process_video_frames 两种都支持。
      video_material_key: video_frame_cache_image_list
      url_cos_key: url_cos


TRAINING_ARGS:
  micro-batch-size: 1
  gradient-accumulation-steps: 24
  global-batch-size: ${mul:${div:${mul:${oc.env:HOST_GPU_NUM}, ${oc.env:HOST_NUM}}, ${mul:${mul:${MODEL_PARALLEL_ARGS.tensor-model-parallel-size}, ${MODEL_PARALLEL_ARGS.pipeline-model-parallel-size}}, ${MODEL_PARALLEL_ARGS.context-parallel-size}}}, ${mul:${TRAINING_ARGS.gradient-accumulation-steps}, ${TRAINING_ARGS.micro-batch-size}}} # GLOBAL_BATCH_SIZE = HOST_GPU_NUM * HOST_NUM / (TP_SIZE*PP_SIZE*CP_SIZE) * GRADIENT_ACCUMULATION_STEPS * MICRO_BATCH_SIZE
  lr: 5e-5
  train-iters: 100_000_000
  lr-decay-iters: 100_000_000
  lr-decay-style: cosine
  optimizer: muon
  muon-ema-gradient: True
  muon-momentum: 0.95
  adam-beta1: 0.9
  adam-beta2: 0.999
  min-lr: 5e-5
  weight-decay: 0.01
  lr-warmup-iters: 0
  clip-grad: 1.0
  eval-interval: 1000
  eval-iters: 0
  seed: 42
  __FROZEN__OPTIMIZER_ARGS:  # pure torch specific
    optimizer_params:
      lr: ${TRAINING_ARGS.lr}
      betas:
      - ${TRAINING_ARGS.adam-beta1}
      - ${TRAINING_ARGS.adam-beta2}
      weight_decay: ${TRAINING_ARGS.weight-decay}
      momentum: ${TRAINING_ARGS.muon-momentum}
      adamw_eps: 0.00000001
    special_adamw_params: ["*embed_tokens*", "*lm_head*", "*final_layer*", "*time_embed*", "*timestep_emb*", "*patch_embed*", "*embedding*"]

  __FROZEN__LR_SCHEDULER_ARGS:  # pure torch specific
    lr_scheduler_params:
      num_warmup_steps: ${TRAINING_ARGS.lr-warmup-iters}
      num_training_steps: ${TRAINING_ARGS.train-iters}
      min_lr: ${TRAINING_ARGS.min-lr}

  image-loss-weight: 1.0
  audio-loss-weight: 1.0
  moe-aux-loss-coeff: 0.001
  enabled:
    - moe-aux-loss
    - use-global-diffusion-loss-average
    - accumulate-allreduce-grads-in-fp32   # default True when args.bf16 enable, just align with gemini
    - override-opt_param-scheduler
    - use-dynamic-global-batch-size-convert-iters-to-samples

PERFORMANCE_ARGS:
  manual-gc-interval: 1000
  moe-deepep-num-sms: 64   # deepep a2a SM count (default 20)
  recompute-granularity: full
  recompute-method: uniform
  recompute-num-layers: 1
  ddp-bucket-size: 240000000
  dp-load-balance-flops-proxy: mfu_aligned
  intra-dp-text-pp-stages: "2,3"      # pp stages encode text
  intra-dp-image-pp-stages: "0,1"     # pp stages encode image（parallel to and non-overlapping with text）
  activation-offload-min-mb: 5
  cp-fused-qkv-a2a-max-tokens: 1280
  enabled:
    - manual-gc
    # - use-flash-attn
    - enable-experimental
    - moe-enable-deepep
    - moe-permute-fusion
    # - moe-router-fusion
    - deepep-moe-shared-expert-overlap
    - overlap-grad-reduce
    - overlap-param-gather
    - disable-gloo-process-groups
    - enable-modulate-gate-fusion
    - muon-overlap-momentum-gather
    - muon-use-batch-p2p-gather
    - no-gradient-accumulation-fusion
    - no-bias-swiglu-fusion
    - use-index-add-local-unpermute
    # - no-align-grad-reduce
    - disable-fill-uninitialized-memory
    - enable-async-cp
    - enable-fused-norm-merge-rope
    - moe-router-correct-valid-tokens
    - moe-valid-tokens-exclude-dummy
    - dp-load-balance
    - use-global-batch-count-average
    - intra-dp-encode-balance
    - intra-dp-encode-by-pp-stage
    - selective-attn-output-checkpoint-offload
    - activation-offload-pinned-slot
    - pp-multi-tensor-concat
    - pp-multi-tensor-concat-uint8
    - get-shapes-from-dataloader
    - recompute-input-offload
    - recompute-preprocess
    - cp-skip-dummy-branch-a2a


MODEL_PARALLEL_ARGS:
  tensor-model-parallel-size: 1
  pipeline-model-parallel-size: 4
  pipeline-model-parallel-layout: Et*4|t*4|t*4|t*4|t*4|t*4|t*4|t*4|t*4|t*4|t*4|t*4L  #VPP3 (12 chunks x4)
  expert-model-parallel-size: 8
  context-parallel-size: 4
  distributed-timeout-minutes: 30  # 增加分布式超时时间，解决进程组初始化超时问题（默认10分钟）
  enabled:
    - use-distributed-optimizer
    - single-dataloader-multi-virtual-pipeline-stages


CHECKPOINT_ARGS:
  ckpt-format: torch_dist
  dist-ckpt-strictness: log_all
  save-interval: 50
  save: ${__GLOBAL_VARS__.OUTPUT_PATH}/ckpt
  load: /apdcephfs_wzd2/share_305640887/hunyuan/jarvizhang/basic_train_jarvizhang_20260625203037_2b66e1fa/8b0fb87f9f4715a6019f4cd500e301f7/ckpt
  ckpt-step: 27500
  enabled:
    - resume
    - use-dist-ckpt
    - no-load-optim
    - no-load-rng
    - no-save-rng
    - finetune
    # - ckpt-fully-parallel-load # comment this to avoid all_gather in load
    - ckpt-fully-parallel-save
    - ckpt-assume-constant-structure


LOGGING_ARGS:
  log-interval: 1
  leo-timing-log-level: 0
  tensorboard-dir: ${__GLOBAL_VARS__.OUTPUT_PATH}/events
  saved-training-batch-dir: ${__GLOBAL_VARS__.OUTPUT_PATH}/saved_training_data
  save-n-training-data: 16
  enabled:
    - log-timers-to-tensorboard
    - log-memory-to-tensorboard
    - log-num-zeros-in-grad
    - log-params-norm
    - log-validation-ppl-to-tensorboard
    - log-throughput
