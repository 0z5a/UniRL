          leo2_legacy_caption_processor: simple_caption_process
          leo2_legacy_data_format: 'plain'
#          leo2_legacy_extra_processor: [ "select_nonempty" ]  # skip empty caption columns (e.g. en is null) instead of failing
    audio_data_format: single_slice_latent  # [multi_slice_file, single_slice_file, single_slice_latent]
