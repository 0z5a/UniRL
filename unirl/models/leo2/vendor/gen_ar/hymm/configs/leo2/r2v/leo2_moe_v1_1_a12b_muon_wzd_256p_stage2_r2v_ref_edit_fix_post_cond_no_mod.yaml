    video_cos_base: "/apdcephfs_wzd2/share_305640887/nj10/0_public_datasets/leo2.0_reference_gen"
    cond_after_gen: true
    video_caption_resource:
      - plain:
          plain_src: '{"text_en": 0.5, "text_zh": 0.5}'
          plain_caption_processor: simple_caption_process
          plain_caption_sample_ratio: null
    apply_exif: false
    
    # gen_audio latents (when present) are read inline from the message item as pre-computed latents.
    audio_data_format: single_slice_latent
  r2v_ip_index_kwargs:
