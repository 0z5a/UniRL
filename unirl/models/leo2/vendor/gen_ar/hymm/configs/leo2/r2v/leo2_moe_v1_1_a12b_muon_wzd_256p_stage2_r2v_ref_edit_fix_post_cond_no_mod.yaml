      align: ${DATA_ARGS.reso-align}
      preset: ${DATA_ARGS.reso-preset}
      duration_range: ${DATA_ARGS.duration-range}
      duration_step: ${DATA_ARGS.duration-step}
      additional_durations: ${DATA_ARGS.additional-durations}
    verbose: 1
    index_columns:
      message_col: message
    index_keys:
      image_key: cache_material
      url_cos_key: url_cos
      video_latent_key: latent_cos_path
      audio_latent_key: latent_cos_path

  # Source-video editing: the TARGET (edited) video latent goes to the gen stream (vae_video). The
  # SOURCE video is injected via `cond_video_type=vae_vit`: its VAE latent -> gen stream (reusing the
  # vae_video VAE processor), its sampled clip -> understanding stream via the native video ViT.
  # The latter needs the `vit_video` modality, which is what builds the source-video ViT processor.
  r2v_edit_task_kwargs:
    # required
    cls: av_loader.MultimodalAVIndexDataset
    batch_size: 1
    modality: [ vae_video, vit_video ]
    cond_video_type: vae_vit
    # NOTE: source + target doubles the visual tokens. For 256p at the duration cap T_latent=31
    # (=121f): ~2*(31*12*21) + 2016(src ViT) + 2048(text) + 111(sys) ~= 19.8k, so size to 20480.
    max_token_length: 20480
    attn_type: ${MODEL_ARGS.attn-impl}
    shuffle_seed: 1111
    sequence_pack: True
    # dit specific
    extra_num_tokens: 0
    latent_channel_extend_type: t2v  # one of {t2i, t2a, t2v, i2v, fl2v}
    # sp
    system_prompt_type: li-dit-encode-visual-qwen-3.5
    system_prompt_token_length: 111
    data_format: message
    # video caption
    uncond_p: 0.1
    prompt_token_length: 2048
    patcher_names: []
    latent_pre_scaled: false
    # `latent_cos_path` in the OpenVE arrows is relative to this root, so override the global
    # --video-cos-base for this dataset only.
    video_cos_base: "/apdcephfs_nj10/share_301739632"
    cond_after_gen: true
    default_text_dtype: openve
    video_caption_resource:
      - openve:
          openve_src: '{"text_en": 1.0}'
          openve_caption_processor: caption_process_v4
          openve_caption_sample_ratio: '{"short_caption": 0.3, "long_caption": 0.7}'
  r2v_edit_index_kwargs:
    index_file:
      - /apdcephfs_wzd2/share_305640887/nj10/0_public_datasets/leo2.0_edit/OpenVE-3M/openve_3m_vae251_256p_message_format/base.json
    dar_bucket_kwargs:
      base_size: ${DATA_ARGS.reso-base-size}
      align: ${DATA_ARGS.reso-align}
      preset: ${DATA_ARGS.reso-preset}
      # edit-only cap: source+target double the tokens, single clip <=121f (T_latent<=31)
      duration_range: [33, 121]
      duration_step: ${DATA_ARGS.duration-step}
      additional_durations: ${DATA_ARGS.additional-durations}
    verbose: 1
    index_columns:
      message_col: message
    index_keys:
      image_key: cache_material
      video_material_key: cache_material
