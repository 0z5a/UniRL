TRAINING_ARGS:
  micro-batch-size: 1
  gradient-accumulation-steps: 1
  global-batch-size: ${mul:${div:${mul:${oc.env:HOST_GPU_NUM}, ${oc.env:HOST_NUM}}, ${mul:${mul:${MODEL_PARALLEL_ARGS.tensor-model-parallel-size}, ${MODEL_PARALLEL_ARGS.pipeline-model-parallel-size}}, ${MODEL_PARALLEL_ARGS.context-parallel-size}}}, ${mul:${TRAINING_ARGS.gradient-accumulation-steps}, ${TRAINING_ARGS.micro-batch-size}}} # GLOBAL_BATCH_SIZE = HOST_GPU_NUM * HOST_NUM / (TP_SIZE*PP_SIZE*CP_SIZE) * GRADIENT_ACCUMULATION_STEPS * MICRO_BATCH_SIZE
  lr: 5e-5
  train-iters: 100_000_000
  lr-decay-iters: 100_000_000
  lr-decay-style: cosine
  optimizer: muon
  momentum: 0.95
  adam-beta1: 0.9
  adam-beta2: 0.999
  min-lr: 1e-4
  weight-decay: 0.01
  lr-warmup-iters: 0
  clip-grad: 1.0
  eval-interval: 1000
  eval-iters: 0
  seed: 42
    # - optimizer-cpu-offload
    # - use-precision-aware-optimizer
  __FROZEN__OPTIMIZER_ARGS:  # pure torch specific
    optimizer_params:
      lr: ${TRAINING_ARGS.lr}
      betas:
      - ${TRAINING_ARGS.adam-beta1}
      - ${TRAINING_ARGS.adam-beta2}
      weight_decay: ${TRAINING_ARGS.weight-decay}
      momentum: ${TRAINING_ARGS.momentum}
      adamw_eps: 0.00000001 # adam eps 1e-8
    special_adamw_params: ["*embed_tokens*", "*lm_head*", "*final_layer*", "*time_embed*", "*timestep_emb*", "*patch_embed*", "*embedding*"]

  __FROZEN__LR_SCHEDULER_ARGS:  # pure torch specific
    lr_scheduler_params:
      num_warmup_steps: ${TRAINING_ARGS.lr-warmup-iters}
      num_training_steps: ${TRAINING_ARGS.train-iters}
      min_lr: ${TRAINING_ARGS.min-lr}

  image-loss-weight: 1.0
  audio-loss-weight: 1.0
  moe-aux-loss-coeff: 0.001
  enabled:
    - moe-aux-loss
    - use-global-diffusion-loss-average

VALIDATION_ARGS:
  init-validation: True
  val-interval: 250
  testsets:
    # reference-driven generation
    - "data/test_video/r2v_comic_ip_eval_32.csv"
    - "data/test_video/r2v_humoset_eval_32.csv"
    - "data/test_video/r2v_ceping_eval_32.csv"
    # source-video editing
    - "data/test_video/r2v_edit_openve_eval_256_vae251.csv"
  sample-batch-size: 1
  max-sample-batches: 1
  image-size: 192x336
  num-frames: 121
  diff-guidance-scale: 6.0
  bot-task: video
  video-fps: 24
  ref-mode: sequence
  generation-config: ${oc.env:ASSETS_BASE}/pretrained_llm/generation_configs/leo2_a12b_video.json

PERFORMANCE_ARGS:
  manual-gc-interval: 5
  recompute-granularity: full
  enabled:
    - manual-gc
    - use-flash-attn
    # - moe-enable-deepep
    - enable-experimental
    # - moe-permute-fusion
    # - moe-router-fusion
    # - moe-shared-expert-overlap
    - overlap-grad-reduce
    - overlap-param-gather


MODEL_PARALLEL_ARGS:
  tensor-model-parallel-size: 1
  pipeline-model-parallel-size: 1
  expert-model-parallel-size: 64
  context-parallel-size: 4
  fsdp-impl: new
  enabled:
    - use-distributed-optimizer
    # - tp-comm-overlap
    # - sequence-parallel


CHECKPOINT_ARGS:
  ckpt-format: torch_dist
  dist-ckpt-strictness: log_all
  save-interval: 1000
  save: ${__GLOBAL_VARS__.OUTPUT_PATH}/ckpt
  load: /apdcephfs_wzd2/share_305640887/hunyuan/jarvizhang/basic_train_jarvizhang_20260625203037_2b66e1fa/8b0fb87f9f4715a6019f4cd500e301f7/converted_ckpt/iter_0013500/
  enabled:
    - resume
    - use-dist-ckpt
    - no-load-optim
    - no-load-rng
    - no-save-rng
    - finetune
    # - ckpt-fully-parallel-load # comment this to avoid all_gather in load
    - ckpt-fully-parallel-save
    - ckpt-assume-constant-structure


LOGGING_ARGS:
