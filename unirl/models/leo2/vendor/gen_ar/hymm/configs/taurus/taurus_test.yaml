training_config:
  trainer_name: text2image_diffusion_trainer.Text2ImageDiffusionTrainer
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  global_batch_size: null
  global_seed: 666
  zero_stage: 2
  log_every: 1
  tensorboard: True
  gradient_checkpoint: False
  gradient_checkpoint_layers: -1
  use_compile: False
  launcher: deepspeed

  overlap_comm: True
  reduce_bucket_size: 5e7

  max_training_steps: 1_000_000
  ckpt_every: 5000

  init_save: False
  final_save: True

  resume: null
  resume_dataloader: False
  no_load_optim_states: False
  no_load_ema: False
  default_rank0_ss: False
  fix_lr_scheduler: False

  validation_at_steps: []
  validation_every: -1
  validation_metrics: []
  validation_metrics_save_image: False

sampling_config:
  ckpt: null
  load_key: module
  metric_image_size: 256
  metric_batch_size: 8
  evaluation_metrics: [fid@coco30k, clip_score@coco30k, hpsv2@coco30k, t2i_compbench]
  rerank: 1
  sample_image_size: 256
  sample_batch_size: 1
  seed_type: auto
  seed: 123456
  guidance_scale: 3.5
  diff_infer_steps: 100
  sample_flow_shift: 1.0
  sample_use_flux_shift: False

extra_model_config:
  vae_type: 16x16x4-32c-hy-image
  vae_precision: fp32
  vae_autocast_dtype: fp16
  vae_latent_dim: &vae_latent_dim 32

model_config:
  model_name: Aries-L/2-R
  pretrained_ckpt: null
  precision: bf16
  autocast_dtype: bf16

  denoise_type: flow
  flow_path_type: linear
  flow_predict_type: velocity
  flow_loss_weight: null
  flow_train_eps: null
  flow_sample_eps: null
  flow_snr_type: lognorm
  flow_reverse: True
  flow_shift: 1.0
  use_flux_shift: False
  flux_base_shift: null
  flux_max_shift: null

  model_kwargs:
    rope_type: 2d
    patch_size: 1
    in_channels: *vae_latent_dim
    rope_dim_list: [48, 48]
    rope_theta: 256.0
    rope_theta_rescale_factor: 1.0
    condition_projection: linear
    condition_dim: 4096  # text encoder hidden state dimension
    use_attention_mask: True

  text_encoder_type: llava-llama-3-8b
  text_encoder_tokenizer: llava-llama-3-8b
  text_encoder_text_len: 768
  text_encoder_prompt_template: li-dit-encode-llava-3
  text_encoder_precision: bf16
  text_encoder_use_attention_mask: True
  text_encoder_infer_mode: encoder
  text_encoder_hidden_state_skip_layer: null
  text_encoder_apply_final_norm: False

optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.0001
    betas: [0.9, 0.95]
    eps: 0.000001
    weight_decay: 0.01

lr_scheduler_config:
  lr_schedule: WarmupCosineLR
  lr_scheduler_params:
    warmup_num_steps: 5000
    cos_min_ratio: 1.0
    total_num_steps: 1_000_000

dataloader_config:
  # Common
  get_image_retry: 0
  shuffle_by: dataset
  fast_shuffle: True
  use_numpy_indices: True
  combined_iterator_sampling_mode: fixed
  cos_base: "/cos_nj1/share_302243067 -> /cos_zw1/share_303793872"
  enable_resample: True
  sampling_probs: '{"t2i": 1.0}'

  # Text-to-Image
  t2i_batch_size: 8
  t2i_task_kwargs:
    training_image_size: 256 # only used when multireso is False
    attn_type: flex
    shuffle_seed: 777
    uncond_p: 0.1
    try_first_use_source_text: False    # Must be False
    image_caption_rate: 1.0   # 使用 caption 的比例
    image_caption_col_probs:
      - caption_v3_2_ip:
          caption_v3_2_ip_src: '{"image_caption_v3_2_ip_en_col": 0.5, "image_caption_v3_2_ip_zh_col": 0.5}'
          caption_v3_2_ip_caption_processor: caption_process_v3
          caption_v3_2_ip_caption_sample_ratio: '{"long_long_caption":0.455,"long_caption":0.195,"medium_caption":0.1,"short_caption":0.25,"background":0.1,"style":0.7,"shot_type":0.1}'
          caption_v3_2_ip_extra_processor: [ 'filter_shot', 'inject_style_v2' ]
      - caption_v3_2_ocr:
          caption_v3_2_ocr_src: '{"image_caption_v3_2_ocr_en_col": 0.5, "image_caption_v3_2_ocr_zh_col": 0.5}'
          caption_v3_2_ocr_caption_processor: caption_process_v3
          caption_v3_2_ocr_caption_sample_ratio: '{"long_long_caption":0.99,"long_caption":0.001,"medium_caption":0.003,"short_caption":0.006,"background":0.1,"style":0.7,"shot_type":0.1,"IP":0.5}'
          caption_v3_2_ocr_extra_processor: [ 'filter_shot', 'inject_style_v2' ]
      - caption_v3_2:
          caption_v3_2_src: '{"image_caption_v3_2_en_col": 0.5, "image_caption_v3_2_zh_col": 0.5}'
          caption_v3_2_caption_processor: caption_process_v3
          caption_v3_2_caption_sample_ratio: '{"long_long_caption":0.455,"long_caption":0.195,"medium_caption":0.1,"short_caption":0.25,"background":0.1,"style":0.7,"shot_type":0.1,"IP":0.5}'
          caption_v3_2_extra_processor: [ 'filter_shot', 'inject_style_v2' ]
      - caption_v3_1:
          caption_v3_1_src: '{"image_caption_v3_1_en_col": 0.5, "image_caption_v3_1_zh_col": 0.5}'
          caption_v3_1_caption_processor: caption_process_v3
          caption_v3_1_caption_sample_ratio: '{"long_long_caption":0.455,"long_caption":0.195,"medium_caption":0.1,"short_caption":0.25,"background":0.1,"style":0.7,"shot_type":0.1,"IP":0.5}'
          caption_v3_1_extra_processor: [ 'filter_shot', 'inject_style_v2' ]
      - caption_v3:
          caption_v3_src: '{"image_caption_v3_en_col": 0.5, "image_caption_v3_zh_col": 0.5}'
          caption_v3_caption_processor: caption_process_v3
          caption_v3_caption_sample_ratio: '{"long_long_caption":0.455,"long_caption":0.195,"medium_caption":0.1,"short_caption":0.25,"background":0.1,"style":0.7,"shot_type":0.1,"IP":0.5}'
          caption_v3_extra_processor: [ 'fix_style', 'filter_shot', 'inject_style_v2' ]
  t2i_index_kwargs:
    index_file:
      # actually used
      - /apdcephfs_zwfy/share_303937731/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/mb256_zw_noocr.json
    multireso: True
    ceph_base_inv: '{"nj10": "/apdcephfs_zwfy/share_303937731", "zwfy": "/apdcephfs_zwfy/share_303937731"}'  # updated
    image_col: cache_image
    image_caption_v3_2_ocr_en_col: caption_v3_2_ocr_en  # updated
    image_caption_v3_2_ocr_zh_col: caption_v3_2_ocr_zh  # updated
    image_caption_v3_2_en_col: caption_v3_2_en  # updated
    image_caption_v3_2_zh_col: caption_v3_2_zh  # updated
    image_caption_v3_1_en_col: caption_v3_1_en  # updated
    image_caption_v3_1_zh_col: caption_v3_1_zh  # updated
    image_caption_v3_en_col: caption_v3_en  # updated
    image_caption_v3_zh_col: caption_v3_zh  # updated
    image_caption_v3_2_ip_en_col: caption_v3_2_ip_en  # updated
    image_caption_v3_2_ip_zh_col: caption_v3_2_ip_zh  # updated
    extra_style_v2_col: style_v2

  # Dataloader
  dataloader_params:
    num_workers: 1
    pin_memory: True
    prefetch_factor: 8
    persistent_workers: True
