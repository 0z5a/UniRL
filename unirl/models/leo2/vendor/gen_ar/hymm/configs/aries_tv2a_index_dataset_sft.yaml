training_config:
  trainer_name: VisualText2AudioDiffTrainer
  micro_batch_size: 16
  gradient_accumulation_steps: 1
  global_seed: 1
  reproduce: False
  profile: False
  tensorboard: True
  output_dir: /apdcephfs_gy2/share_302507476/yutaocui/exp_dir/VisualText2AudioDiff
  task_flag: tv2a_diff
  zero_stage: 2
  max_epochs: 30
  max_training_steps: 300_000
  ckpt_every: 5000
  # resume: "0001"
  
model_config:
  model_name: TV2A-Aries-XXL
  model_type: 1d
  model_precision: bf16
  pretrained_ckpt: /apdcephfs_gy2/share_302507476/yutaocui/exp_dir/VisualText2AudioDiff/log_MAIN_EXP/0017_TV2A_AriesV3_XXL2_20250123_021541_n16_main_exp1_sftv2from140k_data13m_kwratio0d5_interleavedrope_dacvae48k_bs16_ariesv3_xxl_dropclipsync0d1_dropt0d1_cliplargef8_cliphugetext77_syncaddtoaudio_fixed8s/checkpoints/0035000/mp_rank_00_model_states.pt
  sync_modulation_type: synchformer
  visual_feat_type: clip
  use_clip_text_feat: True  # 当前只支持'True'
  media_vocab_size: 16384  # 去掉会报错
  model_kwargs:
    interleaved_audio_visual_rope: True
    enable_learnable_empty_visual_feat: True
    sync_modulation: False
    add_sync_feat_to_audio: True
    focus_attention: False
    use_attention_mask: False
    sync_feat_dim: 768
    condition_dim: 1024  # text condition dim (clip-text)
    audio_in_channels: 64
    clip_dim: 768  # clip visual dim
    patch_size: 1
    rope_dim_list: null
    rope_theta: 10000
    t5_length: 77
    clip_length: 64  # 8s
    sync_length: 192  # 8s

diffusion_config:
  denoise_type: "flow"
  flow_path_type: "linear"
  flow_predict_type: "velocity"
  flow_loss_weight: null
  train_flow_eps: null
  sample_flow_eps: null
  flow_snr_type: "lognorm"
  flow_reverse: True
  flow_solver: "euler"
  train_flow_shift: 1.0
  sample_flow_shift: 1.0
  train_use_flux_shift: False
  sample_use_flux_shift: False
  flux_base_shift: 0.5
  flux_max_shift: 1.15

  pipeline_name: textvisual2audiodacvae


extra_model_config:
  dac_ckp: /apdcephfs_gy2/share_302507476/yutaocui/model_zoo/dac-vae/vae_64d_48k_600kiter.pth
  vae_type: dac-24khz-double
  vae_precision: fp32

# t5 and clip
t5_path: /apdcephfs_gy2/share_302507476/1_public_models/flan-ul2-text-encoder/
clip_path: /apdcephfs_gy2/share_302507476/1_public_models/clip-vit-large-patch14/
  
optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.00001
    betas: [0.9, 0.95]
    eps: 0.000001
    weight_decay: 0.01
  
lr_scheduler_config:
  lr_scheduler_name: WarmupLR
  lr_scheduler_params:
    warmup_num_steps: 0
    warmup_max_lr: 0.00001

sampling_config:
