# CUDA_VISIBLE_DEVICES=0,1 sh jobs/run_train.sh /apdcephfs_cq8/share_2938211/chenyangqi/hunyuan_multimoda_gen_ar_image_dev/hymm/configs/emu2_cliptoken2image_diffusion.yaml

training_config: # FIXME
  trainer_name: ClipToken2ImageDiffusionTrainer # fixe
  micro_batch_size: 4
  gradient_accumulation_steps: 1
  global_seed: 1
  reproduce: False
  profile: False
  task_flag: test_base
  zero_stage: 2

  max_epochs: 10
  max_training_steps: 10_000_000
  ckpt_every: 100

  validation_at_steps: []
  validation_every: 5000
  validation_metrics: []

sampling_config: # FIXME
  image_size: 256
  image_seq_len: 1024
  load_key:  .
  batch_size: 1
  evaluation_metrics: []
  evaluation_metrics_save_image: False
  interactive: False

model_config:
  model_name: VQ-SDXL-EMU2
  # model_name: SDXL-EMU2
  model_precision: bf16
  ckpt: /apdcephfs_sh7/share_301124792/chenyangqi/pretrained_ckpt/BAAI/Emu2-Gen/unet/unet.pt
  model_kwargs:
    in_channels: 4
    # patch_size: 4
    # rope_dim_list: null
    # rope_theta: 256
    # condition_dim: 1
    # use_attention_mask: False

extra_model_config:
  vae_type: 88-vae-sdxl
  vae_precision: bf16

  clipvision_type: 1414-evaclip-emu2
  clipvision_precision: bf16


diffusion_config:
  denoise_type: "euler"

  ddpm_noise_schedule: "scaled_linear"
  ddpm_predict_type: "v_prediction"
  enforce_zero_terminal_snr: False
  ddpm_learn_sigma: False
  ddpm_beta_start: 0.00085
  ddpm_beta_end: 0.012
  ddpm_noise_offset: 0.0
  ddpm_shift_snr: 1.0

  # flow_path_type: "linear"
  # flow_predict_type: "velocity"
  # flow_loss_weight: null
  # train_flow_eps: null
  # sample_flow_eps: null
  # flow_snr_type: "lognorm"
  # flow_reverse: True
  # flow_solver: "euler"
  # train_flow_shift: 1.0
  # sample_flow_shift: 1.0
  # train_use_flux_shift: False
  # sample_use_flux_shift: False
  # flux_base_shift: 0.5
  # flux_max_shift: 1.15

  pipeline_name: cliptoken2image


optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.0001
    betas: [0.9, 0.95]
    eps: 0.000001
    weight_decay: 0.01

lr_scheduler_config:
  lr_scheduler_name: WarmupCosineLR
  lr_scheduler_params:
    warmup_num_steps: 5000
    total_num_steps: 100000


dataloader_config:
  image_size: 256
  crop_type: random
  image_len: 1024
  tokenizer: phi-2 # fixme
  text_len: 256
  uncond_p: 0.0
  index_file:
  - /apdcephfs_cq8/share_1367250/milesjyang/small_image_arrow_dataset/debug_set_cq8.json
  multireso: False
  mix_scale: False
  anchor_size: 256
  fast_shuffle: True
  index_kwargs:
    image_caption_rate: 0.5
    image_text_arrow_suffix: _trans
    image_text_col: trans
    image_caption_arrow_suffix: _caption
    image_caption_col: llava_caption
    index_strategy: uniform
    index_probability: null
    caption_sample_ratio: null
  dataloader_params:
    num_workers: 4
  