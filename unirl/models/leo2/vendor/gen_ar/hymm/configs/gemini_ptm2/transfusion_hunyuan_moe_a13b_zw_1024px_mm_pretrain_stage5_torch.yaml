# IMPORTANT NOTE: Write PTM args in YAML format:
# 0. all arguments specified here are one-one correspondences with PTM arguments; un-specified arguments use PTM default values.
# 1. arguments like '--hidden-size=2560' are written as 'hidden-size: 2560' (see below, note the space after colon).
# 2. YAML format is like a tree, and only the leaf nodes are considered as arguments.
#    Non-leaf nodes and structures are ignored, so arguments can be grouped as you like.
# 3. arguments like '--sequence-parallel' can be written as 'enabled: \n  - sequence-parallel' (see below, note the indent).
#    multiple `enabled` arguments in a same sub-tree must be put in a `enabled` list (see below for an example).

__GLOBAL_VARS__:
  _DEFAULT_OUTPUT_PATH: ""
  DATA_PATH: "/root/dummy_data"
  OUTPUT_PATH: ${oc.env:OUTPUT_PATH,${__GLOBAL_VARS__._DEFAULT_OUTPUT_PATH}}

MODEL_ARGS:
  model-name: multimodal.hunyuan-moe-a13b-gemini
  model-structure: HunyuanMultimodal

  # Mcore required.
  num-layers: 2
  hidden-size: 4096
  num-attention-heads: 32
  ffn-hidden-size: 3072
  kv-channels: 128
  max-position-embeddings: 23040
  seq-length: ${MODEL_ARGS.max-position-embeddings}
  vocab-size: 133120
  normalization: RMSNorm
  num-query-groups: 8
  num-experts: 64
  init-method-std: 0.012757759
  moe-router-topk: 8
  moe-ffn-hidden-size: 3072
  moe-shared-expert-intermediate-size: 3072
  # moe-layer-freq: '([0]+[1]*1)'
  moe-layer-freq: '([1]*2)'
  moe-router-load-balancing-type: aux_loss
  moe-token-dispatcher-type: flex
  moe-router-dtype: fp32
  attention-dropout: 0.0
  hidden-dropout: 0.0

  init-device: meta  # [cpu, cuda, meta] pure torch specific
  autocast-dtype: bf16  # pure torch specific
  enabled:
    # common
    # - bf16
    # mcore
    - qk-layernorm
    - group-query-attention
    - swiglu
    - use-mcore-models
    - moe-grouped-gemm
    - use-hunyuan-arch
    - disable-bias-linear

  patch-size: 1
  rope-type-extended: "2d"
  rope-scaling: 1.0
  # moe-impl: deepseek
  moe-impl: ep_moe
  gate-impl: deepseek
  cond-image-type: vae_vit
  cond-token-attn-type: joint_full

EXTRA_MODEL_ARGS:
  enabled:
    - use-vae
    - use-vit
  vae-type: 16x16x4-32c-hy-image
  vae-latent-dim: 32
  vae-precision: fp32
  vae-autocast-dtype: fp16
  vit-type: siglip2-so400m-patch16-naflex


DENOISE_ARGS:
  denoise-type: flow
  flow-path-type: linear
  flow-predict-type: velocity
  flow-snr-type: lognorm
  flow-reverse: True
  flow-shift: 3.0


DATA_ARGS:
  tokenizer-type: NullTokenizer
  dataloader-type: external

  # extra args provider
  tokenizer-name: hunyuan-dense-7b-tokenizer-refactor
  tokenizer-class: tokenizer_wrapper.TokenizerWrapper
  shuffle-by: dataset
  fast-shuffle: True
  use-numpy-indices: True
  add-timestep-token: True
  add-image-shape-token: True
  use-front-boi-token: True
  use-front-src-image: True
  use-joint-image-feature: True
  sequence-template: pretrain
  combined-iterator-sampling-mode: fixed
  cos-base:
    - "/cos_nj1/share_302243067 -> /apdcephfs_wza/milesjyang/{bucket}"
    - "/cos_zw1/share_303793872 -> /apdcephfs_wza/milesjyang/{bucket}"
    - "/apdcephfs_zwfy/share_303937731 -> /apdcephfs_wza/share_303937731"
  cos-file-is-encrypted: True
  enable-resample: True
  ignore-start-tokens: ["<think>", "<recaption>"]

  # vae
  vae-image-token-length: 4096
  # -- resolution group kwargs
  reso-base-size: 1024
  reso-align: 16
  # reso-preset: sdxl
  reso-mode: sdxl+
  reso-aspect-ratios: ["3:4", "9:16", "4:3", "16:9"] # w:h
  # vit
  vit-image-token-length: 1024

  modality: [ text, vae_image, vit_image ]
  # sampling-probs: '{"t2i": 0.32, "t2i_ocr": 0.15, "lm": 0.15, "lm_2": 0.13, "mmu_caption": 0.15, "mmu": 0.05}'
  sampling-probs: '{"t2i": 1.0}'

  # Dataloader
  num-workers: 4
  prefetch-factor: 2


