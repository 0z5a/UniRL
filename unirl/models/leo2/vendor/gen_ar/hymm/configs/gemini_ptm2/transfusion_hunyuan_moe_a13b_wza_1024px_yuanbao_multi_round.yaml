TRAINING_ARGS:
  micro-batch-size: 1
  gradient-accumulation-steps: 64
  global-batch-size: ${mul:${div:${mul:${oc.env:HOST_GPU_NUM}, ${oc.env:HOST_NUM}}, ${mul:${mul:${MODEL_PARALLEL_ARGS.tensor-model-parallel-size}, ${MODEL_PARALLEL_ARGS.pipeline-model-parallel-size}}, ${MODEL_PARALLEL_ARGS.context-parallel-size}}}, ${mul:${TRAINING_ARGS.gradient-accumulation-steps}, ${TRAINING_ARGS.micro-batch-size}}} # GLOBAL_BATCH_SIZE = HOST_GPU_NUM * HOST_NUM / (TP_SIZE*PP_SIZE*CP_SIZE) * GRADIENT_ACCUMULATION_STEPS * MICRO_BATCH_SIZE
  dp-shard: 8 # torch
  lr: 1e-6
  train-iters: 100_000_000
  lr-decay-iters: 100_000_000
  lr-decay-style: cosine
  optimizer: adam
  adam-beta1: 0.9
  adam-beta2: 0.95
  adam-eps: 0.000001  # ptm2对应的是adam-eps参数（默认值1e-8） torch对应的是eps参数
  min-lr: 1e-6
  weight-decay: 0.1
  lr-warmup-iters: 0
  clip-grad: 1.0
  eval-interval: 1000
  eval-iters: 0
  seed: 1234
    # - optimizer-cpu-offload
    # - use-precision-aware-optimizer
  __FROZEN__OPTIMIZER_ARGS:  # pure torch specific
    optimizer_params:
      lr: ${TRAINING_ARGS.lr}
      betas:
      - ${TRAINING_ARGS.adam-beta1}
      - ${TRAINING_ARGS.adam-beta2}
      weight_decay: ${TRAINING_ARGS.weight-decay}
      eps: ${TRAINING_ARGS.adam-eps}
  __FROZEN__LR_SCHEDULER_ARGS:  # pure torch specific
    lr_scheduler_params:
      num_warmup_steps: ${TRAINING_ARGS.lr-warmup-iters}
      num_training_steps: ${TRAINING_ARGS.train-iters}
      min_lr: ${TRAINING_ARGS.min-lr}

  # loss related
  image-loss-weight: 5.0
  moe-aux-loss-coeff: 0.04 # 0.005 * 8 = 0.04
  enabled:
    - moe-aux-loss
    # - init-save  # pure torch specific


PERFORMANCE_ARGS:
  manual-gc-interval: 5
  recompute-granularity: full
  recompute-method: uniform  # gradient checkpointing
  recompute-num-layers: 1  # gradient checkpointing
  enabled:
    - manual-gc
    - use-flash-attn
    - moe-enable-deepep
    - enable-experimental
    - moe-permute-fusion
    - moe-router-fusion
    # - moe-shared-expert-overlap
    - overlap-grad-reduce
    - overlap-param-gather


MODEL_PARALLEL_ARGS:
  tensor-model-parallel-size: 1
  pipeline-model-parallel-size: 4
  pipeline-model-parallel-layout: Et*7|t*9|t*9|t*7L # 32layer
  expert-model-parallel-size: 8
  context-parallel-size: 1
  enabled:
    - use-distributed-optimizer
    # - tp-comm-overlap
    # - sequence-parallel


CHECKPOINT_ARGS:
  ckpt-format: torch_dist
  dist-ckpt-strictness: log_all
  save-interval: 25
  save: ${__GLOBAL_VARS__.OUTPUT_PATH}/ckpt
  # load: /apdcephfs_wza/2_public_experiments/log_EXP_gemini_beta/ckczzjzhang/ptm2/7b_moe_editing_sft_20251114_v23_4/hf
  # load: /apdcephfs_wza/lucazzliu/exp/202601/20260119/Gemini_1.7_launch4/DM10Inv1_1c1t6p10_295v3EMT23v21ab2g3d_mulTWonly_type4_wKL_c2.5r1_f4_L1s50_dadv2_style2_lr2e-6_ref0.25_X2/log_EXP/0001_hunyuan_moe_7b_a13b_vocab_expanded_20260119_13_n16_DM10Inv1_1c1t6p10_295v3EMT23v21ab2g3d_mulTWonly_type4_wKL_c2.5r1_f4_L1s50_dadv2_style2/checkpoints/0000025/hf
  load: /apdcephfs_wza/2_public_experiments/log_EXP_gemini_beta/ckczzjzhang/ptm2/reda0119/converted_ptm2_ckpt
  ckpt-step: 1

  # key-mapping: moe_a13b_ptm2_to_fsdp2
  generation-config: ${oc.env:ASSETS_BASE}/pretrained_llm/HunyuanImage3-MultiRound/generation_config.json
  enabled:
    - fuse-experts-in-load
    - resume        # if ${save} exists, execute the resume mode: load ckpt from ${save} first. if ${save} does not exist, load from ${load}.
    - use-dist-ckpt
    - no-load-optim # does not work in resume mode
    - no-save-rng   # don't save rng to avoid affecting the random settings of the data
    - finetune      # does not work in resume mode, but first run can reset iteration
    - ckpt-fully-parallel-load
    - ckpt-fully-parallel-save
    # - swap-gate-and-up
    # - load-remove-prefix

LOGGING_ARGS:
  log-interval: 1
  tensorboard-dir: ${__GLOBAL_VARS__.OUTPUT_PATH}/events
  saved-training-batch-dir: ${__GLOBAL_VARS__.OUTPUT_PATH}/saved_training_data
  save-n-training-data: 0
  enabled:
    - log-timers-to-tensorboard
    - log-memory-to-tensorboard
    - log-num-zeros-in-grad
    - log-params-norm
    - log-validation-ppl-to-tensorboard
    - log-throughput

