      message_col: messages
    index_keys:
      image_key: cache_image
      url_cos_key: url_cos


TRAINING_ARGS:
  micro-batch-size: 1
  global-batch-size: 32 # HOST_GPU_NUM * HOST_NUM / (TP_SIZE*PP_SIZE*CP_SIZE) * GRADIENT_ACCUMULATION_STEPS
  # dp-shard: 32 # torch
  lr: 1e-5
  train-iters: 100_000_000
  lr-decay-iters: 100_000_000
  lr-decay-style: cosine
  optimizer: adam
  adam-beta1: 0.9
  adam-beta2: 0.95
  min-lr: 1e-5
  weight-decay: 0.1
  lr-warmup-iters: 500
  clip-grad: 1.0
  eval-interval: 1000
  eval-iters: 0
  seed: 1234
    # - optimizer-cpu-offload
    # - use-precision-aware-optimizer
  __FROZEN__OPTIMIZER_ARGS:  # pure torch specific
    optimizer_params:
      lr: ${TRAINING_ARGS.lr}
      betas:
      - ${TRAINING_ARGS.adam-beta1}
      - ${TRAINING_ARGS.adam-beta2}
      weight_decay: ${TRAINING_ARGS.weight-decay}
      eps: 0.000001
  __FROZEN__LR_SCHEDULER_ARGS:  # pure torch specific
    lr_scheduler_params:
      num_warmup_steps: ${TRAINING_ARGS.lr-warmup-iters}
      num_training_steps: ${TRAINING_ARGS.train-iters}
      min_lr: ${TRAINING_ARGS.min-lr}

  # loss related
  image-loss-weight: 5.0
  moe-aux-loss-coeff: 0.005
  enabled:
    - moe-aux-loss
    # - init-save  # pure torch specific


PERFORMANCE_ARGS:
  manual-gc-interval: 5
  recompute-granularity: full
  recompute-method: uniform  # gradient checkpointing
  recompute-num-layers: 1  # gradient checkpointing
  enabled:
    - manual-gc
    - use-flash-attn
    - moe-enable-deepep
    - enable-experimental
    - moe-permute-fusion
    - moe-router-fusion
    # - moe-shared-expert-overlap
    - overlap-grad-reduce
    - overlap-param-gather


MODEL_PARALLEL_ARGS:
  tensor-model-parallel-size: 1
  pipeline-model-parallel-size: 4
  pipeline-model-parallel-layout: Et*7|t*9|t*9|t*7L # 32layer
  expert-model-parallel-size: 4
  context-parallel-size: 2
  enabled:
    - use-distributed-optimizer
    # - tp-comm-overlap
    # - sequence-parallel


