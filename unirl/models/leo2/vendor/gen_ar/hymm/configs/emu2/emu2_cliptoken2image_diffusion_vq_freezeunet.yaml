# CUDA_VISIBLE_DEVICES=0,1 sh jobs/run_train.sh /apdcephfs_cq8/share_2938211/chenyangqi/hunyuan_multimoda_gen_ar_image_dev/hymm/configs/emu2_cliptoken2image_diffusion.yaml

training_config: # FIXME
  trainer_name: ClipToken2ImageDiffusionTrainer # fixe
  micro_batch_size: 6
  gradient_accumulation_steps: 1
  global_seed: 1
  reproduce: False
  profile: False
  task_flag: p512_merged_0918_300m_drop_aigc_vq_loss_freezeunet_base
  zero_stage: 2

  max_epochs: 1000 # defaul is 10 for 2 hours
  max_training_steps: 10_000_000
  ckpt_every: 500

  validation_at_steps: []
  validation_every: 500
  validation_metrics: []

sampling_config: # FIXME
  # image_size: 256 # FIXME what is the difference with image_size in dataloader config? do not repeat
  # image_seq_len: 1024 # only for next token prediction LLM; dangerous ! do not repeat
  load_key:  module
  # load_key:  .

  batch_size: 1
  evaluation_metrics: []
  evaluation_metrics_save_image: False
  interactive: False

model_config:
  model_name: VQ-SDXL-EMU2
  # model_name: SDXL-EMU2
  model_precision: bf16
  training_parts: quantizer
  # ckpt: /apdcephfs_sh7/share_301124792/chenyangqi/pretrained_ckpt/BAAI/Emu2-Gen/unet/unet.pt
  ## ckpt arg only for sampler; training use resume
  ckpt: /apdcephfs_cq8/share_2938211/chenyangqi/hunyuan_multimoda_gen_ar_image_dev/log_EXP/0047_VQ_SDXL_EMU2_20241030_115752_n1_baseline/checkpoints/0000100/mp_rank_00_model_states.pt
  # ckpt: /apdcephfs_cq8/share_2938211/chenyangqi/hunyuan_multimoda_gen_ar_image_dev/log_EXP/0049_VQ_SDXL_EMU2_20241030_125259_n1_baseline/checkpoints/0000100/mp_rank_00_model_states.pt
  model_kwargs:
    in_channels: 4
    VQModel: 
      embed_dim: 256  # embedding of code feature
      n_embed: 16384
      monitor: val/rec_loss
      ddconfig:
        # double_z: false
        z_channels: 1792 # dim of emu2  # output dimension of conv encoder, input dimension of conv decoder


    # patch_size: 4
    # rope_dim_list: null
    # rope_theta: 256
    # condition_dim: 1
    # use_attention_mask: False

extra_model_config:
  vae_type: 88-vae-sdxl
  vae_precision: bf16

  clipvision_type: 1414-evaclip-emu2
  clipvision_precision: bf16
  pooling_stride: null # use pooling stride in default emu2 model


diffusion_config:
  denoise_type: "euler"

  ddpm_noise_schedule: "scaled_linear"
  ddpm_predict_type: "epsilon"
  enforce_zero_terminal_snr: False
  ddpm_learn_sigma: False
  ddpm_beta_start: 0.00085
  ddpm_beta_end: 0.012
  ddpm_noise_offset: 0.0
  ddpm_shift_snr: 1.0

  # flow_path_type: "linear"
  # flow_predict_type: "velocity"
  # flow_loss_weight: null
  # train_flow_eps: null
  # sample_flow_eps: null
  # flow_snr_type: "lognorm"
  # flow_reverse: True
  # flow_solver: "euler"
  # train_flow_shift: 1.0
  # sample_flow_shift: 1.0
  # train_use_flux_shift: False
  # sample_use_flux_shift: False
  # flux_base_shift: 0.5
  # flux_max_shift: 1.15

  pipeline_name: cliptoken2image


optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.0001
    betas: [0.9, 0.95]
    eps: 0.000001
    weight_decay: 0.01

lr_scheduler_config:
  lr_scheduler_name: WarmupCosineLR
  lr_scheduler_params:
    warmup_num_steps: 5000
    total_num_steps: 100000


dataloader_config:
  image_size: 1024 # necessary for emu2
  uncond_p: 0.1
  tokenizer: phi-2 # fixme
  text_len: 256
  index_file:
  - /apdcephfs_nj8/share_301739632/jarvizhang/workspace/hunyuan_multimodal/__data/dataset_image/p512_merged_0918_300m_drop_aigc.json
  multireso: False
  fast_shuffle: True
  index_kwargs:
    image_caption_rate: 0.95
    image_text_arrow_suffix: _trans
    image_text_col: trans
    image_caption_arrow_suffix: _caption_v2
    image_caption_col: result
    index_strategy: uniform
    index_probability: null
    caption_sample_ratio: '{"long caption": 0.50, "short caption": 0.45, "background": 0.8, "shot type": 0.8, "style": 0.8, "light": 0.8, "atmosphere": 0.8, "camera movement": 0.8}'
      # long caption: 0.50
      # short caption: 0.45
      # background: 0.8
      # shot type: 0.8
      # style: 0.8
      # light: 0.8
      # atmosphere: 0.8
      # camera movement: 0.8 

  # not used in the TextImageArrowStream at 1030
  crop_type: random
  image_len: 16384  # for next token llm, not used here; 1024 = 32 * 32 = (256/8) * (256/8); 4096 = 64 * 64 = (512/8) * (512/8); 4096*4 = 16384 = 128 * 128 = (1024/8) * (1024/8)
  mix_scale: False
  anchor_size: 1024  # for next token llm, not used here; for multireosolution training
  
  dataloader_params:
    num_workers: 8
  