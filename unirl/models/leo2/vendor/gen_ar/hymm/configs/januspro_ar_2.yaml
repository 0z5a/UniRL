training_config:
  trainer_name: Text2ImageARTrainer2
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  global_batch_size: null
  global_seed: 1
  reproduce: False
  profile: False
  zero_stage: 2
  log_every: 10
  tensorboard: True
  training_parts: null
  gradient_checkpoint: False
  gradient_checkpoint_layers: -1

  use_ema: False
  distributed_ema: False
  ema_precision: bf16
  ema_warmup: True
  ema_decay: null
  ema_warmup_power: null

  max_epochs: 20
  max_training_steps: 20_000
  ckpt_every: 2500

  init_save: False
  final_save: True

  resume: null
  resume_dataloader: False
  no_load_optim_states: False
  no_load_ema: False
  default_rank0_ss: False
  fix_lr_scheduler: False

  validation_at_steps: [100]
  validation_every: 5000
  validation_metrics: null # metrics will be calculated during train
  validation_metrics_save_image: False

sampling_config:
  sample_save_path: vis/janus_pro_baseline_format
  ckpt: null
  no_load_model: True
  load_key: module
  metric_image_size: 384
  metric_batch_size: 1
  metric_save_path: /apdcephfs_gy2/share_302507476/yutaocui/exp_dir/text2image_ar/log_COUNT_COT_EXP/janus_pro_baseline_counting_eval.json
  evaluation_metrics_save_image: True
  evaluation_metrics: [counting_eval] #[fid@coco30k, clip_score@coco30k, hpsv2@coco30k, t2i_compbench@t2i_compbench]
  sample_image_size: 384
  sample_batch_size: 1
  rerank: 1
  seed_type: auto
  seed: 123456
  format_prompt_type: janus # janus-cot
  tokenizer_infer_fn: encode_ar_text_only_infer
  # guidance_scale: 0.0
  logits_processors_cfg:
  - SliceVocabLogitsWarper:
      vocab_start: 0
      vocab_end: 16384
  - CfgLogitsWarper:
      guidance_scale: 6.0
  - TopKLogitsWarper:
      top_k: 128
  - TopPLogitsWarper:
      top_p: 0.9

model_config:
  model_name: janus-pro-7b
  pretrained_ckpt: /apdcephfs_gy2/share_302507476/1_public_models/hymm_ar_assets/pretrained_llm/Janus-Pro-7B/transformed_model.pt
  load_llm_to_mllm: True
  expand_keys: ["transformer.wte.weight", "lm_head.weight"]
  model_precision: bf16
  autocast_dtype: bf16
  media_vocab_size: 16384
  # frozen_layers: ["ln_f", "transformer_layers"]  # "transformer_layers0-6", "lm_head", "wte"
  # trainable_vocab_indices:
  #   - 151676  # <iw>
  #   - 151677  # <ih>
  #   - 151665  # <boi>
  #   - 151675  # <cfg>
  #   - 151674  # <pad>
  # enable_image_vocab_train: True
  enable_image_und: True
  vision_model_type: janus-siglip_large_patch16_384
  enable_train_visual_encoder: True
  # enable_image_und: False
  # enable_train_visual_encoder: True
  enable_sep_modal_adaptors: True
  training_parts: auto
  cfg_token_tag: "<｜▁pad▁｜>"
  pad_token_tag: "<｜▁pad▁｜>"
  boi_token_tag: "<begin_of_image>"

  model_kwargs:
    block_size: 1280

extra_model_config:
  vae_type: 1616-vq-janus
  vae_precision: bf16

optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.001
    betas: [0.9, 0.95]
    eps: 0.000001
    weight_decay: 0.01

lr_scheduler_config:
  lr_scheduler_name: WarmupLR #WarmupCosineLR
  lr_scheduler_params:
    warmup_num_steps: 600
    warmup_max_lr: 0.001

dataloader_config:
  # index_file: /apdcephfs_nj10/share_301739632/ckczzjzhang/idk_data/merged_0918_300m_drop_aigc_dedup_remove_civitai_30_source_remove_wrong_size_mb256.json
  index_file: /apdcephfs_nj8/share_301739632/jarvizhang/workspace/hymm_ar/__data/dataset_image/imagenet_1k.json
  training_image_size: 256  # training image size is used in non-multireso mode
  image_token_length: 576  # must be largest length of image token sequence in multireso mode
  image_token_offset: 102400  # equals to padded_vocab_size
  use_pre_extracted_token: False
  text_token_length: 256
  uncond_p: 0.1
  tokenizer_name: janus-pro-7b
  # multireso: True
  add_iw_ih_token: False #True
  mix_scale: False
  anchor_size: 256
  shuffle_by: dataset
  fast_shuffle: True
  debug: False
  index_kwargs:
    image_text_col: text_source
    index_strategy: uniform
    index_probability: null
  dataloader_params:
    num_workers: 8
    pin_memory: True
    prefetch_factor: 4
