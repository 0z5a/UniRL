training_config:
  trainer_name: InstructionTuningARTrainer
  micro_batch_size: 8
  gradient_accumulation_steps: 1
  global_batch_size: null
  global_seed: 1
  reproduce: False
  profile: False
  zero_stage: 2
  log_every: 10
  tensorboard: True
  training_parts: null
  gradient_checkpoint: False
  gradient_checkpoint_layers: -1

  use_ema: False
  distributed_ema: False
  ema_precision: bf16
  ema_warmup: True
  ema_decay: null
  ema_warmup_power: null

  max_epochs: 64
  max_training_steps: 1_000_000_000
  ckpt_every: 1000

  init_save: False
  final_save: True

  resume: null
  resume_dataloader: False
  no_load_optim_states: False
  no_load_ema: False
  default_rank0_ss: False
  fix_lr_scheduler: False

  validation_at_steps: [100]
  validation_every: 5000
  validation_metrics: null # metrics will be calculated during train
  validation_metrics_save_image: False

sampling_config:
  ckpt: null
  load_key: module
  metric_image_size: 256
  metric_batch_size: 1
  evaluation_metrics: [fid@coco30k, clip_score@coco30k, hpsv2@coco30k]
  sample_image_size: 256
  sample_batch_size: 1
  seed_type: auto
  seed: 123456
  logits_processors_cfg:
  - SliceVocabLogitsWarper:
      vocab_start: 51200
      vocab_end: 67584
  - CfgLogitsWarper:
      guidance_scale: 4.5
  - TemperatureLogitsWarper:
      temperature: 1.0
  - TopKLogitsWarper:
      top_k: 4096
  - TopPLogitsWarper:
      top_p: 0.9
  inpainting_blend: False

model_config:
  model_name: phi-2
  # pretrained_ckpt: /apdcephfs_gy2/share_302507476/ckczzjzhang/output_ar/0026_phi_2_20241121_011954_n32_ar_baseline/checkpoints/0615000/mp_rank_00_model_states.pt
  pretrained_ckpt: /apdcephfs_nj10/share_301739632/ckczzjzhang/output_ar/0026_phi_2_20241121_011954_n32_ar_baseline/checkpoints/0615000/mp_rank_00_model_states.pt
  load_llm_to_mllm: False
  expand_keys: ["transformer.wte.weight", "lm_head.weight", "lm_head.bias"]
  model_precision: bf16
  autocast_dtype: bf16
  media_vocab_size: 16384
  model_kwargs:
    block_size: 2304 # change from 2048 to 2304 for instruction tuning

extra_model_config:
  vae_type: 88-vqgan-hy_241024
  vae_precision: bf16

optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.000001
    betas: [0.9, 0.95]
    eps: 0.000001
    weight_decay: 0.01

lr_scheduler_config:
  lr_scheduler_name: WarmupLR
  lr_scheduler_params:
    warmup_num_steps: 5000
    warmup_max_lr: 0.000001


dataloader_config:
  index_file: ["/apdcephfs_nj10/share_301739632/0_public_datasets/image_editing/HIVE/base.json", "/apdcephfs_nj10/share_301739632/0_public_datasets/image_inpainting/v1/base.json"]
  editing_test_arrow: /apdcephfs_nj10/share_301739632/0_public_datasets/image_editing/HIVE/test.arrow
  # editing_test_arrow: /apdcephfs_gy2/share_302507476/0_public_datasets/image_editing/HIVE/test.arrow
  inpainting_test_arrow: /apdcephfs_nj10/share_301739632/0_public_datasets/image_inpainting/v1/test.arrow
  # inpainting_test_arrow: /apdcephfs_gy2/share_302507476/0_public_datasets/image_inpainting/v1/test.arrow
  image_token_length: 1024  # must be largest length of image token sequence
  image_token_offset: 51200  # equals to padded_vocab_size
  text_token_length: 256
  tokenizer_name: phi-2
  add_iw_ih_token: True
  multireso: False
  mix_scale: False
  anchor_size: 256
  shuffle_by: dataset
  fast_shuffle: True
  debug: False
  index_kwargs:
    eiditing_src_img_token_col: src_img_token_256x256_88-vqgan-hy_241024
    eiditing_tgt_img_token_col: tgt_img_token_256x256_88-vqgan-hy_241024
    inpainting_mask_dataset_path: /apdcephfs_gy2/share_302507476/0_public_datasets/image_inpainting/v1/irregular_mask
    inpainting_mask_dataset_set: train
    inpainting_img_token_col: img_token_88-vqgan-hy_241024
    inpainting_caption_rate: 0.95
    inpainting_text_col: text
    inpainting_caption_col: caption
    inpainting_caption_sample_ratio: '{"long caption": 0.50, "short caption": 0.45, "background": 0.0, "shot type": 0.0, "style": 0.0, "light": 0.0, "atmosphere": 0.0, "camera movement": 0.0}'
    instruction_uncond_p: 0.1
    index_strategy: uniform
    index_probability: null
  dataloader_params:
    num_workers: 4
    pin_memory: True
    prefetch_factor: 2
