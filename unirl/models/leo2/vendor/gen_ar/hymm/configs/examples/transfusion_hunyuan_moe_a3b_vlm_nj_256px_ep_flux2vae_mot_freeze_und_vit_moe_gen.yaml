# IMPORTANT NOTE: Write PTM args in YAML format:
# 0. all arguments specified here are one-one correspondences with PTM arguments; un-specified arguments use PTM default values.
# 1. arguments like '--hidden-size=2560' are written as 'hidden-size: 2560' (see below, note the space after colon).
# 2. YAML format is like a tree, and only the leaf nodes are considered as arguments.
#    Non-leaf nodes and structures are ignored, so arguments can be grouped as you like.
# 3. arguments like '--sequence-parallel' can be written as 'enabled: \n  - sequence-parallel' (see below, note the indent).
#    multiple `enabled` arguments in a same sub-tree must be put in a `enabled` list (see below for an example).

__GLOBAL_VARS__:
  _DEFAULT_OUTPUT_PATH: "/apdcephfs_wza/jarvizhang/pure_torch/hunyuan_moe_a13b_example"
  DATA_PATH: "/root/dummy_data"
  OUTPUT_PATH: ${oc.env:OUTPUT_PATH,${__GLOBAL_VARS__._DEFAULT_OUTPUT_PATH}}

MODEL_ARGS:
  model-name: multimodal.hunyuan-moe-a3b-vlm-gemini
  model-structure: HunyuanMultimodal

  # Mcore required.
  num-layers: 48
  hidden-size: 2048
  num-attention-heads: 32
  ffn-hidden-size: 6912
  kv-channels: 128
  max-position-embeddings: 6144
  seq-length: ${MODEL_ARGS.max-position-embeddings}
  vocab-size: 126309
  normalization: RMSNorm
  num-query-groups: 4
  num-experts: 128
  init-method-std: 0.012757759
  moe-router-topk: 8
  moe-ffn-hidden-size: 768
  moe-shared-expert-intermediate-size: 768
  #moe-layer-freq: '([0]+[1]*1)'
  moe-layer-freq: '([0]+[1]*47)'
  moe-router-load-balancing-type: aux_loss
  moe-token-dispatcher-type: flex
  moe-router-dtype: fp32
  attention-dropout: 0.0
  hidden-dropout: 0.0

  init-device: meta  # [cpu, cuda, meta] pure torch specific
  autocast-dtype: bf16  # pure torch specific
  enabled:
      # common
    # - bf16
      # mcore
    - qk-layernorm
    - group-query-attention
    - swiglu
    - use-mcore-models
    - moe-grouped-gemm
    - use-hunyuan-arch
    - disable-bias-linear
      # torch
    - split-qkv
    - split-gate-and-up
    # mot
    - use-mot
    - mot-und-frozen
    - mot-embed-norm-lm-head-frozen

  patch-size: 1
  rope-type-extended: "xdrope"
  rope-scaling: 1000.0
  moe-impl: ep_moe
  cond-image-type: vae_vit
  cond-token-attn-type: full_causal


EXTRA_MODEL_ARGS:
  enabled:
    - use-vae
    - use-vit
    - vit-frozen
  vae-type: 16x16-128c-flux2
  vae-latent-dim: 128
  vae-precision: fp32
  vae-autocast-dtype: fp32
  vit-type: anyres-vit-for-a3b


DENOISE_ARGS:
  denoise-type: flow
  flow-path-type: linear
  flow-predict-type: velocity
  flow-snr-type: lognorm
  flow-reverse: True
  flow-shift: 1.0


DATA_ARGS:
  tokenizer-type: NullTokenizer
  dataloader-type: external

  # extra args provider
  tokenizer-name: hymm-v3-5
  tokenizer-class: tokenization_hymm_v3_5.HunyuanMultimodalV3d5TokenizerFast
  conv-template: hymm-v3-5
  sequence-template: pretrain
  gen-image-template: tool_call_v3.5
  shuffle-by: dataset
  fast-shuffle: True
  combined-iterator-sampling-mode: fixed
#  cos-base:
#    - "/cos_nj1/share_302243067 -> /apdcephfs_wza_common/hunyuan_data/{stem2}"
#  cos-file-is-encrypted: True
  enable-resample: True
  ignore-start-tokens: []
  enabled:
    - no-shuffle
    - use-numpy-indices
    - add-timestep-token
#    - add-image-shape-token
    - use-front-boi-token
    - use-front-src-image

  # vae
  vae-image-token-length: 256
  # -- resolution group kwargs
  reso-base-size: 256
  reso-step: 16
  reso-align: 16
  reso-preset: zigzag
  # vit
  vit-image-token-length: 4354  # 2048*2048/32/32+(2048*4/32)+2

  modality: [ text, vae_image, vit_image ]
  sampling-probs: '{"t2i_ob": 1.0}'

  und-token-type: [ "bos", "text", "boi", "vit", "eoi", "joint_image_sep", "eoi", "eos", "pad", "vae_info" ]
  gen-token-type: [ "vae" ]

  # Sequence pack
  pack-buffer-factor: 32

  # Dataloader
  num-workers: 16
  prefetch-factor: 4


__FROZEN__DATA_ARGS:

  t2i_ob_task_kwargs:
    # required
    batch_size: 1
    modality: [ vae_image ]
    max_token_length: 512
    attn_type: flex
    shuffle_seed: 1111
    sequence_pack: True
    # image caption
    uncond_p: 0.1
    prompt_token_length: 256
    patcher_names: []
    instruct_type: none
    image_caption_resource:
      - caption_v4_ocr:
          caption_v4_ocr_src: '{"caption_v4_ocr_en_col": 0.5, "caption_v4_ocr_zh_col": 0.5}'
          caption_v4_ocr_caption_processor: caption_process_v4
          caption_v4_ocr_caption_sample_ratio: '{"long_long_caption":0.99,"long_caption":0.001,"medium_caption":0.003,"short_caption":0.006,"background":0.1,"style":0.7,"shot_type":0.1,"IP":0.5}'
      - caption_v4:
          caption_v4_src: '{"caption_v4_en_col": 0.5, "caption_v4_zh_col": 0.5}'
          caption_v4_caption_processor: caption_process_v4
          caption_v4_caption_sample_ratio: '{"long_long_caption":0.455,"long_caption":0.195,"medium_caption":0.1,"short_caption":0.25,"background":0.1,"style":0.7,"shot_type":0.1,"IP":0.5}'
    reasoning_token_length: 0
    cot_kwargs:
      recaption_cot_prob: 0
      recaption_cot: 'short_caption@0.4/medium_caption@0.4/long_caption@0.2 | long_caption@0.000001/long_long_caption@0.999999'
      reasoning_cot_prob: 0
    # system prompt
    system_prompt_token_length: 0
    system_prompt_type: none
  t2i_ob_index_kwargs:
    index_file:
#      - /apdcephfs_nj10/share_301739632/0_public_datasets/leo_2.0/image/pretrain_256p_json/pretrain/demo_base.json
      - /apdcephfs_nj10/share_301739632/0_public_datasets/leo_2.0/image/pretrain_256p_json/pretrain/base.json
    online_bucketing: True
    reso_bucket_kwargs:
      base_size: ${DATA_ARGS.reso-base-size}
      align: ${DATA_ARGS.reso-align}
      preset: ${DATA_ARGS.reso-preset}
    verbose: 1
    index_columns:
      image_col: cache_image
      caption_v4_ocr_en_col: caption_v4_ocr_en
      caption_v4_ocr_zh_col: caption_v4_ocr_zh
      caption_v4_en_col: caption_v4_en
      caption_v4_zh_col: caption_v4_zh
      url_cos_col: url_cos
      ocr_sim_col: ocr_similarity@_ocr_similarity_shadow


TRAINING_ARGS:
  micro-batch-size: 1
  global-batch-size: ${oc.env:GLOBAL_BATCH_SIZE,8}
  lr: 1e-4
  train-iters: 100_000_000
  lr-decay-iters: 100_000_000
  lr-decay-style: cosine
  optimizer: adam
  adam-beta1: 0.9
  adam-beta2: 0.95
  min-lr: 1e-4
  weight-decay: 0.1
  lr-warmup-iters: 2000
  clip-grad: 1.0
  eval-interval: 1000
  eval-iters: 0
  seed: 1234
    # - optimizer-cpu-offload
    # - use-precision-aware-optimizer
  __FROZEN__OPTIMIZER_ARGS:  # pure torch specific
    optimizer_params:
      lr: ${TRAINING_ARGS.lr}
      betas:
      - ${TRAINING_ARGS.adam-beta1}
      - ${TRAINING_ARGS.adam-beta2}
      weight_decay: ${TRAINING_ARGS.weight-decay}
      eps: 0.000001
  __FROZEN__LR_SCHEDULER_ARGS:  # pure torch specific
    lr_scheduler_params:
      num_warmup_steps: ${TRAINING_ARGS.lr-warmup-iters}
      num_training_steps: ${TRAINING_ARGS.train-iters}
      min_lr: ${TRAINING_ARGS.min-lr}

  # loss related
  image-loss-weight: 1.0
  moe-aux-loss-coeff: 0.01
  enabled:
    - moe-aux-loss
    # - init-save  # pure torch specific

PERFORMANCE_ARGS:
  manual-gc-interval: 5
  recompute-granularity: full
  enabled:
    - manual-gc
    - use-flash-attn
    - moe-enable-deepep
    - enable-experimental
    - moe-permute-fusion
    - moe-router-fusion
    # - moe-shared-expert-overlap
    - overlap-grad-reduce
    - overlap-param-gather


MODEL_PARALLEL_ARGS:
  tensor-model-parallel-size: 1
  pipeline-model-parallel-size: 1
  expert-model-parallel-size: 32
  dp-shard: 32
  enabled:
    - use-distributed-optimizer
    # - tp-comm-overlap
    # - sequence-parallel


CHECKPOINT_ARGS:
  ckpt-format: torch_dist
  dist-ckpt-strictness: log_all
  save-interval: 1_000
  save: ${__GLOBAL_VARS__.OUTPUT_PATH}/ckpt
  load: /apdcephfs_nj10/share_301739632/1_public_models/hymm_ar_assets/pretrained_llm/raw_vlm/hy_a3b_vlm_final_256k
  enabled:
    - fuse-experts-in-load
#    - copy-mot-in-load
    - resume
    - resume-index-batch-sampler
    - use-dist-ckpt
#    - no-load-optim
#    - no-load-rng   # saving/loading rng is not supported yet
#    - finetune
    - ckpt-fully-parallel-load
    - ckpt-fully-parallel-save


LOGGING_ARGS:
  log-interval: 1
  tensorboard-dir: ${__GLOBAL_VARS__.OUTPUT_PATH}/events
  saved-training-batch-dir: ${__GLOBAL_VARS__.OUTPUT_PATH}/saved_training_data
  save-n-training-data: 4
  enabled:
    - log-timers-to-tensorboard
    - log-memory-to-tensorboard
    - log-num-zeros-in-grad
    - log-params-norm
    - log-validation-ppl-to-tensorboard
    - log-throughput
