# IMPORTANT NOTE: Write PTM args in YAML format:
# 0. all arguments specified here are one-one correspondences with PTM arguments; un-specified arguments use PTM default values.
# 1. arguments like '--hidden-size=2560' are written as 'hidden-size: 2560' (see below, note the space after colon).
# 2. YAML format is like a tree, and only the leaf nodes are considered as arguments.
#    Non-leaf nodes and structures are ignored, so arguments can be grouped as you like.
# 3. arguments like '--sequence-parallel' can be written as 'enabled: \n  - sequence-parallel' (see below, note the indent).
#    multiple `enabled` arguments in a same sub-tree must be put in a `enabled` list (see below for an example).

__GLOBAL_VARS__:
  _DEFAULT_OUTPUT_PATH: "/apdcephfs_zwfy/share_303937731/somoszhang/gemini35-exp/pure_torch/qwen_moe_a3b_example"
  DATA_PATH: "/root/dummy_data"
  OUTPUT_PATH: ${oc.env:OUTPUT_PATH,${__GLOBAL_VARS__._DEFAULT_OUTPUT_PATH}}

MODEL_ARGS:
  model-name: multimodal.qwen-vl-30b-a3b-instruct
  model-structure: HunyuanMultimodal

  # Mcore required.
  num-layers: 48
  hidden-size: 2048
  num-attention-heads: 32
  ffn-hidden-size: 6144
  kv-channels: 128
  max-position-embeddings: 6144
  seq-length: ${MODEL_ARGS.max-position-embeddings}
  vocab-size: 151936
  normalization: RMSNorm
  num-query-groups: 4
  num-experts: 128
  init-method-std: 0.012757759
  moe-router-topk: 8
  moe-ffn-hidden-size: 768
  moe-layer-freq: '([0]+[1]*47)'
  moe-router-load-balancing-type: aux_loss
  moe-token-dispatcher-type: flex
  moe-router-dtype: fp32
  attention-dropout: 0.0
  hidden-dropout: 0.0

  init-device: meta  # [cpu, cuda, meta] pure torch specific
  autocast-dtype: bf16  # pure torch specific
  enabled:
    - bf16
      # mcore
    - qk-layernorm
    - group-query-attention
    - swiglu
    - use-mcore-models
    - moe-grouped-gemm
    - use-hunyuan-arch
    - disable-bias-linear
      # torch
    - split-qkv
    - split-gate-and-up


  patch-size: 1
  # rope-type-extended: "default"
  # rope-type-extended: "2d"
  moe-impl: ep_moe
  # gate-impl: deepseek
  rope-type-extended: "interleaved_mrope"
  cond-image-type: vae_vit
  cond-token-attn-type: full_causal


EXTRA_MODEL_ARGS:
  enabled:
    - use-vae
    - use-vit
    - vit-frozen
  vae-type: 16x16-128c-flux2
  vae-latent-dim: 128
  vae-precision: fp32
  vae-autocast-dtype:  fp32
  vit-type: qwen3vl-vit-for-30b-a3b
  __FROZEN__EXTRA_MODEL_ARGS:
    vit_config:
      attn_implementation: "flash_attention_2"  # 可选值: "flash_attention_2", "sdpa", "eager"
      spatial_merge_size: 2  # Required for qwen3vl-vit models


DENOISE_ARGS:
  denoise-type: flow
  flow-path-type: linear
  flow-predict-type: velocity
  flow-snr-type: lognorm
  flow-reverse: True
  flow-shift: 1.0


DATA_ARGS:
  tokenizer-type: NullTokenizer
  dataloader-type: external

  # extra args provider
  tokenizer-name: qwen3-vl-30b-a3b-instruct
  tokenizer-class: tokenization_qwen_multimodal.QwenMultimodalTokenizerFast
  # first-epoch-no-shuffle: True
  shuffle-by: dataset
  fast-shuffle: True
  use-numpy-indices: True
  add-timestep-token: True
  add-image-shape-token: True
  use-front-boi-token: True
  use-front-src-image: True
  sequence-template: instruct
  # sequence-template: pretrain
  combined-iterator-sampling-mode: fixed
  cos-base:
    - "/cos_nj1/share_302243067 -> /cos_zw1/share_303793872"
    # - "/cos_nj1/share_302243067 -> /apdcephfs_wza_common/hunyuan_data/{stem2}"
#  cos-file-is-encrypted: True
  enable-resample: True
  ignore-start-tokens: []

  # vae
  vae-image-token-length: 256
  # -- resolution group kwargs
  reso-base-size: 256
  reso-align: 16
  reso-preset: arc33
  # -- vit kwargs
  # max_pixels = vit-image-token-length*32*32
  # min_pixels = min-vit-image-token-length*32*32
  vit-image-token-length: 4096
  min-vit-image-token-length: 256

  modality: [ text, vae_image, vit_image ]
  sampling-probs: '{"t2i":0.5, "lm": 0.3, "mmu_caption": 0.2}'


  # Sequence pack
  pack-buffer-factor: 32

  # Dataloader
  num-workers: 4
  prefetch-factor: 2


__FROZEN__DATA_ARGS:
  t2i_task_kwargs:
    # required
    batch_size: 16
    modality: [ vae_image ]
    max_token_length: 512
    attn_type: flex
    shuffle_seed: 1111
    # image caption
    uncond_p: 0.1
    prompt_token_length: 256
    patcher_names: []
    instruct_type: none
    image_caption_resource:
      - caption_v3_2_ip:
          caption_v3_2_ip_src: '{"caption_v3_2_ip_en_col": 0.5, "caption_v3_2_ip_zh_col": 0.5}'
          caption_v3_2_ip_caption_processor: caption_process_v3
          caption_v3_2_ip_caption_sample_ratio: '{"long_long_caption":0.455,"long_caption":0.195,"medium_caption":0.1,"short_caption":0.25,"background":0.1,"style":0.7,"shot_type":0.1}'
          caption_v3_2_ip_caption_processor_kwargs: '{"force_use_style_tag":true}'
          caption_v3_2_ip_extra_processor: [ 'filter_shot', 'inject_style_v2' ]
      - caption_v3_2_ocr:
          caption_v3_2_ocr_src: '{"caption_v3_2_ocr_en_col": 0.5, "caption_v3_2_ocr_zh_col": 0.5}'
          caption_v3_2_ocr_caption_processor: caption_process_v3
          caption_v3_2_ocr_caption_sample_ratio: '{"long_long_caption":0.99,"long_caption":0.001,"medium_caption":0.003,"short_caption":0.006,"background":0.1,"style":0.7,"shot_type":0.1,"IP":0.5}'
          caption_v3_2_ocr_caption_processor_kwargs: '{"force_use_style_tag":true}'
          caption_v3_2_ocr_extra_processor: [ 'filter_shot', 'inject_style_v2' ]
      - caption_v3_2:
          caption_v3_2_src: '{"caption_v3_2_en_col": 0.5, "caption_v3_2_zh_col": 0.5}'
          caption_v3_2_caption_processor: caption_process_v3
          caption_v3_2_caption_sample_ratio: '{"long_long_caption":0.455,"long_caption":0.195,"medium_caption":0.1,"short_caption":0.25,"background":0.1,"style":0.7,"shot_type":0.1,"IP":0.5}'
          caption_v3_2_caption_processor_kwargs: '{"force_use_style_tag":true}'
          caption_v3_2_extra_processor: [ 'filter_shot', 'inject_style_v2' ]
      - caption_v3_1:
          caption_v3_1_src: '{"caption_v3_1_en_col": 0.5, "caption_v3_1_zh_col": 0.5}'
          caption_v3_1_caption_processor: caption_process_v3
          caption_v3_1_caption_sample_ratio: '{"long_long_caption":0.455,"long_caption":0.195,"medium_caption":0.1,"short_caption":0.25,"background":0.1,"style":0.7,"shot_type":0.1,"IP":0.5}'
          caption_v3_1_caption_processor_kwargs: '{"force_use_style_tag":true}'
          caption_v3_1_extra_processor: [ 'filter_shot', 'inject_style_v2' ]
      - caption_v3:
          caption_v3_src: '{"caption_v3_en_col": 0.5, "caption_v3_zh_col": 0.5}'
          caption_v3_caption_processor: caption_process_v3
          caption_v3_caption_sample_ratio: '{"long_long_caption":0.455,"long_caption":0.195,"medium_caption":0.1,"short_caption":0.25,"background":0.1,"style":0.7,"shot_type":0.1,"IP":0.5}'
          caption_v3_caption_processor_kwargs: '{"force_use_style_tag":true}'
          caption_v3_extra_processor: [ 'fix_style', 'filter_shot', 'inject_style_v2' ]
    reasoning_token_length: 0
    cot_kwargs:
      recaption_cot_prob: 0
      recaption_cot: 'short_caption@0.4/medium_caption@0.4/long_caption@0.2 | long_caption@0.000001/long_long_caption@0.999999'
      reasoning_cot_prob: 0
    # system prompt
    system_prompt_token_length: 0
    system_prompt_type: none
  t2i_index_kwargs:
    index_file:
      - /apdcephfs_zwfy2/share_303937731/jarvizhang/share/hyimage3_data/t2i_1024p/example_mb256.json  # 5m
#      - /apdcephfs_zwfy2/share_303937731/jarvizhang/share/hyimage3_data/t2i_1024p/mb256.json  # 100m
    multireso: True
    ceph_base_inv: '{"nj10": "/apdcephfs_zwfy/share_303937731", "prefix": "/apdcephfs_zwfy2/share_303937731"}'
    verbose: 1
    index_columns:
      image_col: cache_image
      caption_v3_2_ocr_en_col: caption_v3_2_ocr_en
      caption_v3_2_ocr_zh_col: caption_v3_2_ocr_zh
      caption_v3_2_en_col: caption_v3_2_en
      caption_v3_2_zh_col: caption_v3_2_zh
      caption_v3_1_en_col: caption_v3_1_en
      caption_v3_1_zh_col: caption_v3_1_zh
      caption_v3_en_col: caption_v3_en
      caption_v3_zh_col: caption_v3_zh
      caption_v3_2_ip_en_col: caption_v3_2_ip_en
      caption_v3_2_ip_zh_col: caption_v3_2_ip_zh
      style_v2_col: style_v2
      url_cos_col: url_cos
    
  
  lm_task_kwargs:
    # required
    batch_size: 1
    modality: [ text, vae_image ]   # Add vae_image for prerunning vae
    max_token_length: 6144
    input_max_token_length: 6140
    attn_type: flex
    shuffle_seed: 3333
    sequence_pack: True
    # task specific
    data_format: pure_text  # [pure_text, conversation]
    pre_extract_tokens: False  # [True, False]
    # system prompt
    system_prompt_token_length: 0
    system_prompt_type: none
  lm_index_kwargs:
    index_file:
       - /apdcephfs_zwfy/share_303937731/1_public_models/hymm_ar_assets/dataset/t2t_index/hy_text_v2_p4_10m_demo.json
#       - /apdcephfs_zwfy2/share_303937731/jarvizhang/share/hyimage3_data/lm/base.json
    index_columns:
      text_col: text  # [text, tokens]
      conversation_col: conversations
    verbose: 1
  
  mmu_caption_task_kwargs:
    # required
    batch_size: 1
    modality: [ vae_image, vit_image, text ]
    max_token_length: 5504  # 256 vae + 4354 vision encoder + 768 text
    input_max_token_length: 512   # 256 for special tokens and output text
    attn_type: flex
    shuffle_seed: 4444
    sequence_pack: True
    # skip_vae_encode: True
    # task specific
    data_format: captioning   # [captioning, conversation]
    drop_last: True
    short_keys: [ short_caption, medium_caption ]
    image_caption_resource:
      - caption_v3_2_ocr:
          caption_v3_2_ocr_src: '{"caption_v3_2_ocr_en_col": 0.5, "caption_v3_2_ocr_zh_col": 0.5}'
          caption_v3_2_ocr_caption_processor: caption_process_v3
          caption_v3_2_ocr_caption_sample_ratio: '{"long_long_caption":0.99,"long_caption":0.01,"background":0.1,"style":0.7,"shot_type":0.1,"IP":0.5}'
          caption_v3_2_ocr_extra_processor: [ 'filter_shot', 'inject_style_v2' ]
      - caption_v3_2:
          caption_v3_2_src: '{"caption_v3_2_en_col": 0.5, "caption_v3_2_zh_col": 0.5}'
          caption_v3_2_caption_processor: caption_process_v3
          caption_v3_2_caption_sample_ratio: '{"long_long_caption":0.3,"long_caption":0.35,"medium_caption":0.25,"background":0.1,"style":0.7,"shot_type":0.1,"IP":0.5}'
          caption_v3_2_extra_processor: [ 'filter_shot', 'inject_style_v2' ]
      - caption_v3_1:
          caption_v3_1_src: '{"caption_v3_1_en_col": 0.5, "caption_v3_1_zh_col": 0.5}'
          caption_v3_1_caption_processor: caption_process_v3
          caption_v3_1_caption_sample_ratio: '{"long_long_caption":0.3,"long_caption":0.35,"medium_caption":0.25,"background":0.1,"style":0.7,"shot_type":0.1,"IP":0.5}'
          caption_v3_1_extra_processor: [ 'filter_shot', 'inject_style_v2' ]
      - caption_v3:
          caption_v3_src: '{"caption_v3_en_col": 0.5, "caption_v3_zh_col": 0.5}'
          caption_v3_caption_processor: caption_process_v3
          caption_v3_caption_sample_ratio: '{"long_long_caption":0.3,"long_caption":0.35,"medium_caption":0.25,"background":0.1,"style":0.7,"shot_type":0.1,"IP":0.5}'
          caption_v3_extra_processor: [ 'fix_style', 'filter_shot', 'inject_style_v2' ]
    # system prompt
    system_prompt_token_length: 0
    system_prompt_type: none
  mmu_caption_index_kwargs:
    index_file:
      - /apdcephfs_zwfy2/share_303937731/jarvizhang/share/hyimage3_data/t2i_1024p/example_base.json  # 5m
#      - /apdcephfs_zwfy2/share_303937731/jarvizhang/share/hyimage3_data/t2i_1024p/base.json  # 100m
    ceph_base_inv: '{"nj10": "/apdcephfs_zwfy/share_303937731", "prefix": "/apdcephfs_zwfy2/share_303937731"}'
    verbose: 2
    index_columns:
      image_col: cache_image
      caption_v3_2_ocr_en_col: caption_v3_2_ocr_en
      caption_v3_2_ocr_zh_col: caption_v3_2_ocr_zh
      caption_v3_2_en_col: caption_v3_2_en
      caption_v3_2_zh_col: caption_v3_2_zh
      caption_v3_1_en_col: caption_v3_1_en
      caption_v3_1_zh_col: caption_v3_1_zh
      caption_v3_en_col: caption_v3_en
      caption_v3_zh_col: caption_v3_zh
      style_v2_col: style_v2
      url_cos_col: url_cos


TRAINING_ARGS:
  micro-batch-size: 1
  global-batch-size: ${oc.env:GLOBAL_BATCH_SIZE,8}
  lr: 1e-4
  train-iters: 100_000_000
  lr-decay-iters: 100_000_000
  lr-decay-style: cosine
  optimizer: adam
  adam-beta1: 0.9
  adam-beta2: 0.95
  min-lr: 1e-4
  weight-decay: 0.1
  lr-warmup-iters: 2000
  clip-grad: 1.0
  eval-interval: 1000
  eval-iters: 0
  seed: 1234
    # - optimizer-cpu-offload
    # - use-precision-aware-optimizer
  __FROZEN__OPTIMIZER_ARGS:  # pure torch specific
    optimizer_params:
      lr: ${TRAINING_ARGS.lr}
      betas:
      - ${TRAINING_ARGS.adam-beta1}
      - ${TRAINING_ARGS.adam-beta2}
      weight_decay: ${TRAINING_ARGS.weight-decay}
      eps: 0.000001
  __FROZEN__LR_SCHEDULER_ARGS:  # pure torch specific
    lr_scheduler_params:
      num_warmup_steps: ${TRAINING_ARGS.lr-warmup-iters}
      num_training_steps: ${TRAINING_ARGS.train-iters}
      min_lr: ${TRAINING_ARGS.min-lr}

  # loss related
  image-loss-weight: 3.0
  moe-aux-loss-coeff: 0.01
  enabled:
    - moe-aux-loss


PERFORMANCE_ARGS:
  manual-gc-interval: 5
  # recompute-granularity: full
  enabled:
    - manual-gc
    - use-flash-attn
    - moe-enable-deepep
    - enable-experimental
    - moe-permute-fusion
    - moe-router-fusion
    # - moe-shared-expert-overlap
    - overlap-grad-reduce
    - overlap-param-gather


MODEL_PARALLEL_ARGS:
  tensor-model-parallel-size: 1
  pipeline-model-parallel-size: 1
  expert-model-parallel-size: 8
  enabled:
    - use-distributed-optimizer
    # - tp-comm-overlap
    # - sequence-parallel


CHECKPOINT_ARGS:
  ckpt-format: torch_dist
  dist-ckpt-strictness: log_all
  save-interval: 500
  save: ${__GLOBAL_VARS__.OUTPUT_PATH}/ckpt
  load: ${oc.env:ASSETS_BASE}/pretrained_llm/Qwen3-VL-30B-A3B-Instruct-hunyuan/
  ckpt: ${CHECKPOINT_ARGS.load}
  key-mapping: qwen3vl_30b_a3b_hf_to_fsdp2
  enabled:
    - fuse-experts-in-load
    - resume
    - use-dist-ckpt
    - no-load-optim
    - no-load-rng   # saving/loading rng is not supported yet
    # - finetune
    - ckpt-fully-parallel-load
    - ckpt-fully-parallel-save


LOGGING_ARGS:
  log-interval: 1
  tensorboard-dir: ${__GLOBAL_VARS__.OUTPUT_PATH}/events
  saved-training-batch-dir: ${__GLOBAL_VARS__.OUTPUT_PATH}/saved_training_data
  save-n-training-data: 4
  enabled:
    - log-timers-to-tensorboard
    - log-memory-to-tensorboard
    - log-num-zeros-in-grad
    - log-params-norm
    - log-validation-ppl-to-tensorboard
    - log-throughput
