TRAINING_ARGS:
  micro-batch-size: 1
  gradient-accumulation-steps: 1
  global-batch-size: ${mul:${div:${mul:${oc.env:HOST_GPU_NUM}, ${oc.env:HOST_NUM}}, ${mul:${MODEL_PARALLEL_ARGS.tensor-model-parallel-size}, ${MODEL_PARALLEL_ARGS.pipeline-model-parallel-size}}}, ${mul:${TRAINING_ARGS.gradient-accumulation-steps}, ${TRAINING_ARGS.micro-batch-size}}} # GLOBAL_BATCH_SIZE = HOST_GPU_NUM * HOST_NUM / (TP_SIZE*PP_SIZE*CP_SIZE) * GRADIENT_ACCUMULATION_STEPS * MICRO_BATCH_SIZE
  lr: 1e-4
  train-iters: 100_000_000
  lr-decay-iters: 100_000_000
  lr-decay-style: constant
  optimizer: dist_muon
  momentum: 0.95
  adam-beta1: 0.9
  adam-beta2: 0.95
  min-lr: 1e-4
  weight-decay: 0.01
  lr-warmup-iters: 2000
  clip-grad: 1.0
  eval-interval: 1000
  eval-iters: 0
  seed: 1234
    # - optimizer-cpu-offload
    # - use-precision-aware-optimizer
  __FROZEN__OPTIMIZER_ARGS:  # pure torch specific
    optimizer_params:
      lr: ${TRAINING_ARGS.lr}
      betas:
      - ${TRAINING_ARGS.adam-beta1}
      - ${TRAINING_ARGS.adam-beta2}
      weight_decay: ${TRAINING_ARGS.weight-decay}
      momentum: ${TRAINING_ARGS.momentum}
      sum_decay_momentum: False
      eps: 0.00000001  # eps 1e-8
    enable_special_weight_decay: True
    special_weight_decay_params: ["*layernorm*", "*layer_norm*"]
    special_adamw_params: ["*embed_tokens*", "*lm_head*", "*final_layer*", "*time_embed*", "*timestep_emb*", "*patch_embed*", "*embedding*"]
  __FROZEN__LR_SCHEDULER_ARGS:  # pure torch specific
    lr_scheduler_params:
      num_warmup_steps: ${TRAINING_ARGS.lr-warmup-iters}
      num_training_steps: ${TRAINING_ARGS.train-iters}
      min_lr: ${TRAINING_ARGS.min-lr}

  # loss related
  image-loss-weight: 1.0
  moe-expert-bias-update-rate: 0.001
  moe-score-func: "sigmoid"
  moe-aux-loss-coeff: 0.0001
  enabled:
    - moe-enable-router-expert-bias
    - moe-enable-expert-bias-zero-mean-update
    - moe-aux-loss
    - moe-seq-aux-loss


PERFORMANCE_ARGS:
  manual-gc-interval: 5
  # recompute-granularity: full
  enabled:
    - manual-gc
    - use-flash-attn
    - moe-enable-deepep
    - enable-experimental
    - moe-permute-fusion
    - moe-router-fusion
    - overlap-grad-reduce
    - overlap-param-gather


MODEL_PARALLEL_ARGS:
  tensor-model-parallel-size: 1
  pipeline-model-parallel-size: 1
  expert-model-parallel-size: 16
  enabled:
    - use-distributed-optimizer
    # - tp-comm-overlap
    # - sequence-parallel


CHECKPOINT_ARGS:
  ckpt-format: torch_dist
  dist-ckpt-strictness: log_all
  save-interval: 1_000
  save: ${__GLOBAL_VARS__.OUTPUT_PATH}/ckpt
  # load: /apdcephfs_wza/yijicheng/models/hy_v3_a3b_official_256k_mot_gen_a5b_hf
  # ckpt: ${CHECKPOINT_ARGS.load}
  load: "/apdcephfs_wza2/share_304227829/hunyuan/xiangtikong/gemini/torch/hy3_muon/test_ckpt_mot_hy3_muon_2/weights"
  key-mapping:
    - '^vit\.embeddings\.:vit.vit.embeddings.'
    - '^vit\.layers\.:vit.vit.layers.'
    - 'model\.layers\.(\d+)\.mlp\.expert_bias:model.layers.\1.mlp.gate.expert_bias'
  enabled:
    - fuse-experts-in-load
    # - resume
    - use-dist-ckpt
    - no-load-optim
    - no-load-rng   # saving/loading rng is not supported yet
    - finetune
    - ckpt-fully-parallel-load
    - ckpt-fully-parallel-save


LOGGING_ARGS:
  log-interval: 1
  tensorboard-dir: ${__GLOBAL_VARS__.OUTPUT_PATH}/events
  saved-training-batch-dir: ${__GLOBAL_VARS__.OUTPUT_PATH}/saved_training_data
  save-n-training-data: 4
  enabled:
    - log-timers-to-tensorboard
    - log-memory-to-tensorboard
    - log-num-zeros-in-grad
    - log-params-norm
    - log-validation-ppl-to-tensorboard
    - log-throughput
