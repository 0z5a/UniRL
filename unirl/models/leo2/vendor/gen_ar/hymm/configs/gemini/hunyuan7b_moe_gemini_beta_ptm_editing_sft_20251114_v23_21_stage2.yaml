    t2i_2_instruction_candidates_type: mix_up@0.05
    # 加 system prompt 的模式[off, fixed_set, mix_up@]
    t2i_2_system_prompt_candidates_type: mix_up@1.0
    t2i_2_caption_cot: 'short_caption@0.4/medium_caption@0.4/long_caption@0.2 | long_caption@0.000001/long_long_caption@0.999999'
    t2i_2_caption_cot_prob: 1.0
    t2i_2_reasoning_cot_prob: 0.0
    # vanilla prob = 1. - caption_cot_prob
    # recaption w.o. think prob = caption_cot_prob * (1. - reasoning_cot_prob)
    # repcaiton w. think prob = caption_cot_prob * reasoning_cot_prob
    # system prompt prob is applied independently and equally to these 3 cases
    t2i_2_patcher_names: [ 'image_ratio@0.3' ]
    t2i_2_image_caption_col_probs:
