training_config:
  trainer_name: multimodal_gemini_beta_dpo_trainer.MultiModalGeminiBetaDPOTrainer
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  global_batch_size: null
  global_seed: 3409   # TODO
  zero_stage: 2
  log_every: 1
  tensorboard: True
  gradient_checkpoint: True
  gradient_checkpoint_layers: -1
  use_compile: False
  benchmark: False

  skip_nan_grad: False
  overlap_comm: True
  reduce_bucket_size: 5e7

  max_training_steps: 1_000_000_000
  ckpt_every: 10000000

  init_save: False
  final_save: True

  resume: null
  resume_dataloader: False
  no_load_optim_states: False
  no_load_ema: False
  default_rank0_ss: False
  fix_lr_scheduler: False

  validation_at_steps: []
  validation_every: -1
  validation_metrics: []
  validation_metrics_save_image: False

  # dpo-related
  pos_term_weight: 0.0 #0.1
  same_x0_for_win_lose: True #False
  # launcher: torch
  ref_policy_parallel: False
  # # fsdp时需要用下面的参数来指定 mixed precision 的类型
  # param_dtype: bf16
  # reduce_dtype: bf16
  # buffer_dtype: bf16

sampling_config:
  ckpt: null
  load_key: module
  metric_image_size: 1024
  metric_batch_size: 8
  evaluation_metrics: [fid@coco30k, clip_score@coco30k, hpsv2@coco30k, t2i_compbench]
  rerank: 1
  sample_image_size: 1024
  sample_batch_size: 8
  seed_type: auto
  seed: 123456
  guidance_scale: 6.0
  diff_infer_steps: 100
  sample_flow_shift: 1.0
  sample_use_flux_shift: False
  do_sample: True   # 需要看一下rl是否需要开,应该是影响text的

  logits_processors_cfg:
    - TemperatureLogitsWarper:
        temperature: 0.6
    - TopKLogitsWarper:
        top_k: 1024
    - TopPLogitsWarper:
        top_p: 0.95

model_config:
  model_name: hunyuan-dense-7b
  model_structure: MultiModalTransfusion
  tokenizer_name: hunyuan-dense-7b-tokenizer-refactor
  # TODO
  pretrained_ckpt: /apdcephfs_nj10/share_301739632/2_public_experiments/log_EXP_gemini_beta/jarvizhang/log_EXP/0042_hunyuan_dense_7b_20250420_013331_n415_hunyuan7b_gemini_beta_deepspeed_mm_pretrain_stage3_1/checkpoints/0019000/mp_rank_00_model_states.pt
  pretrained_reference_model_ckpt: /apdcephfs_nj10/share_301739632/2_public_experiments/log_EXP_gemini_beta/jarvizhang/log_EXP/0042_hunyuan_dense_7b_20250420_013331_n415_hunyuan7b_gemini_beta_deepspeed_mm_pretrain_stage3_1/checkpoints/0019000/mp_rank_00_model_states.pt
  precision: bf16
  autocast_dtype: bf16
  media_vocab_size: 0

  denoise_type: flow
  flow_path_type: linear
  flow_predict_type: velocity
  flow_loss_weight: null
  flow_train_eps: null
  flow_sample_eps: null
  flow_snr_type: lognorm
  flow_reverse: True
  flow_shift: 3.0
  sample_flow_shift: 3.0
  use_flux_shift: False
  flux_base_shift: null
  flux_max_shift: null

  model_kwargs:
    block_size: 17000   # TODO
    vision_model:
      vision_model_type: siglip2-large-patch16-512
      vision_model_precision: fp32
      vision_model_autocast_dtype: fp32
      vision_model_freeze: False
    vision_aligner:
      vision_aligner_type: mlp_gelu
      vision_aligner_precision: fp32
      vision_aligner_autocast_dtype: fp32
      vision_aligner_freeze: False
      vision_aligner_params:
        vision_aligner_depth: 2
        vision_aligner_input_dim: 1024   # Align to vision_model_type's hidden_dim
        vision_aligner_n_embed: 4096     # Align to model_name's n_embd

  image_loss_weight: 5.0
  gather_text_tokens: True

  img_proj_type: unet
  patch_embed_hidden_dim: 1024
  patch_size: 1

extra_model_config:
  vae_type: 16x16x4-32c-hy-image
  vae_precision: fp32
  vae_autocast_dtype: fp32
  vae_latent_dim: 32
#  vae_sample_size: 768
#  vae_spatial_tiling: True

optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.000001 #0.00001 学习率1e-5出图就会崩
    betas: [0.9, 0.95]
    eps: 0.000001
    weight_decay: 0.01

lr_scheduler_config:
  lr_schedule: WarmupCosineLR
  lr_scheduler_params:
    warmup_num_steps: 0
    cos_min_ratio: 1.0
    total_num_steps: 1_000_000_000

dataloader_config:
  # Common
  shuffle_by: dataset
  fast_shuffle: True
  add_iw_ih_token: False
  add_timestep_token: True
  add_image_shape_token: True
  use_front_boi_token: True
  sequence_template: pretrain
  combined_iterator_sampling_mode: fixed
  # TODO
  sampling_probs: '{"t2i": 1.0}'

  # Text-to-Image
  t2i_batch_size: 1
  t2i_task_kwargs:
    training_image_size: 1024 # only used when multireso is False
    image_token_length: 4096
    text_token_length: 256
    uncond_p: 0.1
    try_first_use_source_text: False    # Must be False
    caption_processor: caption_process_v2
    caption_processor_kwargs: '{"ocr_only_long_caption": true}'
    use_general_style: False
    image_caption_rate: 1.0
    caption_sample_ratio: '{"long_caption":0.4,"medium_caption":0.3,"short_caption":0.25,"background":0.08,"shot_type":0.08,"style":0.08,"light":0.08,"atmosphere":0.08,"composition":0.08,"IP":0.08}'
    attn_type: flex
  t2i_index_kwargs:
    index_file:
      - /apdcephfs_nj10/share_301739632/yutaocui/exp_dir/gemini_rl/arrows/taurus_meixue_pengyu/mb1024.json      # - /apdcephfs_nj10/share_301739632/yutaocui/exp_dir/gemini_rl/arrows/gemini_beta_deformity_0425/mb1024.json
    multireso: True
    ceph_base_inv: '{"nj10": "/apdcephfs_nj10/share_301739632"}'
    # ceph_base_inv: '{"nj8": "/apdcephfs_nj8/share_301739632", "gy4": "/apdcephfs_nj8/share_301739632", "gy2": "/apdcephfs_nj10/share_301739632", "nj8_3019": "/apdcephfs_nj8/share_301932837", "nj10": "/apdcephfs_nj10/share_301739632"}'
    win_image_col_prefix: win_cache_image_
    lose_image_col_prefix: lose_cache_image_
    win_imgs_num_col: win_imgs_num
    lose_imgs_num_col: lose_imgs_num
    image_caption_col: caption_v2   # cache_image
    # image_caption_col_2: gemini_beta_zh_caption # gemini_beta_en_caption
    random_sample_win_lose_ratio: 1.0
    # image_text_col: text_source
    # index_strategy: probability

  # Dataloader
  dataloader_params:
    num_workers: 4
    pin_memory: True
    prefetch_factor: 4
