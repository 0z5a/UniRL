      - /apdcephfs_zwfy/share_303937731/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb1024_cap_v3/mb1024_ip.json  # 127w
      - /apdcephfs_zwfy/share_303937731/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb1024_cap_v3/mb1024_style_batch1_2.json  # 54w
      - /apdcephfs_zwfy/share_303937731/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb1024_cap_v3/mb1024_ct_uniform_distribution_zw.json  # 561w
    multireso: True
    ceph_base_inv: '{"nj10": "/apdcephfs_zwfy/share_303937731", "zwfy": "/apdcephfs_zwfy/share_303937731"}'  # updated
    image_col: cache_image
