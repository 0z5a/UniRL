training_config:
  trainer_name: multimodal_gemini_beta_cfgdistill_puretorchparallel_trainer.MultiModalGeminiBetaCFGDistillPureTorchParallelTrainer
  micro_batch_size: 1
  gradient_accumulation_steps: 1 #1
  global_batch_size: null
  global_seed: 3409   # TODO
  zero_stage: 2
  log_every: 1
  tensorboard: True
  gradient_checkpoint: True
  gradient_checkpoint_layers: -1
  use_compile: False
  benchmark: False

  skip_nan_grad: False
  overlap_comm: True
  reduce_bucket_size: 5e7

  max_training_steps: 1_000_000_000
  ckpt_every: 500

  init_save: True
  final_save: True

  resume: null
  resume_dataloader: False
  no_load_optim_states: False
  no_load_ema: False
  default_rank0_ss: False
  fix_lr_scheduler: False

  validation_at_steps: []
  validation_every: -1
  validation_metrics: []
  validation_metrics_save_image: False

  # cfg distill-related
  guidance_scale_min: 3.0
  guidance_scale_max: 8.0
  

 
sampling_config:
  ckpt: null
  load_key: module
  metric_image_size: 1024
  metric_batch_size: 8
  evaluation_metrics: [fid@coco30k, clip_score@coco30k, hpsv2@coco30k, t2i_compbench]
  rerank: 1
  sample_image_size: 1024
  sample_batch_size: 8
  seed_type: auto
  seed: 123456
  guidance_scale: 6.0
  cfg_distilled: True
  diff_infer_steps: 100
  sample_flow_shift: 3.0
  sample_use_flux_shift: False
  do_sample: True

  logits_processors_cfg:
    - TemperatureLogitsWarper:
        temperature: 0.6
    - TopKLogitsWarper:
        top_k: 1024
    - TopPLogitsWarper:
        top_p: 0.95

model_config:
  model_name: hunyuan-moe-7b-a13b-vocab-expanded-cfgdistilled
  teacher_model_name: hunyuan-moe-7b-a13b-vocab-expanded
  model_structure: MultiModalTransfusion
  tokenizer_name: hunyuan-dense-7b-tokenizer-refactor
  load_prepend_key: 'language_model.'    # Enable to load from pretrained ckpt of Transfusion structure
  pretrained_ckpt: /apdcephfs_zwfy/share_303937731/yutaocui/model_zoo/ar_moe_a13b/sft_0815_dcp
  pretrained_teacher_model_ckpt: /apdcephfs_zwfy/share_303937731/yutaocui/model_zoo/ar_moe_a13b/sft_0815_dcp
  precision: bf16
  autocast_dtype: bf16
  media_vocab_size: 0

  denoise_type: flow
  flow_path_type: linear
  flow_predict_type: velocity
  flow_loss_weight: null
  flow_train_eps: null
  flow_sample_eps: null
  flow_snr_type: lognorm
  flow_reverse: True
  flow_shift: 3.0
  use_flux_shift: False
  flux_base_shift: null
  flux_max_shift: null

  model_kwargs:
    block_size: 15000
    rope_type: 2d   # updated
    vision_encoder_max_num_patches: 1024  # add
    vision_model:
      vision_model_type: siglip2-so400m-patch16-naflex  # updated
      vision_model_precision: fp32
      vision_model_autocast_dtype: fp32
      vision_model_freeze: False
    vision_aligner:
      vision_aligner_type: mlp_gelu
      vision_aligner_precision: fp32
      vision_aligner_autocast_dtype: fp32
      vision_aligner_freeze: False
      vision_aligner_params:
        vision_aligner_depth: 2
        vision_aligner_input_dim: 1152   # Align to vision_model_type's hidden_dim, updated
        vision_aligner_n_embed: 4096     # Align to model_name's n_embd

  image_loss_weight: 5.0

  img_proj_type: unet
  patch_embed_hidden_dim: 1024
  patch_size: 1
  unet_out_norm: True
  image_preln: True
  use_final_time_embed: True

extra_model_config:
  vae_type: 16x16x4-32c-hy-image
  vae_precision: fp32
  vae_autocast_dtype: fp16
  vae_latent_dim: 32
#  vae_sample_size: 768
#  vae_spatial_tiling: True

optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.00001
    betas: [0.9, 0.999]
    eps: 0.00000001
    weight_decay: 0.0001 # 0.01

lr_scheduler_config:
  lr_schedule: WarmupCosineLR
  lr_scheduler_params:
    warmup_num_steps: 0
    cos_min_ratio: 1.0
    total_num_steps: 1_000_000_000

dataloader_config:
  # Common
  shuffle_by: dataset
  fast_shuffle: True
  add_iw_ih_token: False
  add_timestep_token: True
  add_guidance_token: True
  add_image_shape_token: True
  use_front_boi_token: True
  sequence_template: instruct
  combined_iterator_sampling_mode: fixed
  # TODO
  sampling_probs: '{"t2i": 1.0}'

  # Text-to-Image
  t2i_batch_size: 1
  t2i_task_kwargs:
    training_image_size: 1024 # only used when multireso is False
    image_token_length: 4096
    text_token_length: 768
    text_cot_token_length: 896
    ignore_text_ntp: True
    attn_type: auto
    shuffle_seed: 666
    uncond_p: 0.0 # set to 0 for cfgdistill
    try_first_use_source_text: False    # Must be False
    image_caption_rate: 1.0   # 使用 caption 的比例
    caption_cot: 'short_caption/medium_caption | long_caption/long_long_caption'
    caption_cot_prob: 0.5
    image_caption_col_probs:
      - caption_v3_2_ip:
          caption_v3_2_ip_src: '{"image_caption_v3_2_ip_en_col": 0.5, "image_caption_v3_2_ip_zh_col": 0.5}'
          caption_v3_2_ip_caption_processor: caption_process_v3
          caption_v3_2_ip_caption_sample_ratio: '{"long_long_caption":0.455,"long_caption":0.195,"medium_caption":0.1,"short_caption":0.25,"background":0.1,"style":0.7,"shot_type":0.1}'
          caption_v3_2_ip_extra_processor: [ 'filter_shot', 'inject_style_v2' ]
      - caption_v3_2_ocr:
          caption_v3_2_ocr_src: '{"image_caption_v3_2_ocr_en_col": 0.5, "image_caption_v3_2_ocr_zh_col": 0.5}'
          caption_v3_2_ocr_caption_processor: caption_process_v3
          caption_v3_2_ocr_caption_sample_ratio: '{"long_long_caption":0.99,"long_caption":0.001,"medium_caption":0.003,"short_caption":0.006,"background":0.1,"style":0.7,"shot_type":0.1,"IP":0.5}'
          caption_v3_2_ocr_extra_processor: [ 'filter_shot', 'inject_style_v2' ]
      - caption_v3_2:
          caption_v3_2_src: '{"image_caption_v3_2_en_col": 0.5, "image_caption_v3_2_zh_col": 0.5}'
          caption_v3_2_caption_processor: caption_process_v3
          caption_v3_2_caption_sample_ratio: '{"long_long_caption":0.455,"long_caption":0.195,"medium_caption":0.1,"short_caption":0.25,"background":0.1,"style":0.7,"shot_type":0.1,"IP":0.5}'
          caption_v3_2_extra_processor: [ 'filter_shot', 'inject_style_v2' ]
      - caption_v3_1:
          caption_v3_1_src: '{"image_caption_v3_1_en_col": 0.5, "image_caption_v3_1_zh_col": 0.5}'
          caption_v3_1_caption_processor: caption_process_v3
          caption_v3_1_caption_sample_ratio: '{"long_long_caption":0.455,"long_caption":0.195,"medium_caption":0.1,"short_caption":0.25,"background":0.1,"style":0.7,"shot_type":0.1,"IP":0.5}'
          caption_v3_1_extra_processor: [ 'filter_shot', 'inject_style_v2' ]
      - caption_v3:
          caption_v3_src: '{"image_caption_v3_en_col": 0.5, "image_caption_v3_zh_col": 0.5}'
          caption_v3_caption_processor: caption_process_v3
          caption_v3_caption_sample_ratio: '{"long_long_caption":0.455,"long_caption":0.195,"medium_caption":0.1,"short_caption":0.25,"background":0.1,"style":0.7,"shot_type":0.1,"IP":0.5}'
          caption_v3_extra_processor: [ 'fix_style', 'filter_shot', 'inject_style_v2' ]
  t2i_index_kwargs:
    index_file:
      # # 1M for test
      # - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/mb512_p4_v3_1m_demo.json
      # actually used
      - /apdcephfs_zwfy/share_303937731/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb1024_cap_v3/mb1024_zw_noocr.json  # 1.08B
      - /apdcephfs_zwfy/share_303937731/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb1024_cap_v3/mb1024_ip.json
    multireso: True
    ceph_base_inv: '{"nj10": "/apdcephfs_zwfy/share_303937731", "zwfy": "/apdcephfs_zwfy/share_303937731"}'  # updated
    image_col: cache_image
    image_caption_v3_2_ocr_en_col: caption_v3_2_ocr_en  # updated
    image_caption_v3_2_ocr_zh_col: caption_v3_2_ocr_zh  # updated
    image_caption_v3_2_en_col: caption_v3_2_en  # updated
    image_caption_v3_2_zh_col: caption_v3_2_zh  # updated
    image_caption_v3_1_en_col: caption_v3_1_en  # updated
    image_caption_v3_1_zh_col: caption_v3_1_zh  # updated
    image_caption_v3_en_col: caption_v3_en  # updated
    image_caption_v3_zh_col: caption_v3_zh  # updated
    image_caption_v3_2_ip_en_col: caption_v3_2_ip_en  # updated
    image_caption_v3_2_ip_zh_col: caption_v3_2_ip_zh  # updated
    extra_style_v2_col: style_v2

  # Dataloader
  dataloader_params:
    num_workers: 4
    pin_memory: True
    prefetch_factor: 4
