training_config:
  trainer_name: multimodal_gemini_beta_trainer.MultiModalGeminiBetaTrainer
  micro_batch_size: 4
  gradient_accumulation_steps: 1
  global_batch_size: null
  global_seed: 134
  zero_stage: 2
  log_every: 1
  tensorboard: True
  gradient_checkpoint: False
  gradient_checkpoint_layers: -1
  use_compile: False
  launcher: torch

  overlap_comm: True
  reduce_bucket_size: 5e7

  max_training_steps: 5_000_000
  ckpt_every: 5000

  init_save: False
  final_save: True

  resume: null
  resume_dataloader: False
  no_load_optim_states: False
  no_load_ema: False
  default_rank0_ss: False
  fix_lr_scheduler: False

  validation_at_steps: []
  validation_every: -1
  validation_metrics: []
  validation_metrics_save_image: False

sampling_config:
  ckpt: null
  load_key: module
  metric_image_size: 1024
  metric_batch_size: 8
  evaluation_metrics: [fid@coco30k, clip_score@coco30k, hpsv2@coco30k, t2i_compbench]
  rerank: 1
  sample_image_size: 1024
  sample_batch_size: 8
  seed_type: auto
  seed: 123456
  guidance_scale: 6.0
  diff_infer_steps: 100
  sample_flow_shift: 1.0
  sample_use_flux_shift: False
  do_sample: True

  logits_processors_cfg:
    - TemperatureLogitsWarper:
        temperature: 0.6
    - TopKLogitsWarper:
        top_k: 1024
    - TopPLogitsWarper:
        top_p: 0.95

model_config:
  model_name: hunyuan-moe-7b-a13b
  model_structure: MultiModalTransfusion
  tokenizer_name: hunyuan-dense-7b-tokenizer-refactor
  load_prepend_key: 'language_model.'    # Enable to load from pretrained ckpt of Transfusion structure
  pretrained_ckpt: hunyuan-moe-7b-a13b
  precision: bf16
  autocast_dtype: bf16
  media_vocab_size: 0

  denoise_type: flow
  flow_path_type: linear
  flow_predict_type: velocity
  flow_loss_weight: null
  flow_train_eps: null
  flow_sample_eps: null
  flow_snr_type: lognorm
  flow_reverse: True
  flow_shift: 1.0
  use_flux_shift: False
  flux_base_shift: null
  flux_max_shift: null

  model_kwargs:
    block_size: 2100
    rope_type: 2d   # updated
    vision_encoder_max_num_patches: 1024  # add
    vision_model:
      vision_model_type: siglip2-so400m-patch16-naflex  # updated
      vision_model_precision: fp32
      vision_model_autocast_dtype: fp32
      vision_model_freeze: False
    vision_aligner:
      vision_aligner_type: mlp_gelu
      vision_aligner_precision: fp32
      vision_aligner_autocast_dtype: fp32
      vision_aligner_freeze: False
      vision_aligner_params:
        vision_aligner_depth: 2
        vision_aligner_input_dim: 1152   # Align to vision_model_type's hidden_dim, updated
        vision_aligner_n_embed: 4096     # Align to model_name's n_embd

  image_loss_weight: 5.0

  freeze_language_model: True

  img_proj_type: unet
  patch_embed_hidden_dim: 1024
  patch_size: 1

extra_model_config:
  vae_type: 16x16x4-32c-hy-image
  vae_precision: fp32
  vae_autocast_dtype: fp16
  vae_latent_dim: 32

optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.0001
    betas: [0.9, 0.95]
    eps: 0.000001
    weight_decay: 0.01

lr_scheduler_config:
  lr_schedule: WarmupCosineLR
  lr_scheduler_params:
    warmup_num_steps: 5000
    cos_min_ratio: 1.0
    total_num_steps: 5_000_000

dataloader_config:
  # Common
  get_image_retry: 0
  shuffle_by: dataset
  fast_shuffle: True
  add_iw_ih_token: False
  add_timestep_token: True
  add_image_shape_token: True
  use_front_boi_token: True
  use_front_src_image: True   # updated
  use_joint_image_feature: True   # updated
  sequence_template: pretrain
  combined_iterator_sampling_mode: fixed
  # sampling_probs: '{"t2i": 0.5, "mmu": 0.2, "lm": 0.3}'
  # sampling_probs: '{"t2i": 0.3333, "t2i_long_long": 0.1667, "mmu": 0.2, "lm": 0.3}'
  # sampling_probs: '{"t2i": 0.33721, "t2i_long_long": 0.16279, "mmu": 0.20930, "lm": 0.29070}'
  # sampling_probs: '{"t2i": 0.128, "t2i_long_long": 0.0585, "mmu": 0.20930, "lm": 0.29070, "t2i_ocr": 0.314}'
  sampling_probs: '{"mmu": 1.0}'

  # Text-to-Image
  t2i_batch_size: 16
  t2i_task_kwargs:
    training_image_size: 256 # only used when multireso is False
    image_token_length: 256
    text_token_length: 256  # updated
    # max_sequence_length: 1024  # updated
    uncond_p: 0.1
    try_first_use_source_text: False    # Must be False
    caption_processor: caption_process_v3   # updated
    image_caption_rate: 1.0   # 使用 caption 的比例
    caption_sample_ratio: '{"long_caption":0.35,"medium_caption":0.25,"short_caption":0.2}'  # updated
    attn_type: flex
    image_caption_col_probs: '{"image_caption_col": 0.5, "image_caption_col_2": 0.5}'   # updated
    # sequence_pack: "reso_bucket"  # updated
  t2i_index_kwargs:
    index_file: # stage1 0.943B    stage1_2 0.695B     stage1_4 1B    stage1_5 0.675B    old_stage1_7 part0+part1 0.99B    new_stage1_7 part0+part1 1.7B    # updated
#      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256/mb256.json   # stage1, 0.943B
#      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256/mb256_0507.json  # stage1_2, 0.695B
#      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/mb256_p1.json  # stage1_4, 1B
#      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/mb256_p2.json  # stage1_5, 0.675B
#      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/mb256_p1p2_part1.json  # stage1_6
#      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/mb256_p3_part1.json  # old_stage1_7, part0+part1 0.99B
#      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/filter/watermark_filter_mb256_part1.json  # new_stage1_7, part0+part1 1.7B
#      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/mb256_p4_v2_part1.json  # stage1_8, 0.8B
#      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/mb256_p4_all_nowm_noaigc_part1.json  # stage1_9 and stage1_10, part1 2.048B
      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/mb256_p4_all_nowm_noaigc_part0_part1.json  # stage1_11, part0_part1 0.409B 
    multireso: True
    ceph_base_inv: '{"nj10": "/apdcephfs_nj10/share_301739632"}'  # updated
    image_col: cache_image
    image_caption_col: caption_v3_en  # updated
    image_caption_col_2: caption_v3_zh  # updated

  # Text-to-Image Long Long Caption
  t2i_long_long_batch_size: 8
  t2i_long_long_task_kwargs:
    t2i_long_long_training_image_size: 256 # only used when multireso is False
    t2i_long_long_image_token_length: 256
    t2i_long_long_text_token_length: 768
    t2i_long_long_uncond_p: 0.1
    t2i_long_long_try_first_use_source_text: False    # Must be False
    t2i_long_long_caption_processor: caption_process_v3
    t2i_long_long_image_caption_rate: 1.0   # 使用 caption 的比例
    t2i_long_long_caption_sample_ratio: '{"long_caption":0.01, "long_long_caption": 0.99}'  # updated
    t2i_long_long_attn_type: flex
    t2i_long_long_image_caption_col_probs: '{"image_caption_col": 0.5, "image_caption_col_2": 0.5}'   # updated
  t2i_long_long_index_kwargs:
    t2i_long_long_index_file: # old_stage1_7 part0+part1 0.99B    new_stage1_7 part0+part1 1.7B
#      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/mb256_p1p2_part0.json  # stage1_6
#      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/mb256_p3_part0.json  # old_stage1_7
#      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/filter/watermark_filter_mb256_part0.json  # new_stage1_7
#      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/mb256_p4_v2_part0.json  # stage1_8
#      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/mb256_p4_all_nowm_noaigc_part1.json  # stage1_9 and stage1_10, part1 2.048B 训错了,本来应该是part0的,但是训成part1了
      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/mb256_p4_all_nowm_noaigc_part0_part0.json  # stage1_11, part0_part0 0.102B
    t2i_long_long_multireso: True
    t2i_long_long_ceph_base_inv: '{"nj10": "/apdcephfs_nj10/share_301739632"}'  # updated
    t2i_long_long_image_col: cache_image
    t2i_long_long_image_caption_col: caption_v3_en  # updated
    t2i_long_long_image_caption_col_2: caption_v3_zh  # updated

  # Text-to-Image OCR, we only use long or long_long caption for OCR dataset
  t2i_ocr_batch_size: 8
  t2i_ocr_task_kwargs:
    t2i_ocr_training_image_size: 256 # only used when multireso is False
    t2i_ocr_image_token_length: 256
    t2i_ocr_text_token_length: 768
    t2i_ocr_uncond_p: 0.1
    t2i_ocr_try_first_use_source_text: False    # Must be False
    t2i_ocr_caption_processor: caption_process_v3
    t2i_ocr_image_caption_rate: 1.0   # 使用 caption 的比例
    t2i_ocr_caption_sample_ratio: '{"long_caption":0.3, "long_long_caption": 0.7}'  # updated
    t2i_ocr_attn_type: flex
    t2i_ocr_image_caption_col_probs: '{"image_caption_col": 0.5, "image_caption_col_2": 0.5}'   # updated
  t2i_ocr_index_kwargs:
    t2i_ocr_index_file: # 0.58B
      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/mb256_p5_nowm_noaigc.json # stage1_10 and stage1_11
    t2i_ocr_multireso: True
    t2i_ocr_ceph_base_inv: '{"nj10": "/apdcephfs_nj10/share_301739632"}'  # updated
    t2i_ocr_image_col: cache_image
    t2i_ocr_image_caption_col: caption_v3_en  # updated
    t2i_ocr_image_caption_col_2: caption_v3_zh  # updated


  # Language Model
  lm_batch_size: 4
  lm_index_file:
    - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2t_index/hy_text_v2.json
    - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2t_index/open_instruct_text.json
  lm_token_length: 2048
  lm_attn_type: flex
  lm_single_text_max_length: 32768
  lm_index_kwargs:
    lm_ceph_base_inv: '{"nj8": "/apdcephfs_nj8/share_301739632"}'

  # Multimodal Understanding
  mmu_batch_size: 1
  mmu_task_kwargs:  # updated
    mmu_image_size: 512  # when get_raw_image failed, use this size to create a gray image
    mmu_vae_base_size: 256
    mmu_token_length: 2048  # 256 vae + 1024 vision encoder + 768 text
    mmu_text_token_length: 768
    mmu_drop_last: True
    mmu_attn_type: flex
    mmu_image_caption_col_probs: '{"image_caption_col": 0.5, "image_caption_col_2": 0.5}'
    # mmu_captioning_keys: ["long_caption", "short_caption"]
    mmu_caption_sample_ratio: '{"long_caption": 0.2, "medium_caption": 0.3, "short_caption": 0.5}'  # updated
    mmu_ignore_user_instruct: True
  mmu_index_kwargs:   # updated
    mmu_index_file: # stage1_4 1B    stage1_5 0.675B    old_stage1_7 0.99B    new_stage1_7 1.7B
#      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/base256_p1.json  # stage1_4
#      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/base256_p2.json  # stage1_5
#      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/base256_p3.json  # old_stage1_7
#      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/filter/watermark_filter_00_part1.json  # new_stage1_7
#      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/base256_p4_v2.json  # stage1_8
      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb256_cap_v3/base256_p4_all_nowm_noaigc.json  # stage1_9, 25B
      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/mmu_index/opensource.json   # 开源 mmu 数据集, 2kw
      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/mmu_index/mmu_single_v2_new.json  # jp in house 的 mmu 数据集, 2kw
    mmu_ceph_base_inv: '{"nj10": "/apdcephfs_nj10/share_301739632"}'  # updated
    mmu_image_key: cache_image
    mmu_image_caption_col: caption_v3_en  # updated
    mmu_image_caption_col_2: caption_v3_zh  # updated
    # mmu_message_col: caption
    mmu_message_col: messages
    mmu_index_strategy: probability
    # mmu_index_probability: [0.01663757128, 1.0, 1.0]
    mmu_index_probability: [0.04991271384, 1.0, 1.0]

  # Dataloader
  dataloader_params:
    num_workers: 8
    pin_memory: True
    prefetch_factor: 8
