training_config:
  trainer_name: multimodal_gemini_beta_unified_grpo_puretorchparallel_trainer.MultiModalGeminiBetaUnifiedGRPOPureTorchParallelTrainer
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  global_batch_size: null
  global_seed: 3409   # TODO
  zero_stage: 2
  log_every: 1
  tensorboard: True
  gradient_checkpoint: True
  gradient_checkpoint_layers: -1
  use_compile: False
  benchmark: False
  kv_cache: True

  overlap_comm: True
  reduce_bucket_size: 5e7

  max_training_steps: 1_000_000_000
  ckpt_every: 25

  init_save: False
  final_save: True

  resume: null
  save_last_batch_text: False
  resume_puretorch: False
  # resume_puretorch: /apdcephfs_zwfy/share_303937731/yutaocui/exp_dir/text2image_ar/log_Gemini_MOE_RL_EXP/0001_hunyuan_moe_7b_a13b_20250731_224056_n16_my_hunyuan_moe_gemini_beta_mm_grpo_t2i_mixgrpo_lr1e-5_kl0.01/checkpoints/0000250
  resume_dataloader: False
  no_load_optim_states: False
  no_load_ema: False
  default_rank0_ss: False
  fix_lr_scheduler: False
  skip_nan_grad: False #True

  validation_at_steps: []
  validation_every: -1
  validation_metrics: []
  validation_metrics_save_image: False

  # grpo-related
  return_moe_loss: False # True NOTE: 当前puretorch代码设置为True会报错，返回值的问题
  moe_loss_weight: 0  # 只是为了观察moe balance loss变化，不实际用来更新
  same_x0: True
  kl_weight: 0.01 #0.01 #0.1
  adv_clip_max: 5.0 #1.0
  clip_range: 0.0001 #0.0
  model_cpu_offload: False #True
  num_train_timesteps: 30 #40 #40
  timestep_fraction: 1.0
  num_generations: 16 # 8
  num_grpo_iterations: 1
  visualize_reward: True # False
  visualize_every: 20
  training_strategy: progressive
  timesteps_group_size: 10
  train_iters_per_timesteps_group: 150 #35 #25 #100
  timesteps_group_overlap: True
  mixgrpo_stride: 4
  # dynamic_t1: 15
  # dynamic_k: 0.5
  # dynamic_y0: 20
  quant_reward: False
  advantage_norm: trimmed_mean
  trimmed_ratio: 0.25
  # multi_reward_mix: reward_aggr # reward_aggr, advantage_aggr
  use_extra_low_timesteps_kl: False #True #False
  sde_noise_scale: 1.0
  gen_text_freeze_for_same_prompt: True
  kl_weight_text: 0.0
  loss_mode: image_only
  update_sde_noise_scale: True
  
  ## 是否开启先生文再生成图片，如果开启生文的话，需要设置enable_generate_text和cot_max_length
  enable_generate_text: True
  cot_max_length: 768

  # HPSV3 reward model settings
  # hpsv3_reward:
  #   url_port:
  #     - xxx.xxx.xxx.xxx:8080

  altclip_reward:
    ft_model_path: /apdcephfs_wza/taoxxzhang/models/altcip_rm/rm_018_altclip_512_data_1_41_42_43_44_5_7_8_9_10_11_12_13_lr3e-6_step4000_bs4_gradacc2_gpu8_bt_clip0.1_pos/checkpoint-final
    processor_cache_dir:  /apdcephfs_wza/taoxxzhang/models/altcip_rm/hf_cache
    pretrained_model_name_or_path: /apdcephfs_wza/taoxxzhang/models/altcip_rm/AltCLIP
  altclip_reward_weight: 1.0

  # edit_ref_rm:
  #   edit_ref_url_port:
  #     - xxx.xxx.xxx.xxx:8080
  # edit_ref_rm_weight: 1.0

  t2i_reward_models:
    - AltCLIPRM
  ti2i_reward_models:
    # - EditRefRM
    - AltCLIPRM

sampling_config:
  ckpt: null
  load_key: module
  metric_image_size: 1024
  metric_batch_size: 8
  evaluation_metrics: [fid@coco30k, clip_score@coco30k, hpsv2@coco30k, t2i_compbench]
  rerank: 1
  sample_image_size: 1024
  sample_batch_size: 8
  seed_type: auto
  seed: 123456
  guidance_scale: 3.5 #6.0
  diff_infer_steps: 100
  sample_flow_shift: 3.0
  sample_use_flux_shift: False
  do_sample: True

  logits_processors_cfg:
    - TemperatureLogitsWarper:
        temperature: 0.6
    - TopKLogitsWarper:
        top_k: 1024
    - TopPLogitsWarper:
        top_p: 0.95

model_config:
  model_name: hunyuan-moe-7b-a13b-vocab-expanded
  model_structure: MultiModalTransfusion
  tokenizer_name: hunyuan-dense-7b-tokenizer-refactor
  load_prepend_key: 'language_model.'    # Enable to load from pretrained ckpt of Transfusion structure
  # pretrained_ckpt: hunyuan-moe-7b-a13b-vocab-expanded
  precision: bf16
  autocast_dtype: bf16
  media_vocab_size: 0
  
  pretrained_ckpt: /root/ckpts/sftv7/dcp/dcp
  pretrained_reference_model_ckpt: /root/ckpts/sftv7/dcp/dcp
  
  denoise_type: flow
  flow_path_type: linear
  flow_predict_type: velocity
  flow_loss_weight: null
  flow_train_eps: null
  flow_sample_eps: null
  flow_snr_type: lognorm
  flow_reverse: True
  flow_shift: 3.0
  sample_flow_shift: 3.0
  use_flux_shift: False
  flux_base_shift: null
  flux_max_shift: null

  model_kwargs:
    block_size: 15000 #20000
    rope_type: 2d   # updated
    vision_encoder_max_num_patches: 1024
    vision_model:
      vision_model_type: siglip2-so400m-patch16-naflex
      vision_model_precision: fp32
      vision_model_autocast_dtype: fp32
      vision_model_freeze: True
    vision_aligner:
      vision_aligner_type: mlp_gelu
      vision_aligner_precision: fp32
      vision_aligner_autocast_dtype: fp32
      vision_aligner_freeze: True # False  T2I GRPO任务需要设置为True
      vision_aligner_params:
        vision_aligner_depth: 2
        vision_aligner_input_dim: 1152   # Align to vision_model_type's hidden_dim
        vision_aligner_n_embed: 4096     # Align to model_name's n_embd
    lm_head_ln_freeze: True  # T2I GRPO任务需要设置为True
    moe_gate_freeze: True  # 冻结gate参数
  
  image_loss_weight: 5.0
  gather_text_tokens: True

  img_proj_type: unet
  patch_embed_hidden_dim: 1024
  patch_size: 1

  unet_out_norm: True
  image_preln: True
  use_final_time_embed: True

extra_model_config:
  vae_type: 16x16x4-32c-hy-image
  vae_precision: fp32
  vae_autocast_dtype: fp16 #fp32
  vae_latent_dim: 32

optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.000005 #0.00001
    betas: [0.9, 0.999]
    eps: 0.00000001
    weight_decay: 0.0001 # 0.01

lr_scheduler_config:
  lr_schedule: WarmupCosineLR
  lr_scheduler_params:
    warmup_num_steps: 0
    cos_min_ratio: 1.0
    total_num_steps: 1_000_000_000

dataloader_config:
  # Common
  shuffle_by: dataset
  fast_shuffle: True
  add_iw_ih_token: False
  add_timestep_token: True
  add_image_shape_token: True
  use_front_boi_token: True
  use_front_src_image: True   # updated
  use_joint_image_feature: True   # updated
  sequence_template: instruct
  combined_iterator_sampling_mode: fixed
  # TODO
  sampling_probs: '{"t2i": 1.0}'

  # Text-to-Image
  t2i_batch_size: 1
  t2i_task_kwargs:
    training_image_size: 1024 # only used when multireso is False
    image_token_length: 4096
    text_token_length: 256
    system_prompt_token_length: 1280
    t2i_system_prompt_type: en_unified
    uncond_p: 0.1
    try_first_use_source_text: False    # Must be False
    # caption_processor: caption_process_v2
    # caption_processor_kwargs: '{"ocr_only_long_caption": true}'
    use_general_style: False
    image_caption_rate: 0.0
    instruction_candidates_type: 'off'
    # caption_sample_ratio: '{"long_caption":0.4,"medium_caption":0.3,"short_caption":0.25,"background":0.08,"shot_type":0.08,"style":0.08,"light":0.08,"atmosphere":0.08,"composition":0.08,"IP":0.08}'
    attn_type: flex
  t2i_index_kwargs:
    index_file:
      # - /apdcephfs_zwfy/share_303937731/yutaocui/exp_dir/gemini_rl/arrows/arena_deform_grpo/mb1024.json
      # - /apdcephfs_nj10/share_301739632/yutaocui/exp_dir/gemini_rl/arrows/semantic_unireward/mb1024.json  # 6k
      # - /apdcephfs_nj10/share_301739632/yutaocui/exp_dir/gemini_rl/arrows/hps_grpo/mb1024.json  # 10w
      # - /apdcephfs_nj10/share_301739632/yutaocui/exp_dir/gemini_rl/arrows/pure_text_rendering/mb1024.json
      # - /apdcephfs_zwfy2/share_303937731/jacobjzli/Data_HYMM/TI2I/edit_data_1028/arrow/mb1024.json # 2w
      # - /apdcephfs_nj10/share_301739632/jacobjzli/workspace/hunyuan_multimoda_gen_ar/my_posttrain_new/25_10_28_build_TI2I_data/data/edit_data_1028_wref/arrow/mb1024.json
      # - /apdcephfs_zwfy2/share_303944931/lucasxwang/data/gemini/grpo/ti2i/edit_data_1028_wref/arrow/mb1024.json
      #- /apdcephfs_nj10/share_301739632/yutaocui/exp_dir/gemini_rl/arrows/hps_grpo/mb1024.json
      - /apdcephfs_zwfy2/share_303944931/lucasxwang/data/gemini/grpo/ti2i/joint_x2i/multireso.json
    multireso: True
    no_load_image: True
    ceph_base_inv: '{"nj10": "/apdcephfs_nj10/share_301739632", "zwfy": "/apdcephfs_zwfy/share_303937731", "zwfy2": "/apdcephfs_zwfy2/share_303944931"}'
    # ceph_base_inv: '{"nj8": "/apdcephfs_nj8/share_301739632", "gy4": "/apdcephfs_nj8/share_301739632", "gy2": "/apdcephfs_nj10/share_301739632", "nj8_3019": "/apdcephfs_nj8/share_301932837", "nj10": "/apdcephfs_nj10/share_301739632"}'
    seed_col: seed
    task_type: grpo
    src_image_col: src_url_cos
    ref_image_col: tgt_url_cos
    win_imgs_num_col: win_imgs_num
    lose_imgs_num_col: lose_imgs_num
    # image_caption_col: caption_v2   # cache_image
    image_caption_col_2: prompt
    random_sample_win_lose_ratio: 1.0
    index_strategy: probability
    index_probability: [1]
    # joint x2i
    use_reward_tags: False

  # Dataloader
  dataloader_params:
    num_workers: 4
    pin_memory: True
    prefetch_factor: 4
