training_config:
  trainer_name: multimodal_gemini_beta_grpo_trainer.MultiModalGeminiBetaGRPOTrainer
  micro_batch_size: 1
  gradient_accumulation_steps: 1 #1
  global_batch_size: null
  global_seed: 3409   # TODO
  zero_stage: 2
  log_every: 1
  tensorboard: True
  gradient_checkpoint: True
  gradient_checkpoint_layers: -1
  use_compile: False
  benchmark: False

  overlap_comm: True
  reduce_bucket_size: 5e7

  max_training_steps: 1_000_000_000
  ckpt_every: 100

  init_save: False
  final_save: True

  resume: null
  resume_dataloader: False
  no_load_optim_states: False
  no_load_ema: False
  default_rank0_ss: False
  fix_lr_scheduler: False
  skip_nan_grad: True

  validation_at_steps: []
  validation_every: -1
  validation_metrics: []
  validation_metrics_save_image: False

  # grpo-related
  kl_weight: 0.01 #0.1
  adv_clip_max: 5.0 #1.0
  clip_range: 0.0001 #0.0
  model_cpu_offload: True
  num_train_timesteps: 40 #40
  timestep_fraction: 1.0
  num_generations: 8  # 8
  num_grpo_iterations: 1
  visualize_reward: False
  visualize_every: 100
  training_strategy: progressive
  timesteps_group_size: 4
  train_iters_per_timesteps_group: 50 #35 #25 #100
  timesteps_group_overlap: True
  # dynamic_t1: 15
  # dynamic_k: 0.5
  # dynamic_y0: 20
  quant_reward: False
  advantage_norm: trimmed_mean
  trimmed_ratio: 0.25
  multi_reward_mix: reward_aggr # reward_aggr, advantage_aggr
  use_extra_low_timesteps_kl: True
  extra_kl_start_timestep: 20
  extra_kl_end_timestep: 29
  only_kl_loss_weight: 0.1

  # unified_reward:
  #   ur_url: 
  #     - xxxxx
  #     - xxxxx
  #     - xxxxx
  #     - xxxxx
  #   ur_num_workers: 1
  #   ur_default_question_type: semantic

  image_reward:
    ir_model_path: /apdcephfs_zwfy/share_303937731/yutaocui/models_zoo/ImageReward.pt #/apdcephfs_nj10/share_301739632/1_public_models/hymm_ar_assets/reward_model/image_reward/ImageReward.pt
    # /apdcephfs_zwfy/share_303793872/yutaocui/pretrained_models/image_reward/ImageReward.pt
    med_config: /apdcephfs_zwfy/share_303937731/yutaocui/models_zoo/med_config.json #/apdcephfs_nj10/share_301739632/1_public_models/hymm_ar_assets/reward_model/image_reward/med_config.json
    # /apdcephfs_zwfy/share_303793872/yutaocui/pretrained_models/image_reward/med_config.json
    ir_http_proxy: xxxxx
    ir_https_proxy: xxxxx
  pick_score:
    ps_http_proxy: xxxxx
    ps_https_proxy: xxxxx
  hps_clip_reward:
    clip_ckpt_path: /apdcephfs_zwfy/share_303937731/yutaocui/models_zoo/hps_ckpt/open_clip_pytorch_model.bin #/apdcephfs_nj10/share_301739632/yutaocui/workspace/DanceGRPO/hps_ckpt/open_clip_pytorch_model.bin
    hps_ckpt_path: /apdcephfs_zwfy/share_303937731/yutaocui/models_zoo/hps_ckpt/HPS_v2.1_compressed.pt #/apdcephfs_nj10/share_301739632/yutaocui/workspace/DanceGRPO/hps_ckpt/HPS_v2.1_compressed.pt
  
  image_reward_weight: 0.8
  hps_clip_weight: 2.0 # 2.0
  unified_reward_weight: 0.1
  pick_score_weight: 0.9

  # kl_weight: 0.01  #0.0001
  # adv_clip_max: 5.0 #1.0
  # clip_range: 0.0001 #0.0
  # model_cpu_offload: True
  # num_train_timesteps: 40
  # timestep_fraction: 1.0
  # num_generations: 16
  # num_grpo_iterations: 1
  # visualize_reward: False
  # visualize_every: 100
  # training_strategy: progressive # random
  # prog_overlap: True
  # prog_timesteps_group_size: 4
  # train_iters_per_timesteps_group: 25
  # quant_reward: False
  # text:
  #   ocr:
  #     enable: True
  #     ocr_url: xxxxx
  #     ocr_num_workers: 8
  #     if_split_by_character: True
  #     reward_metric: "f1_score" # 'precision', 'recall', 'f1_score', 'matched_count'

sampling_config:
  ckpt: null
  load_key: module
  metric_image_size: 1024
  metric_batch_size: 8
  evaluation_metrics: [fid@coco30k, clip_score@coco30k, hpsv2@coco30k, t2i_compbench]
  rerank: 1
  sample_image_size: 1024
  sample_batch_size: 8
  seed_type: auto
  seed: 123456
  guidance_scale: 6.0
  diff_infer_steps: 100
  sample_flow_shift: 1.0
  sample_use_flux_shift: False
  do_sample: True

  logits_processors_cfg:
    - TemperatureLogitsWarper:
        temperature: 0.6
    - TopKLogitsWarper:
        top_k: 1024
    - TopPLogitsWarper:
        top_p: 0.95

model_config:
  model_name: hunyuan-dense-7b
  model_structure: MultiModalTransfusion
  tokenizer_name: hunyuan-dense-7b-tokenizer-refactor
  # TODO
  pretrained_ckpt: /apdcephfs_zwfy/share_303937731/jacobjzli/hymm_model_ckpts/dpo_semantic5_text1_aes4_merged_based_instruct_150k.pt
  pretrained_reference_model_ckpt: /apdcephfs_zwfy/share_303937731/jacobjzli/hymm_model_ckpts/dpo_semantic5_text1_aes4_merged_based_instruct_150k.pt
  # pretrained_ckpt: /apdcephfs_nj8/share_301739632/jarvizhang/share/gemini_release/instruct_merged_v2/checkpoints/0150000/mp_rank_00_model_states.pt
  # pretrained_reference_model_ckpt: /apdcephfs_nj8/share_301739632/jarvizhang/share/gemini_release/instruct_merged_v2/checkpoints/0150000/mp_rank_00_model_states.pt
  precision: bf16
  autocast_dtype: bf16
  media_vocab_size: 0

  denoise_type: flow
  flow_path_type: linear
  flow_predict_type: velocity
  flow_loss_weight: null
  flow_train_eps: null
  flow_sample_eps: null
  flow_snr_type: lognorm
  flow_reverse: True
  flow_shift: 3.0
  sample_flow_shift: 3.0
  use_flux_shift: False
  flux_base_shift: null
  flux_max_shift: null

  model_kwargs:
    block_size: 17000   # TODO
    # vision_model:
    #   vision_model_type: siglip2-large-patch16-512
    #   vision_model_precision: fp32
    #   vision_model_autocast_dtype: fp32
    #   vision_model_freeze: False
    # vision_aligner:
    #   vision_aligner_type: mlp_gelu
    #   vision_aligner_precision: fp32
    #   vision_aligner_autocast_dtype: fp32
    #   vision_aligner_freeze: False
    #   vision_aligner_params:
    #     vision_aligner_depth: 2
    #     vision_aligner_input_dim: 1024   # Align to vision_model_type's hidden_dim
    #     vision_aligner_n_embed: 4096     # Align to model_name's n_embd

  image_loss_weight: 5.0
  gather_text_tokens: True

  img_proj_type: unet
  patch_embed_hidden_dim: 1024
  patch_size: 1

extra_model_config:
  vae_type: 16x16x4-32c-hy-image
  vae_precision: fp32
  vae_autocast_dtype: fp32
  vae_latent_dim: 32
#  vae_sample_size: 768
#  vae_spatial_tiling: True

optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.000005 #0.00001 学习率1e-5出图就会崩
    betas: [0.9, 0.999]
    eps: 0.00000001
    weight_decay: 0.0001 # 0.01

lr_scheduler_config:
  lr_schedule: WarmupCosineLR
  lr_scheduler_params:
    warmup_num_steps: 0
    cos_min_ratio: 1.0
    total_num_steps: 1_000_000_000

dataloader_config:
  # Common
  shuffle_by: dataset
  fast_shuffle: True
  add_iw_ih_token: False
  add_timestep_token: True
  add_image_shape_token: True
  use_front_boi_token: True
  sequence_template: instruct
  combined_iterator_sampling_mode: fixed
  # TODO
  sampling_probs: '{"t2i": 1.0}'

  # Text-to-Image
  t2i_batch_size: 1
  t2i_task_kwargs:
    training_image_size: 1024 # only used when multireso is False
    image_token_length: 4096
    text_token_length: 256
    uncond_p: 0.1
    try_first_use_source_text: False    # Must be False
    # caption_processor: caption_process_v2
    # caption_processor_kwargs: '{"ocr_only_long_caption": true}'
    use_general_style: False
    image_caption_rate: 0.0
    instruction_candidates_type: 'off'
    # caption_sample_ratio: '{"long_caption":0.4,"medium_caption":0.3,"short_caption":0.25,"background":0.08,"shot_type":0.08,"style":0.08,"light":0.08,"atmosphere":0.08,"composition":0.08,"IP":0.08}'
    attn_type: flex
  t2i_index_kwargs:
    index_file:
      # - /apdcephfs_zwfy/share_303937731/yutaocui/exp_dir/gemini_rl/arrows/hps_grpo/mb1024.json
      # - /apdcephfs_zwfy/share_303937731/jacobjzli/hymm_data/semantic_unireward/mb1024.json  # 6k
      - /apdcephfs_zwfy/share_303937731/jacobjzli/hymm_data/hps_grpo/mb1024.json  # 10w
      # - /apdcephfs_nj10/share_301739632/yutaocui/exp_dir/gemini_rl/arrows/pure_text_rendering/mb1024.json
    multireso: True
    no_load_image: True
    ceph_base_inv: '{"nj10": "/apdcephfs_zwfy/share_303937731"}'
    # ceph_base_inv: '{"nj8": "/apdcephfs_nj8/share_301739632", "gy4": "/apdcephfs_nj8/share_301739632", "gy2": "/apdcephfs_nj10/share_301739632", "nj8_3019": "/apdcephfs_nj8/share_301932837", "nj10": "/apdcephfs_nj10/share_301739632"}'
    seed_col: seed
    win_imgs_num_col: win_imgs_num
    lose_imgs_num_col: lose_imgs_num
    # image_caption_col: caption_v2   # cache_image
    image_caption_col_2: prompt
    random_sample_win_lose_ratio: 1.0
    # image_text_col: text_source
    # index_strategy: probability

  # Dataloader
  dataloader_params:
    num_workers: 4
    pin_memory: True
    prefetch_factor: 4
