training_config:
  trainer_name: multimodal_gemini_beta_trainer.MultiModalGeminiBetaTrainer
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  global_batch_size: null
  global_seed: 125
  zero_stage: 2
  log_every: 1
  tensorboard: True
  gradient_checkpoint: True
  gradient_checkpoint_layers: -1
  use_compile: False

  overlap_comm: True
  reduce_bucket_size: 5e7

  max_training_steps: 500_000
  ckpt_every: 1000

  init_save: False
  final_save: True

  resume: null
  resume_dataloader: False
  no_load_optim_states: False
  no_load_ema: False
  default_rank0_ss: False
  fix_lr_scheduler: False

  validation_at_steps: []
  validation_every: -1
  validation_metrics: []
  validation_metrics_save_image: False

sampling_config:
  ckpt: null
  load_key: module
  metric_image_size: 1024
  metric_batch_size: 8
  evaluation_metrics: [fid@coco30k, clip_score@coco30k, hpsv2@coco30k, t2i_compbench]
  rerank: 1
  sample_image_size: 1024
  sample_batch_size: 8
  seed_type: auto
  seed: 123456
  guidance_scale: 6.0
  diff_infer_steps: 100
  sample_flow_shift: 1.0
  sample_use_flux_shift: False
  do_sample: True

  logits_processors_cfg:
    - TemperatureLogitsWarper:
        temperature: 0.6
    - TopKLogitsWarper:
        top_k: 1024
    - TopPLogitsWarper:
        top_p: 0.95

model_config:
  model_name: hunyuan-dense-7b
  model_structure: MultiModalTransfusion
  tokenizer_name: hunyuan-dense-7b-tokenizer-refactor
  load_prepend_key: 'language_model.'    # Enable to load from pretrained ckpt of Transfusion structure
  pretrained_ckpt: hunyuan-dense-7b
  precision: bf16
  autocast_dtype: bf16
  media_vocab_size: 0

  denoise_type: flow
  flow_path_type: linear
  flow_predict_type: velocity
  flow_loss_weight: null
  flow_train_eps: null
  flow_sample_eps: null
  flow_snr_type: lognorm
  flow_reverse: True
  flow_shift: 3.0
  use_flux_shift: False
  flux_base_shift: null
  flux_max_shift: null

  model_kwargs:
    block_size: 12800 # 23040
    vision_model:
      vision_model_type: siglip2-large-patch16-512
      vision_model_precision: fp32
      vision_model_autocast_dtype: fp32
      vision_model_freeze: True
    vision_aligner:
      vision_aligner_type: mlp_gelu
      vision_aligner_precision: fp32
      vision_aligner_autocast_dtype: fp32
      vision_aligner_freeze: False
      vision_aligner_params:
        vision_aligner_depth: 2
        vision_aligner_input_dim: 1024   # Align to vision_model_type's hidden_dim
        vision_aligner_n_embed: 4096     # Align to model_name's n_embd

  image_loss_weight: 5.0

  img_proj_type: unet
  patch_embed_hidden_dim: 1024
  patch_size: 1

extra_model_config:
  vae_type: 16x16x4-32c-hy-image
  vae_precision: fp32
  vae_autocast_dtype: fp32
  vae_latent_dim: 32

optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.0001
    betas: [0.9, 0.95]
    eps: 0.000001
    weight_decay: 0.01

lr_scheduler_config:
  lr_schedule: WarmupCosineLR
  lr_scheduler_params:
    warmup_num_steps: 5000
    cos_min_ratio: 1.0
    total_num_steps: 500_000

dataloader_config:
  # Common
  shuffle_by: dataset
  fast_shuffle: True
  add_iw_ih_token: False
  add_timestep_token: True
  add_image_shape_token: True
  use_front_boi_token: True
  sequence_template: pretrain
  combined_iterator_sampling_mode: fixed
  sampling_probs: '{"t2i": 0.34294053, "interleave": 0.05545421, "editing": 0.00072966, "face_id_clip": 0.00087559, "mmu": 0.3, "mmu_interleave": 0.1, "lm": 0.2}'

  # Text-to-Image
  t2i_batch_size: 8
  t2i_task_kwargs:
    training_image_size: 512 # only used when multireso is False
    image_token_length: 1024
    text_token_length: 256
    uncond_p: 0.1
    try_first_use_source_text: False    # Must be False
    caption_processor: caption_process_v2
    caption_processor_kwargs: '{"ocr_only_long_caption": true}'
    use_general_style: True
    image_caption_rate: 1.0   # 使用 caption 的比例
    caption_sample_ratio: '{"long_caption":0.4,"medium_caption":0.3,"short_caption":0.25,"background":0.8,"shot_type":0.8,"style":0.8,"light":0.8,"atmosphere":0.8,"composition":0.8,"IP":0.8}'
  t2i_index_kwargs:
    index_file:
      - /apdcephfs_nj8/share_301739632/0_public_datasets/text2image/taurus_train_data/multireso_512px_all.json
      - /apdcephfs_nj8/share_301739632/0_public_datasets/text2image/arrows_text_rendering/train_json_1/wenzi_from_kris_20250404_multi_mb512.json
      - /apdcephfs_nj8/share_301739632/0_public_datasets/text2image/arrow_biaoqingbao250404/train_json/biaoqingbao250404_mb512.json
      - /apdcephfs_nj8/share_301739632/0_public_datasets/text2image/arrows_boutique_game/train_json/game_470w_multireso_mb512.json
      - /apdcephfs_nj8/share_301739632/0_public_datasets/text2image_arrows_2501_style/maxpzzhang_dongman_sigongge_1st_batch_till_0405_noon/mb512.json
    multireso: True
    ceph_base_inv: '{"nj8": "/apdcephfs_nj8/share_301739632", "gy4": "/apdcephfs_nj8/share_301739632"}'
    image_col: cache_image
    image_caption_col: caption_v2
    image_caption_col_2: simple_caption
    image_text_col: text_source

  # Editing
  editing_batch_size: 4
  editing_task_kwargs:
    editing_test_arrow: /apdcephfs_nj10/share_301739632/0_public_datasets/instruction_tuning_gemini/image_editing/OmniEdit/test.arrow
    editing_training_image_size: 512
    editing_image_token_length: 1024
    editing_text_token_length: 256
    editing_uncond_p: 0.1
    editing_caption_processor: caption_process_v2
    editing_caption_processor_kwargs: '{"ocr_only_long_caption": true}'
    editing_image_caption_rate: 1.0
    editing_caption_sample_ratio: '{"long_caption":0.4,"medium_caption":0.3,"short_caption":0.25,"background":0.8,"shot_type":0.8,"style":0.8,"light":0.8,"atmosphere":0.8,"composition":0.8,"IP":0.8}'
    editing_mask_generator_probs: [0.4, 0.4, 0.2]
  editing_index_kwargs:
    editing_index_file:
      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/generative_instruction_tuning/image_editing/Video2Frame/mb512.json
      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/generative_instruction_tuning/image_editing/SeedEdit/mb512.json
      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/generative_instruction_tuning/image_inpainting/golden/mb512.json
      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/generative_instruction_tuning/controlnet/mb512.json
      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/generative_instruction_tuning/style_transfer/text_guided/mb512.json
    editing_multireso: True
    editing_ceph_base: '{"/apdcephfs_nj8/share_301739632": "nj8"}'
    editing_src_image_col: src_img_bytes
    editing_tgt_image_col: tgt_img_bytes
    editing_image_caption_col: instruction
    editing_inpainting_image_col: image
    editing_inpainting_caption_col: tgt_caption_v2
    editing_inpainting_lama_ratio: 0.5
    editing_controlnet_src_cols: [
      "pose_img_full", "pose_img_only_body", "depth_midas", "depth_zoe", "normal_bae", "lineart", "lineart_coarse",
      "mlsd", "scribble_hed", "scribble_pidi", "edge_hed_results", "edge_hed_results_safe", "edge_pidi_results",
      "edge_pidi_results_safe", "seg_uniformer", "seg_oneformer_coco", "seg_oneformer_ade20k"
    ]
    editing_controlnet_caption_col: tgt_simple_caption

  # subject driven
  subject_driven_bach_size: 2
  subject_driven_task_kwargs:
    subject_driven_training_image_size: 512
    subject_driven_image_token_length: 1024
    subject_driven_text_token_length: 256
    subject_driven_uncond_p: 0.1
    subject_driven_max_num_refs: 3
  subject_driven_index_kwargs:
    subject_driven_index_file:
      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/generative_instruction_tuning/subject_driven/mb512.json
      - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/generative_instruction_tuning/style_transfer/image_guided/mb512.json
    subject_driven_multireso: True
    subject_driven_ceph_base: '{"/apdcephfs_nj8/share_301739632": "nj8"}'
    subject_driven_tgt_image_col: tgt_img_bytes
    subject_driven_image_caption_col: simple_caption

  # face id with clip
  face_id_clip_batch_size: 4
  face_id_clip_task_kwargs:
    face_id_clip_training_image_size: 512
    face_id_clip_image_token_length: 1024
    face_id_clip_text_token_length: 256
    face_id_clip_uncond_p: 0.1
    face_id_clip_caption_sample_ratio: '{"long caption":0.75,"short caption":0.25,"background":0.8,"shot type":0.8,"style":0.8,"light":0.8,"atmosphere":0.8}'
    face_id_clip_caption_processor: caption_process
  face_id_clip_index_kwargs:
    face_id_clip_index_file: /apdcephfs_nj8/share_301739632/0_public_datasets/instruction_tuning_gemini/face_id_preserve/mb512.json
    face_id_clip_multireso: True
    face_id_clip_ceph_base: '{"/apdcephfs_nj8/share_301739632": "gy2"}'

  # Interleave
  interleave_batch_size: 1
  interleave_task_kwargs:
    interleave_training_image_size: 512 # only used when multireso is False
    interleave_max_length: 12800 # 23040
    interleave_drop_last: True
    interleave_caption_sample_ratio: '{"long_caption":0.4,"medium_caption":0.3,"short_caption":0.25,"background":0.8,"shot_type":0.8,"style":0.8,"light":0.8,"atmosphere":0.8,"composition":0.8,"IP":0.8}'
    interleave_caption_processor: caption_process_v2
    interleave_caption_processor_kwargs: '{"ocr_only_long_caption": true}'
    interleave_caption_sample_ratio_video_cap: '{"long caption":0.4,"short caption":0.25,"background":0.8,"shot_type":0.8,"style":0.8,"light":0.8,"atmosphere":0.8,"camera movement":0.8}'
    interleave_caption_processor_video_cap: caption_process_v2
    interleave_caption_processor_kwargs_video_cap: '{"ocr_only_long_caption": true}'
  interleave_index_kwargs:
    interleave_index_file: /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/interleave_index/interleave_v2f_4kw_all.json
    interleave_multireso: False
    interleave_ceph_base: '{"/apdcephfs_nj8/share_301739632":"nj8"}'
    interleave_message_col: caption
    interleave_image_key: cache_image

  # Language Model
  lm_index_file:
    - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2t_index/hy_text_v2.json
    - /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2t_index/open_instruct_text.json
  lm_token_length: 12800
  lm_index_kwargs:
    lm_ceph_base: '{"/apdcephfs_nj8/share_301739632":"nj8"}'

  # Multimodal Understanding
  mmu_batch_size: 4
  mmu_task_kwargs:
    mmu_token_length: 2560
    mmu_switch_image_text: True
    mmu_drop_last: True
  mmu_index_kwargs:
    mmu_index_file: /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/mmu_index/mmu_single_v2.json
    mmu_ceph_base: '{"/apdcephfs_nj8/share_301739632":"nj8"}'
    mmu_message_col: caption

  mmu_interleave_task_kwargs:
    mmu_interleave_token_length: 12800
    mmu_interleave_switch_image_text: False
    mmu_interleave_drop_last: True
  mmu_interleave_index_kwargs:
    mmu_interleave_index_file: /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/mmu_interleave_index/mmu_interleave_jp_filtered.json
    mmu_interleave_ceph_base: '{"/apdcephfs_nj8/share_301739632":"nj8"}'
    mmu_interleave_message_col: caption

  # Dataloader
  dataloader_params:
    num_workers: 4
    pin_memory: True
    prefetch_factor: 4
