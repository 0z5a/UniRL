training_config:
  trainer_name: instruction_tuning_gemini_alpha_trainer.InstructionTuningGeminiAlphaTrainer
  micro_batch_size: 2
  gradient_accumulation_steps: 1
  global_batch_size: null
  global_seed: 1
  reproduce: False
  profile: False
  zero_stage: 2
  log_every: 1
  tensorboard: True
  training_parts: null
  gradient_checkpoint: True
  gradient_checkpoint_layers: 28

  use_ema: False
  distributed_ema: False
  ema_precision: bf16
  ema_warmup: True
  ema_decay: null
  ema_warmup_power: null

  max_epochs: 100                           # Not used
  max_training_steps: 1000000
  ckpt_every: 5000

  init_save: False
  final_save: True
  save_n_training_data: 16

  resume: null
  resume_dataloader: False
  no_load_optim_states: False
  no_load_ema: False
  default_rank0_ss: False
  fix_lr_scheduler: False

  validation_at_steps: [100]
  validation_every: 5000
  validation_metrics: null
  validation_metrics_save_image: False

sampling_config:
  ckpt: null
  load_key: module
  metric_image_size: 1024
  metric_batch_size: 1
  evaluation_metrics: [fid@coco30k, clip_score@coco30k, hpsv2@coco30k, t2i_compbench, geneval]
  rerank: 1
  sample_image_size: 1024
  sample_batch_size: 1
  seed_type: auto
  seed: 123456
  guidance_scale: 6.0
  face_guidance_scale: 6.0
  diff_infer_steps: 50
  sample_flow_shift: 1.0
  sample_use_flux_shift: False

logits_processors_cfg:
  - TemperatureLogitsWarper:
      temperature: 0.6
  - TopKLogitsWarper:
      top_k: 1024
  - TopPLogitsWarper:
      top_p: 0.95

model_config:
  model_name: hunyuan-dense-7b
  # model_structure: Transfusion
  model_structure: MultiModalTransfusion
  tokenizer_name: hunyuan-dense-7b-tokenizer-refactor
  pretrained_ckpt: /apdcephfs_nj10/share_301739632/ckczzjzhang/output_ar/ptm/gemini_alpha_stage3_epoch2/checkpoint/global_step35000/mp_rank_00_model_states.pt
  load_prepend_key: 'language_model.'
  load_llm_to_mllm: False
  precision: bf16
  autocast_dtype: bf16
  media_vocab_size: 0

  # face analysis
  insightface_path: /apdcephfs_gy2/share_302507476/1_public_models/hymm_ar_assets/others/insightface/


  denoise_type: flow
  flow_path_type: linear
  flow_predict_type: velocity
  flow_loss_weight: null
  flow_train_eps: null
  flow_sample_eps: null
  flow_snr_type: lognorm
  flow_reverse: True
  flow_shift: 3.0
  use_flux_shift: False
  flux_base_shift: null
  flux_max_shift: null
  vision_model_type: null
  model_kwargs:
    block_size: 4608  # 4404 = 1<bos> + 256 + 4 * (1024 + 5) + 9 + 4(t2i dummy) + 16(face dummy) +1</answer> + 1<eos>
    face_aligner:
      face_aligner_type: self
      face_aligner_precision: bf16
      face_aligner_autocast_dtype: bf16
      face_aligner_freeze: False
      face_aligner_params:
        depth: 4
        output_dim: 4096 # Align to model_name's n_embd
        dim: 4096 # Align to model_name's n_embd
        embedding_dim: 512   # Align to vision_model_type's hidden_dim
        num_queries: 16     # Number of queries of resampler

  image_loss_weight: 5.0

  img_proj_type: unet
  patch_embed_hidden_dim: 1024
  patch_size: 1

extra_model_config:
  vae_type: 32x32-64c-hy_v2
  vae_precision: fp32
  vae_latent_dim: 64

optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.00001
    betas: [0.9, 0.95]
    eps: 0.000001
    weight_decay: 0.01

lr_scheduler_config:
  lr_schedule: WarmupCosineLR
  lr_scheduler_params:
    warmup_num_steps: 5000
    total_num_steps: 100000000
    cos_min_ratio: 1.0

dataloader_config:
  # common
  add_iw_ih_token: True
  add_timestep_token: True
  use_front_boi_token: True
  shuffle_by: dataset
  fast_shuffle: True
  sampling_probs: [1.0, 1.0, 1.0, 0.5, 1.0, 1.0, 1.0]

  faceid_dummy_token_number: 16 # qformer's dummy token number
  target_image_dummy_token_number: 4

  # t2i
  t2i_task_kwargs:
    training_image_size: 1024
    image_token_length: 1024
    text_token_length: 256
    uncond_p: 0.1
    try_first_use_source_text: True
    caption_processor: caption_process_v2
    caption_processor_kwargs: '{"ocr_only_long_caption": true}'
    use_general_style: True
    image_caption_rate: 0.6
    caption_sample_ratio: '{"long_caption":0.4,"medium_caption":0.3,"short_caption":0.25,"background":0.8,"shot_type":0.8,"style":0.8,"light":0.8,"atmosphere":0.8,"composition":0.8,"IP":0.8}'
  t2i_index_kwargs:
    index_file: /apdcephfs_nj8/share_301739632/0_public_datasets/text2image_gemini/gemini_json/mb1024_v2/mb1024.json
    multireso: True
    ceph_base: '{"/apdcephfs_nj8/share_301739632": "gy2"}'
    image_col: image@_image
    image_text_col: text_source
    image_caption_col: caption_v2
    clip_score_col: clip_score@_clip_score
    index_strategy: uniform
    index_probability: null

  # lm
  lm_index_file: /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2t_index/instruct_text.json
  lm_token_length: 4096
  lm_index_kwargs:
    lm_ceph_base: '{"/apdcephfs_nj8/share_301739632": "gy2"}'
    lm_index_strategy: uniform
    lm_index_probability: null

  # inpainting
  # inpainting_randomly_sampled_from_1024_high_quality_v2_test_arrow: /apdcephfs_gy2/share_302507476/0_public_datasets/instruction_tuning_gemini/image_inpainting/test.arrow
  inpainting_randomly_sampled_from_1024_high_quality_v2_test_arrow: /apdcephfs_nj10/share_301739632/0_public_datasets/instruction_tuning_gemini/image_inpainting/test.arrow

  inpainting_randomly_sampled_from_1024_high_quality_v2_task_kwargs:
    inpainting_randomly_sampled_from_1024_high_quality_v2_training_image_size: 1024
    inpainting_randomly_sampled_from_1024_high_quality_v2_image_token_length: 1024
    inpainting_randomly_sampled_from_1024_high_quality_v2_text_token_length: 256
    inpainting_randomly_sampled_from_1024_high_quality_v2_uncond_p: 0.1
    inpainting_randomly_sampled_from_1024_high_quality_v2_caption_processor: caption_process_v2
    inpainting_randomly_sampled_from_1024_high_quality_v2_caption_sample_ratio: '{"long_caption": 0.1, "medium_caption": 0.1, "short_caption": 0.8,"background": 0.0, "shot_type":0.0, "style": 0.0, "light":0.0, "atmosphere":0.0, "composition": 0.0, "IP": 0.0}'
    inpainting_randomly_sampled_from_1024_high_quality_v2_mask_generator_probs: [0.4, 0.4, 0.2]  # random_irregular, random_rectangle, outpainting, lama use [0.5, 0.5, 0.0]
  inpainting_randomly_sampled_from_1024_high_quality_v2_index_kwargs:
    inpainting_randomly_sampled_from_1024_high_quality_v2_index_file: /apdcephfs_nj8/share_301739632/0_public_datasets/text2image_gemini/gemini_json/mb1024_v2/mb1024.json
    inpainting_randomly_sampled_from_1024_high_quality_v2_multireso: True
    inpainting_randomly_sampled_from_1024_high_quality_v2_ceph_base: '{"/apdcephfs_nj8/share_301739632": "gy2"}'
    inpainting_randomly_sampled_from_1024_high_quality_v2_index_strategy: uniform
    inpainting_randomly_sampled_from_1024_high_quality_v2_index_probability: null
    inpainting_randomly_sampled_from_1024_high_quality_v2_tgt_image_col: image@_image
    inpainting_randomly_sampled_from_1024_high_quality_v2_image_caption_col: caption_v2

  # Editing ImagenHub
  editing_ImagenHub_test_arrow: /apdcephfs_gy2/share_302507476/0_public_datasets/instruction_tuning_gemini/image_editing/ImagenHub/ImagenHub_instruction_src_img_bytes.arrow
  
  # OmniEdit
  # editing_OmniEdit_test_arrow: /apdcephfs_gy2/share_302507476/0_public_datasets/instruction_tuning_gemini/image_editing/OmniEdit/test.arrow
  editing_OmniEdit_test_arrow: /apdcephfs_nj10/share_301739632/0_public_datasets/instruction_tuning_gemini/image_editing/OmniEdit/test.arrow

  editing_OmniEdit_task_kwargs:
    editing_OmniEdit_training_image_size: 1024
    editing_OmniEdit_image_token_length: 1024
    editing_OmniEdit_text_token_length: 256
    editing_OmniEdit_uncond_p: 0.1
  editing_OmniEdit_index_kwargs:
    editing_OmniEdit_index_file: /apdcephfs_nj8/share_301739632/0_public_datasets/instruction_tuning_gemini/image_editing/OmniEdit/mb1024.json
    editing_OmniEdit_multireso: True
    editing_OmniEdit_ceph_base: '{"/apdcephfs_nj8/share_301739632": "gy2"}'
    editing_OmniEdit_index_strategy: uniform
    editing_OmniEdit_index_probability: null
    editing_OmniEdit_src_image_col: src_image
    editing_OmniEdit_tgt_image_col: image
    editing_OmniEdit_image_caption_col: instruction


  # video2frame
  # editing_video2frame_in_house_test_arrow: /apdcephfs_gy2/share_302507476/0_public_datasets/instruction_tuning_gemini/image_editing/extended_Video2Frame/test.arrow
  editing_video2frame_in_house_test_arrow: /apdcephfs_nj10/share_301739632/0_public_datasets/instruction_tuning_gemini/image_editing/extended_Video2Frame/test.arrow

  editing_video2frame_in_house_task_kwargs:
    editing_video2frame_in_house_training_image_size: 1024
    editing_video2frame_in_house_image_token_length: 1024
    editing_video2frame_in_house_text_token_length: 256
    editing_video2frame_in_house_uncond_p: 0.1
  editing_video2frame_in_house_index_kwargs:
    editing_video2frame_in_house_index_file: /apdcephfs_nj8/share_301739632/0_public_datasets/instruction_tuning_gemini/image_editing/extended_Video2Frame/mb1024.json
    editing_video2frame_in_house_multireso: True
    editing_video2frame_in_house_ceph_base: '{"/apdcephfs_nj8/share_301739632": "gy2"}'
    editing_video2frame_in_house_index_strategy: uniform
    editing_video2frame_in_house_index_probability: null
    editing_video2frame_in_house_src_image_col: src_img_bytes
    editing_video2frame_in_house_tgt_image_col: tgt_img_bytes
    editing_video2frame_in_house_image_caption_col: instruction

  # subject driven
  subject_driven_task_kwargs:
    subject_driven_training_image_size: 1024
    subject_driven_image_token_length: 1024
    subject_driven_text_token_length: 256
    subject_driven_uncond_p: 0.1
    subject_driven_max_num_refs: 3
  subject_driven_index_kwargs:
    subject_driven_index_file: "/apdcephfs_nj8/share_301739632/0_public_datasets/instruction_tuning_gemini/subject_driven/mb1024.json"
    subject_driven_multireso: True
    subject_driven_ceph_base: '{"/apdcephfs_nj8/share_301739632": "gy2"}'
    subject_driven_index_strategy: uniform
    subject_driven_index_probability: null
    subject_driven_tgt_image_col: image
    subject_driven_image_caption_col: caption

  # faceid preserve
  face_id_preserve_test_dir: /apdcephfs_cq8/share_2938211/chenyangqi/datasets/hymm_ar_assets_gy/evaluation/dataset/real_world_face
  face_id_preserve_task_kwargs:
    face_id_preserve_training_image_size: 1024
    face_id_preserve_image_token_length: 1024
    face_id_preserve_text_token_length: 256
    face_id_preserve_uncond_p: 0.3
    face_id_preserve_face_uncond_p: 0.3
    face_id_preserve_caption_processor: caption_process
    face_id_preserve_caption_sample_ratio: '{"long caption": 0.50, "short caption": 0.45, "background": 0.0, "shot type": 0.0, "style": 0.0, "light": 0.0, "atmosphere": 0.0, "camera movement": 0.0}'
    face_id_preserve_face_index_unique: True
    face_id_preserve_src_condition_type: face_embed
    face_id_preserve_face_crop: True # for smapling
    face_id_preserve_face_bof_eof: True # for smapling
    face_id_preserve_resampler_token_length: 16
  face_id_preserve_index_kwargs:
    face_id_preserve_index_file: /apdcephfs_nj8/share_301739632/0_public_datasets/instruction_tuning_gemini/face_id_preserve/mb1024.json
    face_id_preserve_multireso: True
    face_id_preserve_ceph_base: '{"/apdcephfs_nj8/share_301739632": "gy2"}'
    face_id_preserve_index_strategy: uniform
    face_id_preserve_index_probability: null
    face_id_preserve_face_bbox_col: bbox@_face_analysis_buffalo_l
    face_id_preserve_face_embed_col: embedding@_face_analysis_buffalo_l

  dataloader_params:
    num_workers: 4
    pin_memory: True
    prefetch_factor: 8
