training_config:
  trainer_name: multimodal_gemini_beta_cfgdistill_puretorchparallel_trainer.MultiModalGeminiBetaCFGDistillPureTorchParallelTrainer
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  global_batch_size: null
  global_seed: 999999
  zero_stage: 2
  log_every: 1
  tensorboard: True
  gradient_checkpoint: True
  gradient_checkpoint_layers: -1
  use_compile: False
  benchmark: False
  kv_cache: True

  overlap_comm: True
  reduce_bucket_size: 5e7

  max_training_steps: 1_000_000
  ckpt_every: 200

  init_save: True
  final_save: True

  resume: null
  save_last_batch_text: False
  resume_puretorch: False
  resume_dataloader: False
  no_load_optim_states: False
  no_load_ema: False
  default_rank0_ss: False
  fix_lr_scheduler: False
  skip_nan_grad: False #True

  validation_at_steps: []
  validation_every: -1
  validation_metrics: []
  validation_metrics_save_image: False

  # cfg distill-related
  guidance_scale_min: 3.5
  guidance_scale_max: 3.5

sampling_config:
  ckpt: null
  load_key: module
  metric_image_size: 1024
  metric_batch_size: 8
  evaluation_metrics: [fid@coco30k, clip_score@coco30k, hpsv2@coco30k, t2i_compbench]
  rerank: 1
  sample_image_size: 1024
  sample_batch_size: 8
  seed_type: auto
  seed: 123456
  guidance_scale: 3.5
  cfg_distilled: True
  meanflow: True
  diff_infer_steps: 50
  sample_flow_shift: 3.0
  sample_use_flux_shift: False
  do_sample: True

  logits_processors_cfg:
    - TemperatureLogitsWarper:
        temperature: 0.6
    - TopKLogitsWarper:
        top_k: 1024
    - TopPLogitsWarper:
        top_p: 0.95

model_config:
  model_name: hunyuan-moe-7b-a13b-vocab-expanded-cfgdistilled
  # model_name: hunyuan-moe-7b-a13b-vocab-expanded
  teacher_model_name: hunyuan-moe-7b-a13b-vocab-expanded
  model_structure: MultiModalTransfusion
  tokenizer_name: hunyuan-dense-7b-tokenizer-refactor
  load_prepend_key: 'language_model.'    # Enable to load from pretrained ckpt of Transfusion structure
  # pretrained_ckpt: /apdcephfs_zwfy/share_303937731/leonxxli/model_outputs/gemini/pretraiend_model/triplet_from_lucaz_1125
  # pretrained_ckpt: /apdcephfs_zwfy/share_303937731/leonxxli/projects/hunyuan_multimoda_gen_ar_ti2i/outputs/triplet_t2i_lucaz_1125/cfgdistill/log_EXP/0001_hunyuan_moe_7b_a13b_vocab_expanded_cfgdistilled_20251125_190017_n8_hunyuan7b_moe_gemini_beta_puretorch_t2i_cfgdistill/checkpoints/0006800/weights
  # pretrained_ckpt: /apdcephfs_zwfy/share_303937731/leonxxli/projects/hunyuan_multimoda_gen_ar_ti2i/outputs/triplet_t2i_lucaz_1125/cfgdistill/log_EXP/0003_hunyuan_moe_7b_a13b_vocab_expanded_cfgdistilled_20251127_145925_n8_hunyuan7b_moe_gemini_beta_puretorch_t2i_cfgdistill/checkpoints/0002000/weights
  pretrained_ckpt: /apdcephfs_zwfy/share_303937731/leonxxli/projects/hunyuan_multimoda_gen_ar_ti2i/outputs/triplet_t2i_lucaz_1125/cfgdistill/log_EXP/0004_hunyuan_moe_7b_a13b_vocab_expanded_cfgdistilled_20251201_002906_n8_hunyuan7b_moe_gemini_beta_puretorch_t2i_cfgdistill/checkpoints/0002000/weights
  pretrained_teacher_model_ckpt: /apdcephfs_zwfy/share_303937731/leonxxli/model_outputs/gemini/pretraiend_model/triplet_from_lucaz_1125
  precision: bf16
  autocast_dtype: bf16
  media_vocab_size: 0

  denoise_type: flow
  flow_path_type: linear
  flow_predict_type: velocity
  flow_loss_weight: null
  flow_train_eps: null
  flow_sample_eps: null
  flow_snr_type: lognorm
  flow_reverse: True
  flow_shift: 3.0
  sample_flow_shift: 3.0
  use_flux_shift: False
  flux_base_shift: null
  flux_max_shift: null

  model_kwargs:
    block_size: 22752
    rope_type: 2d   # updated
    vision_encoder_max_num_patches: 1024  # add
    vision_model:
      vision_model_type: siglip2-so400m-patch16-naflex  # updated
      vision_model_precision: fp32
      vision_model_autocast_dtype: fp32
      vision_model_freeze: False
    vision_aligner:
      vision_aligner_type: mlp_gelu
      vision_aligner_precision: fp32
      vision_aligner_autocast_dtype: fp32
      vision_aligner_freeze: False
      vision_aligner_params:
        vision_aligner_depth: 2
        vision_aligner_input_dim: 1152   # Align to vision_model_type's hidden_dim, updated
        vision_aligner_n_embed: 4096     # Align to model_name's n_embd

  image_loss_weight: 5.0

  img_proj_type: unet
  patch_embed_hidden_dim: 1024
  patch_size: 1
  unet_out_norm: True
  image_preln: True
  use_final_time_embed: True

extra_model_config:
  vae_type: 16x16x4-32c-hy-image
  vae_precision: fp32
  vae_autocast_dtype: fp16
  vae_latent_dim: 32

optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.000005
    betas: [0.9, 0.95]
    eps: 0.000001
    weight_decay: 0.01

lr_scheduler_config:
  lr_schedule: WarmupCosineLR
  lr_scheduler_params:
    warmup_num_steps: 100
    cos_min_ratio: 1.0
    total_num_steps: 1_000_000

dataloader_config:
  # Common
  get_image_retry: 0
  shuffle_by: dataset
  fast_shuffle: True
  use_numpy_indices: True  # updated, for loading large-scale dataset
  extra_resolutions: [[1024, 768], [1280, 720], [768, 1024], [720, 1280]]  # height, widt
  add_iw_ih_token: False
  add_timestep_token: True
  add_guidance_token: True
  add_timestep_r_token: True
  add_image_shape_token: True
  use_front_boi_token: True
  use_front_src_image: True
  use_joint_image_feature: True
  sequence_template: instruct
  combined_iterator_sampling_mode: fixed
  # cos_base:
  #   - "/cos_nj1/share_302243067 -> /apdcephfs_wza/milesjyang/{bucket}"
  #   - "/cos_zw1/share_303793872 -> /apdcephfs_wza/milesjyang/{bucket}"
  #   - "/apdcephfs_zwfy/share_303937731 -> /apdcephfs_wza/share_303937731"
  # cos_file_is_encrypted: True
  enable_resample: True
  sampling_probs: '{"t2i_0": 0.25, "t2i": 0.25, "t2i_ocr": 0.5}'

  # Text-to-Image
  t2i_0_batch_size: 1
  t2i_0_task_kwargs:
    t2i_0_training_image_size: 1024 # only used when multireso is False
    t2i_0_image_token_length: 4096
    t2i_0_text_token_length: 768
    t2i_0_system_prompt_token_length: 1280
    t2i_0_system_prompt_candidates_type: mix_up@1.0
    t2i_0_use_unified_system_prompt: True
    t2i_0_ignore_text_ntp: True
    t2i_0_attn_type: flex
    t2i_0_uncond_p: 0.1
    t2i_0_try_first_use_source_text: False    # Must be False
    t2i_0_image_caption_rate: 1.0   # 使用 caption 的比例
