training_config:
  trainer_name: multimodal_gemini_beta_trainer.MultiModalGeminiBetaTrainer
  micro_batch_size: 4
  gradient_accumulation_steps: 1
  global_batch_size: null
  global_seed: 666
  zero_stage: 2
  log_every: 1
  tensorboard: True
  gradient_checkpoint: False
  gradient_checkpoint_layers: -1
  use_compile: False
  launcher: torch

  overlap_comm: True
  reduce_bucket_size: 5e7

  max_training_steps: 1_000_000
  ckpt_every: 50

  init_save: False
  final_save: True

  resume: null
  resume_dataloader: False
  no_load_optim_states: False
  no_load_ema: False
  default_rank0_ss: False
  fix_lr_scheduler: False

  validation_at_steps: []
  validation_every: -1
  validation_metrics: []
  validation_metrics_save_image: False

sampling_config:
  ckpt: null
  load_key: module
  metric_image_size: 1024
  metric_batch_size: 8
  evaluation_metrics: [fid@coco30k, clip_score@coco30k, hpsv2@coco30k, t2i_compbench]
  rerank: 1
  sample_image_size: 1024
  sample_batch_size: 8
  seed_type: auto
  seed: 123456
  guidance_scale: 6.0
  diff_infer_steps: 100
  sample_flow_shift: 3.0
  sample_use_flux_shift: False
  do_sample: True

  logits_processors_cfg:
    - TemperatureLogitsWarper:
        temperature: 0.6
    - TopKLogitsWarper:
        top_k: 1024
    - TopPLogitsWarper:
        top_p: 0.95

model_config:
  model_name: hunyuan-moe-7b-a13b-vocab-expanded
  model_structure: MultiModalTransfusion
  tokenizer_name: hunyuan-dense-7b-tokenizer-refactor
  load_prepend_key: 'language_model.'    # Enable to load from pretrained ckpt of Transfusion structure
  pretrained_ckpt: hunyuan-moe-7b-a13b-vocab-expanded
  precision: bf16
  autocast_dtype: bf16
  media_vocab_size: 0

  denoise_type: flow
  flow_path_type: linear
  flow_predict_type: velocity
  flow_loss_weight: null
  flow_train_eps: null
  flow_sample_eps: null
  flow_snr_type: lognorm
  flow_reverse: True
  flow_shift: 3.0
  use_flux_shift: False
  flux_base_shift: null
  flux_max_shift: null

  model_kwargs:
    block_size: 15000
    rope_type: 2d   # updated
    vision_encoder_max_num_patches: 1024  # add
    vision_model:
      vision_model_type: siglip2-so400m-patch16-naflex  # updated
      vision_model_precision: fp32
      vision_model_autocast_dtype: fp32
      vision_model_freeze: False
    vision_aligner:
      vision_aligner_type: mlp_gelu
      vision_aligner_precision: fp32
      vision_aligner_autocast_dtype: fp32
      vision_aligner_freeze: False
      vision_aligner_params:
        vision_aligner_depth: 2
        vision_aligner_input_dim: 1152   # Align to vision_model_type's hidden_dim, updated
        vision_aligner_n_embed: 4096     # Align to model_name's n_embd

  image_loss_weight: 5.0

  img_proj_type: unet
  patch_embed_hidden_dim: 1024
  patch_size: 1
  unet_out_norm: True
  image_preln: True
  use_final_time_embed: True

extra_model_config:
  vae_type: 16x16x4-32c-hy-image
  vae_precision: fp32
  vae_autocast_dtype: fp16
  vae_latent_dim: 32

optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.00001
    betas: [0.9, 0.95]
    eps: 0.000001
    weight_decay: 0.01

lr_scheduler_config:
  lr_schedule: WarmupCosineLR
  lr_scheduler_params:
    warmup_num_steps: 500
    cos_min_ratio: 1.0
    total_num_steps: 1_000_000

dataloader_config:
  # Common
  get_image_retry: 0
  shuffle_by: dataset
  fast_shuffle: True
  use_numpy_indices: True  # updated, for loading large-scale dataset
  add_iw_ih_token: False
  add_timestep_token: True
  add_image_shape_token: True
  use_front_boi_token: True
  use_front_src_image: True
  use_joint_image_feature: True
  sequence_template: instruct
  combined_iterator_sampling_mode: fixed
  cos_base: "/cos_nj1/share_302243067 -> /cos_zw1/share_303793872"
  enable_resample: True
  # training_image_size: 1024
  # sampling_probs: '{"t2i": 0.50, "mmu": 0.20, "lm": 0.30}'
  sampling_probs: '{"lm_2": 0.25, "mmu": 0.1, "mmu_caption": 0.1, "t2i_tuning": 0.05, "pair_person": 0.2, "pair_inpainting": 0.05, "pair_controlnet":0.05, "pair_tuning": 0.2}'
  # sampling_probs: '{"pair_tuning": 1.0, "pair_controlnet":0.10}'


  # Text-to-Image OCR, we only use long or long_long caption for OCR dataset
  t2i_tuning_batch_size: 2
  t2i_tuning_task_kwargs:
    t2i_tuning_training_image_size: 1024 # only used when multireso is False
    t2i_tuning_image_token_length: 4096
    t2i_tuning_text_token_length: 768
    t2i_tuning_ignore_text_ntp: True
    t2i_tuning_attn_type: flex
    t2i_tuning_shuffle_seed: 10666
    t2i_tuning_uncond_p: 0.1
    t2i_tuning_try_first_use_source_text: False    # Must be False
    t2i_tuning_image_caption_rate: 1.0   # 使用 caption 的比例
    t2i_tuning_image_caption_col_probs:
      - caption_v3_2_ip:
          caption_v3_2_ip_src: '{"image_caption_v3_2_ip_en_col": 0.5, "image_caption_v3_2_ip_zh_col": 0.5}'
          caption_v3_2_ip_caption_processor: caption_process_v3
          caption_v3_2_ip_caption_sample_ratio: '{"long_long_caption":0.3,"long_caption":0.35,"medium_caption":0.25,"short_caption":0.1,"background":0.1,"style":0.7,"shot_type":0.1}'
          caption_v3_2_ip_extra_processor: [ 'filter_shot', 'inject_style_v2' ]
      - caption_v3_2_ocr:
          caption_v3_2_ocr_src: '{"image_caption_v3_2_ocr_en_col": 0.5, "image_caption_v3_2_ocr_zh_col": 0.5}'
          caption_v3_2_ocr_caption_processor: caption_process_v3
          caption_v3_2_ocr_caption_sample_ratio: '{"long_long_caption":0.99,"long_caption":0.01,"background":0.1,"style":0.7,"shot_type":0.1,"IP":0.5}'
          caption_v3_2_ocr_extra_processor: [ 'filter_shot', 'inject_style_v2' ]
      - caption_v3_2:
          caption_v3_2_src: '{"image_caption_v3_2_en_col": 0.5, "image_caption_v3_2_zh_col": 0.5}'
          caption_v3_2_caption_processor: caption_process_v3
          caption_v3_2_caption_sample_ratio: '{"long_long_caption":0.3,"long_caption":0.35,"medium_caption":0.25,"short_caption":0.1,"background":0.1,"style":0.7,"shot_type":0.1,"IP":0.5}'
          caption_v3_2_extra_processor: [ 'filter_shot', 'inject_style_v2' ]
      - caption_v3_1:
          caption_v3_1_src: '{"image_caption_v3_1_en_col": 0.5, "image_caption_v3_1_zh_col": 0.5}'
          caption_v3_1_caption_processor: caption_process_v3
          caption_v3_1_caption_sample_ratio: '{"long_long_caption":0.3,"long_caption":0.35,"medium_caption":0.25,"short_caption":0.1,"background":0.1,"style":0.7,"shot_type":0.1,"IP":0.5}'
          caption_v3_1_extra_processor: [ 'filter_shot', 'inject_style_v2' ]
      - caption_v3:
          caption_v3_src: '{"image_caption_v3_en_col": 0.5, "image_caption_v3_zh_col": 0.5}'
          caption_v3_caption_processor: caption_process_v3
          caption_v3_caption_sample_ratio: '{"long_long_caption":0.3,"long_caption":0.35,"medium_caption":0.25,"short_caption":0.1,"background":0.1,"style":0.7,"shot_type":0.1,"IP":0.5}'
          caption_v3_extra_processor: [ 'fix_style', 'filter_shot', 'inject_style_v2' ]
  t2i_tuning_index_kwargs:
    t2i_tuning_index_file: # 95,115+ 9,343,246+93,325+1,269,056=
      # - /apdcephfs_zwfy/share_303937731/1_public_models/hymm_ar_assets/dataset/t2i_index/gemini_json/mb1024_cap_v3/mb1024_zw_ocr.json  # 0.12B
