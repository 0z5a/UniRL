TRAINING_ARGS:
  micro-batch-size: 1
  gradient-accumulation-steps: 8
  global-batch-size: ${mul:${div:${mul:${oc.env:HOST_GPU_NUM}, ${oc.env:HOST_NUM}}, ${mul:${mul:${MODEL_PARALLEL_ARGS.tensor-model-parallel-size}, ${MODEL_PARALLEL_ARGS.pipeline-model-parallel-size}}, ${MODEL_PARALLEL_ARGS.context-parallel-size}}}, ${mul:${TRAINING_ARGS.gradient-accumulation-steps}, ${TRAINING_ARGS.micro-batch-size}}} # GLOBAL_BATCH_SIZE = HOST_GPU_NUM * HOST_NUM / (TP_SIZE*PP_SIZE*CP_SIZE) * GRADIENT_ACCUMULATION_STEPS * MICRO_BATCH_SIZE
  lr: 1e-4
  train-iters: 100_000_000
  lr-decay-iters: 100_000_000
  lr-decay-style: cosine
  optimizer: muon
  muon-ema-gradient: True
  muon-momentum: 0.95
  adam-beta1: 0.9
  adam-beta2: 0.999
  min-lr: 1e-4
  weight-decay: 0.01
  lr-warmup-iters: 0
  clip-grad: 1.0
  eval-interval: 1000
  eval-iters: 0
  seed: 42
    # - optimizer-cpu-offload
    # - use-precision-aware-optimizer
  __FROZEN__OPTIMIZER_ARGS:  # pure torch specific
    optimizer_params:
      lr: ${TRAINING_ARGS.lr}
      betas:
      - ${TRAINING_ARGS.adam-beta1}
      - ${TRAINING_ARGS.adam-beta2}
      weight_decay: ${TRAINING_ARGS.weight-decay}
      momentum: ${TRAINING_ARGS.muon-momentum}
      adamw_eps: 0.00000001
    special_adamw_params: ["*embed_tokens*", "*lm_head*", "*final_layer*", "*time_embed*", "*timestep_emb*", "*patch_embed*", "*embedding*"]
  __FROZEN__LR_SCHEDULER_ARGS:  # pure torch specific
    lr_scheduler_params:
      num_warmup_steps: ${TRAINING_ARGS.lr-warmup-iters}
      num_training_steps: ${TRAINING_ARGS.train-iters}
      min_lr: ${TRAINING_ARGS.min-lr}

  image-loss-weight: 1.0
#  audio-loss-weight: 1.0
  moe-aux-loss-coeff: 0.001
  enabled:
    - moe-aux-loss
    - use-global-diffusion-loss-average
    - accumulate-allreduce-grads-in-fp32   # default True when args.bf16 enable, just align with gemini
    - override-opt_param-scheduler
    - use-dynamic-global-batch-size-convert-iters-to-samples

PERFORMANCE_ARGS:
  manual-gc-interval: 1000
  recompute-granularity: full
  recompute-method: uniform
  recompute-num-layers: 1
  ddp-bucket-size: 240000000
  enabled:
    - manual-gc
    # - use-flash-attn
    - enable-experimental
    - moe-enable-deepep
    - moe-permute-fusion
    # - moe-router-fusion
    - deepep-moe-shared-expert-overlap
    - overlap-grad-reduce
    - overlap-param-gather
    - disable-gloo-process-groups
    - enable-modulate-gate-fusion
    - muon-overlap-momentum-gather
    - muon-use-batch-p2p-gather
    - no-gradient-accumulation-fusion
    - no-bias-swiglu-fusion
    - use-index-add-local-unpermute
    - no-align-grad-reduce
    - disable-fill-uninitialized-memory


MODEL_PARALLEL_ARGS:
  tensor-model-parallel-size: 1
  pipeline-model-parallel-size: 4
  pipeline-model-parallel-layout: Et*0|t*16|t*16|t*16L
  expert-model-parallel-size: 8
  context-parallel-size: 1
  distributed-timeout-minutes: 30  # 增加分布式超时时间，解决进程组初始化超时问题（默认10分钟）
  enabled:
    - use-distributed-optimizer
    # - tp-comm-overlap
    # - sequence-parallel


CHECKPOINT_ARGS:
  ckpt-format: torch_dist
  dist-ckpt-strictness: log_all
  save-interval: 500
  save: ${__GLOBAL_VARS__.OUTPUT_PATH}/ckpt
  load: /apdcephfs_nj10/share_301739632/youngfyang/workspace/output/0513_output/converted_ptm/
  ckpt-step: 10250
  enabled:
    - resume
    - use-dist-ckpt
    - no-load-optim
    - no-load-rng
    # - finetune
    # - ckpt-fully-parallel-load # comment this to avoid all_gather in load
    - ckpt-fully-parallel-save
    - ckpt-assume-constant-structure


LOGGING_ARGS:
  log-interval: 1
  leo-timing-log-level: 0
  tensorboard-dir: ${__GLOBAL_VARS__.OUTPUT_PATH}/events
  saved-training-batch-dir: ${__GLOBAL_VARS__.OUTPUT_PATH}/saved_training_data
  save-n-training-data: 16
  enabled:
    - log-timers-to-tensorboard
    - log-memory-to-tensorboard
    - log-num-zeros-in-grad
    - log-params-norm
    - log-validation-ppl-to-tensorboard
    - log-throughput
