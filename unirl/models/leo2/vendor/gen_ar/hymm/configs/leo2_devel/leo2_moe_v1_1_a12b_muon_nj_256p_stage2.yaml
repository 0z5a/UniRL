__GLOBAL_VARS__:
  _DEFAULT_OUTPUT_PATH: ""
  DATA_PATH: "/root/dummy_data"
  OUTPUT_PATH: ${oc.env:OUTPUT_PATH,${__GLOBAL_VARS__._DEFAULT_OUTPUT_PATH}}

MODEL_ARGS:
  model-name: diffusion.leo-2-moe-v1-1-pack-noTR
  model-structure: LeoModel
  text-branch-model-name: diffusion.leo-2-moe-v1-1-pack-txt-branch
  audio-branch-model-name: diffusion.leo-2-moe-v1-1-pack-audio-branch

  init-device: meta  # [cpu, cuda, meta] pure torch specific
  autocast-dtype: bf16  # pure torch specific
  enabled:
    - bf16
    - main-params-fp32
#    - fsdp-cast-forward-inputs
  noise-dtype: fp32

  patch-size: 1
  seq-length: 18170 # 10s -> 61*12*21 + 2048 (text) + 750 (audio) = 18170
  attn-impl: flash_packed
  rope-type-extended: 3d
  rope-audio-rescale-factor: 0.24
  moe-impl: ep_moe
  img-latent-in-channels: 97  # 2 * 48 + 1
  cond-image-type: vae
  cond-token-attn-type: full
  cond-video-type: none
  cond-video-token-attn-type: none


EXTRA_MODEL_ARGS:
  enabled:
    - use-vae
    - use-audio-vae
    - use-text-encoder
#    - use-repa

  vae-type: 16x16x4-48c-hy-v3
  vae-latent-dim: 48
  vae-precision: fp32
  vae-autocast-dtype: fp16
  vae-encode-type: mode

  audio-vae-type: dual_channel_48k
  audio-vae-latent-dim: 96
  __FROZEN__AUDIO_BRANCH_ARGS:
    audio_branch_audio_vae_latent_dim: ${EXTRA_MODEL_ARGS.audio-vae-latent-dim}

  text-encoder-type: qwen-3.5-9b
  __FROZEN__TEXT_ENCODER_ARGS:
    text_encoder_text_len: 1024
    text_encoder_precision: bf16
    text_encoder_hidden_state_skip_layer: 2
    text_encoder_uncond_token: "<|cfg|>"
    text_encoder_use_fsdp: True
    text_encoder_use_pack: True

#  repa-encoder-type: qwen-3.5-9b
#  repa-encoder-precision: bf16
#  repa-loss-weight: 0.05


DENOISE_ARGS:
  denoise-type: flow
  flow-path-type: linear
  flow-predict-type: velocity
  flow-snr-type: lognorm
  flow-reverse: True
  flow-shift: 1.0
  flow-shift-video: 3.0
  flow-shift-audio: 1.0


DATA_ARGS:
  tokenizer-type: NullTokenizer
  dataloader-type: external
  tokenizer-name: qwen-3.5-9b
  tokenizer-class: tokenization_qwen_multimodal.Qwen3TokenizerFast
  conv-template: qwen-vl-v2-li-dit
  sequence-template: pretrain
  uncond-length: equal

  # extra args provider
  shuffle-by: dataset
  combined-iterator-sampling-mode: fixed
  cos-base:
    - "/apdcephfs_wza2/share_304227829/hunyuan_data/{stem2}/ -> /cos_nj1/share_302243067/"
  video-cos-base: "/cos_nj1/share_302243067"
  audio-cos-base: ${DATA_ARGS.video-cos-base}
  enabled:
    - enable-resample
    - drop-resampled-samples
    - fast-shuffle
    - first-epoch-no-shuffle
    - use-numpy-indices
    - extend-latent-channels
#    - independent-seq-length
    - use-input-ids

  # vae
  vae-image-token-length: 256
  vae-video-token-length: 7936
  vae-audio-token-length: 1000
  # -- resolution group kwargs
  reso-base-size: 256
  reso-align: 16
  reso-preset: zigzag
  duration-range: [49, 241]
  duration-step: 4
  additional-durations: [1]   # for image, not used

  modality: [ vae_image, vae_video, vae_audio ]
  gen-template: multi_stream_dit
  sampling-probs: '{"t2i": 0.0647, "t2i_ocr": 0.0245, "t2i_ip": 0.0008, "t2va_single": 0.44, "t2va_multi": 0.22, "i2va_single": 0.05, "i2va_multi": 0.025, "fl2va_single": 0.05, "fl2va_multi": 0.025, "t2a": 0.1}'

  # Dataloader
  num-workers: 8
  prefetch-factor: 8


