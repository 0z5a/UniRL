# IMPORTANT NOTE: Write PTM args in YAML format:
# 0. all arguments specified here are one-one correspondences with PTM arguments; un-specified arguments use PTM default values.
# 1. arguments like '--hidden-size=2560' are written as 'hidden-size: 2560' (see below, note the space after colon).
# 2. YAML format is like a tree, and only the leaf nodes are considered as arguments.
#    Non-leaf nodes and structures are ignored, so arguments can be grouped as you like.
# 3. arguments like '--sequence-parallel' can be written as 'enabled: \n  - sequence-parallel' (see below, note the indent).
#    multiple `enabled` arguments in a same sub-tree must be put in a `enabled` list (see below for an example).

__GLOBAL_VARS__:
  _DEFAULT_OUTPUT_PATH: ""
  DATA_PATH: "/root/dummy_data"
  OUTPUT_PATH: ${oc.env:OUTPUT_PATH,${__GLOBAL_VARS__._DEFAULT_OUTPUT_PATH}}

MODEL_ARGS:
  model-name: diffusion.leo-2-dense-8b-v2
  model-structure: LeoModel
  text-branch-model-name: diffusion.leo-2-dense-8b-v2
  audio-branch-model-name: diffusion.leo-2-dense-8b-v2

  # The following args are ineffective, only used to pass the argument check in mcore
  num-layers: 24 # must be the same as double_layer or single_layer to pass the check
  # The following args will not be used, only used to pass the check
  vocab-size: 60000
  hidden-size: 3072
  num-attention-heads: 24
  max-position-embeddings: 327600
  seq-length: 4096
  attention-dropout: 0.0
  hidden-dropout: 0.0
  init-method-std: 0.012757759
  data-path: ${__GLOBAL_VARS__.DATA_PATH}
  split: 100,0,0

  init-device: meta  # [cpu, cuda, meta] pure torch specific
  autocast-dtype: bf16  # pure torch specific
  enabled:
    - sft # don't change the args
    - qk-layernorm # don't change the args, otherwise it will affect TP backwards
    - swiglu
    - bf16
    - dist-ckpt-save-pre-mcore-014  # 沿用旧逻辑，不拆分weights_w和weights_v
    - disable-bias-linear
    #- moe-grouped-gemm

  noise-dtype: fp32

  patch-size: 1
  attn-impl: flash3_packed
  rope-type-extended: 3d
  img-latent-in-channels: 97  # 2 * 48 + 1
  cond-image-type: vae
  cond-token-attn-type: full
  cond-video-type: none
  cond-video-token-attn-type: none


EXTRA_MODEL_ARGS:
  enabled:
    - use-vae
    - use-audio-vae
    - use-text-encoder

  vae-type: 16x16x4-48c-hy-v3
  vae-latent-dim: 48
  vae-precision: fp32
  vae-autocast-dtype: fp16
  vae-encode-type: mode

  audio-vae-type: waveflow-v1_0
  audio-vae-latent-dim: 64

  text-encoder-type: qwen-3-vl-8b-instruct
  __FROZEN__TEXT_ENCODER_ARGS:
    text_encoder_prompt_template: li-dit-encode-image-qwen-vl-v2
    text_encoder_prompt_template_video: li-dit-encode-video-qwen-vl-v2
    text_encoder_text_len: 1024
    text_encoder_precision: bf16
    text_encoder_hidden_state_skip_layer: 2
    text_encoder_uncond_token: "<|im_end|>"


DENOISE_ARGS:
  denoise-type: flow
  flow-path-type: linear
  flow-predict-type: velocity
  flow-snr-type: lognorm
  flow-reverse: True
  flow-shift: 1.0
  flow-shift-video: 1.0
  flow-shift-audio: 1.0


DATA_ARGS:
  tokenizer-type: NullTokenizer
  dataloader-type: external
  tokenizer-name: qwen-3-vl-8b-instruct
  tokenizer-class: tokenization_qwen_multimodal.Qwen3TokenizerFast
  conv-template: qwen-vl-v2-li-dit
  sequence-template: pretrain
  uncond-length: equal

  # extra args provider
  shuffle-by: dataset
  combined-iterator-sampling-mode: fixed
  video-cos-base: "/cos_nj1/share_302243067"
  audio-cos-base: ${DATA_ARGS.video-cos-base}
  enabled:
    - enable-resample
    - drop-resampled-samples
    - fast-shuffle
    - use-numpy-indices
    - extend-latent-channels
    - independent-seq-length

  # vae
  vae-image-token-length: 256
  vae-video-token-length: 7936
  vae-audio-token-length: 1000
  # -- resolution group kwargs
  reso-base-size: 256
  reso-align: 16
  reso-preset: zigzag
  duration-range: [33, 361]
  duration-step: 4
  additional-durations: [1]   # for image, not used

  modality: [ vae_image, vae_video, vae_audio ]
  gen-template: multi_stream_dit
  sampling-probs: '{"t2i": 0.2, "t2va": 0.2, "t2v": 0.2, "i2v": 0.2, "fl2v": 0.2}'
  # sampling-probs: '{"t2va": 1.0}'

  # Dataloader
  num-workers: 4
  prefetch-factor: 2


__FROZEN__DATA_ARGS:
  t2i_task_kwargs:
    # required
    cls: av_loader.MultimodalAVIndexDataset
    batch_size: 1
    modality: [ vae_image ]
    max_token_length: 2048
    attn_type: ${MODEL_ARGS.attn-impl}
    shuffle_seed: 1111
    no_shuffle: True
    random_crop: False
    sequence_pack: True
    # dit specific
    extra_num_tokens: 0
    latent_channel_extend_type: t2i  # one of {t2i, t2a, t2v, i2v, fl2v}
    crop_start: 74
    # sp
    system_prompt_type: li-dit-encode-image-qwen-vl-v2
    system_prompt_token_length: 74
    # image caption
    uncond_p: 0.1
    prompt_token_length: 256
    image_caption_resource:
      - caption_v4:
          caption_v4_src: '{"caption_v4_en_col": 0.5, "caption_v4_zh_col": 0.5}'
          caption_v4_caption_processor: caption_process_v4
          caption_v4_caption_sample_ratio: '{"long_caption":0.4,"medium_caption":0.3,"short_caption":0.3,"style":0.7,"shot_type":0.1,"IP":0.2}'
  t2i_index_kwargs:
    index_file:
#      - /apdcephfs_nj10/share_301739632/0_public_datasets/leo_2.0/image/pretrain_256p_json/pretrain/base_no_compress.json
      - /apdcephfs_nj10/share_301739632/0_public_datasets/leo_2.0/image/pretrain_256p_json/pretrain/demo_base.json
    online_bucketing: True
    reso_bucket_kwargs:
      base_size: ${DATA_ARGS.reso-base-size}
      align: ${DATA_ARGS.reso-align}
      preset: ${DATA_ARGS.reso-preset}
    verbose: 1
    index_columns:
      image_col: cache_image
      caption_v4_en_col: caption_v4_en
      caption_v4_zh_col: caption_v4_zh

  t2va_task_kwargs:
    # required
    cls: av_loader.MultimodalAVIndexDataset
    batch_size: 1
    modality: [ vae_video, vae_audio ]
    max_token_length: 32768
    attn_type: ${MODEL_ARGS.attn-impl}
    shuffle_seed: 1111
    sequence_pack: True
    # dit specific
    extra_num_tokens: 0
    latent_channel_extend_type: t2v  # one of {t2i, t2a, t2v, i2v, fl2v}
    crop_start: 108
    # sp
    system_prompt_type: li-dit-encode-video-qwen-vl-v2
    system_prompt_token_length: 108
    # video caption
    uncond_p: 0.1
    prompt_token_length: 1024   # video + audio caption length
    patcher_names: [ "fps" ]
    video_caption_resource:
      - caption_v4:
          caption_v4_src: '{"caption_v3_en_col": 0.5, "caption_v3_zh_col": 0.5}'
          caption_v4_caption_processor: video_caption_process_v4
          caption_v4_caption_sample_ratio: '{"long_caption":0.5,"medium_caption":0.4,"short_caption":0.1,"background":0.2,"shot_type":0.2,"shot_angle":0.2,"composition":0.2,"light":0.2,"style":0.7,"atmosphere":0.2,"camera_movement":0.5}'
          caption_v4_extra_processor: [ 'inject_camera' ]
    audio_separated_caption: True
    audio_caption_resource:
      - leo2_legacy:
          leo2_legacy_src: '{"audio_caption_en_col": 1.0}'
          leo2_legacy_caption_processor: simple_caption_process
          leo2_legacy_data_format: 'plain'
  t2va_index_kwargs:
    index_file:
      - /apdcephfs_nj10/share_301739632/0_public_datasets/leo_2.0/index_video/leo2_8b_av_256p_241f_1kw_filter_devel.json
    ceph_base_inv: '{"prefix": "/apdcephfs_jn3/share_300000488"}'
    online_bucketing: True
    dar_bucket_kwargs:
      base_size: ${DATA_ARGS.reso-base-size}
      align: ${DATA_ARGS.reso-align}
      preset: ${DATA_ARGS.reso-preset}
      duration_range: ${DATA_ARGS.duration-range}
      duration_step: ${DATA_ARGS.duration-step}
      additional_durations: ${DATA_ARGS.additional-durations}
    verbose: 1
    index_columns:
      video_col: latent_cos_path
      video_size_col: latent_shape
      caption_v3_en_col: t2v_caption_en_v2_3_nomask
      caption_v3_zh_col: t2v_caption_cn_v2_3_nomask
      audio_col: audio_cos_dir
      audio_caption_en_col: audio_caption_converted
      camera_movement_col: camera_movement
      camera_movement_special_col: special_camera_movement_classification
      fps_col: latent_input_fps_divide_stride

  t2v_task_kwargs:
    # required
    cls: av_loader.MultimodalAVIndexDataset
    batch_size: 1
    modality: [ vae_video ]
    max_token_length: 32768
    attn_type: ${MODEL_ARGS.attn-impl}
    shuffle_seed: 1111
    sequence_pack: True
    # dit specific
    prompt_first: False   # Put text tokens after image tokens for adapting flash attention.
    remove_unused_images: False
    extra_num_tokens: 0
    latent_channel_extend_type: t2v  # one of {t2i, t2a, t2v, i2v, fl2v}
    crop_start: 108
    # sp
    system_prompt_type: li-dit-encode-video-qwen-vl-v2
    system_prompt_token_length: 108
    # video caption
    uncond_p: 0.1
    prompt_token_length: 896
    patcher_names: [ "fps" ]
    video_caption_resource:
      - caption_v4:
          caption_v4_src: '{"caption_v3_en_col": 0.5, "caption_v3_zh_col": 0.5}'
          caption_v4_caption_processor: video_caption_process_v4
          caption_v4_caption_sample_ratio: '{"long_caption":0.4,"medium_caption":0.4,"short_caption":0.2,"background":0.5,"shot_type":0.5,"shot_angle":0.5,"composition":0.5,"light":0.5,"style":0.7,"atmosphere":0.5,"camera_movement":0.5}'
          caption_v4_extra_processor: [ 'inject_camera' ]
  t2v_index_kwargs:
    index_file:
      - /apdcephfs_nj10/share_301739632/0_public_datasets/leo_2.0/index_video/leo2_8b_video_256p_121f_part2.json
      - /apdcephfs_nj10/share_301739632/0_public_datasets/leo_2.0/index_video/leo2_8b_video_256p_121f_part3.json
    ceph_base_inv: '{"prefix": "/apdcephfs_jn3/share_300000488"}'
    online_bucketing: True
    dar_bucket_kwargs:
      base_size: ${DATA_ARGS.reso-base-size}
      align: ${DATA_ARGS.reso-align}
      preset: ${DATA_ARGS.reso-preset}
      duration_range: ${DATA_ARGS.duration-range}
      duration_step: ${DATA_ARGS.duration-step}
      additional_durations: ${DATA_ARGS.additional-durations}
    verbose: 1
    index_columns:
      video_col: latent_cos_path
      video_size_col: latent_shape
      caption_v3_en_col: t2v_caption_en_v2_3_nomask
      caption_v3_zh_col: t2v_caption_cn_v2_3_nomask
      camera_movement_col: camera_movement
      camera_movement_special_col: special_camera_movement_classification
      fps_col: latent_input_fps_divide_stride

  i2v_task_kwargs:
    # required
    cls: av_loader.MultimodalAVIndexDataset
    batch_size: 1
    modality: [ vae_video ]
    max_token_length: 32768
    attn_type: ${MODEL_ARGS.attn-impl}
    shuffle_seed: 2222
    sequence_pack: True
    # dit specific
    extra_num_tokens: 0
    latent_channel_extend_type: i2v  # one of {t2i, t2a, t2v, i2v, fl2v}
    crop_start: 108
    # sp
    system_prompt_type: li-dit-encode-video-qwen-vl-v2
    system_prompt_token_length: 108
    # video caption
    uncond_p: 0.1
    prompt_token_length: 896
    patcher_names: [ "fps" ]
    video_caption_resource:
      - caption_v4:
          caption_v4_src: '{"caption_v3_en_col": 0.5, "caption_v3_zh_col": 0.5}'
          caption_v4_caption_processor: video_caption_process_v4
          caption_v4_caption_sample_ratio: '{"long_caption":0.4,"medium_caption":0.4,"short_caption":0.2,"background":0.5,"shot_type":0.5,"shot_angle":0.5,"composition":0.5,"light":0.5,"style":0.7,"atmosphere":0.5,"camera_movement":0.5}'
          caption_v4_extra_processor: [ 'inject_camera' ]
  i2v_index_kwargs:
    index_file:
      - /apdcephfs_nj10/share_301739632/0_public_datasets/leo_2.0/index_video/leo2_8b_video_256p_121f_part2.json
      - /apdcephfs_nj10/share_301739632/0_public_datasets/leo_2.0/index_video/leo2_8b_video_256p_121f_part3.json
    ceph_base_inv: '{"prefix": "/apdcephfs_jn3/share_300000488"}'
    online_bucketing: True
    dar_bucket_kwargs:
      base_size: ${DATA_ARGS.reso-base-size}
      align: ${DATA_ARGS.reso-align}
      preset: ${DATA_ARGS.reso-preset}
      duration_range: ${DATA_ARGS.duration-range}
      duration_step: ${DATA_ARGS.duration-step}
      additional_durations: ${DATA_ARGS.additional-durations}
    verbose: 1
    index_columns:
      video_col: latent_cos_path
      video_size_col: latent_shape
      caption_v3_en_col: t2v_caption_en_v2_3_nomask
      caption_v3_zh_col: t2v_caption_cn_v2_3_nomask
      camera_movement_col: camera_movement
      camera_movement_special_col: special_camera_movement_classification
