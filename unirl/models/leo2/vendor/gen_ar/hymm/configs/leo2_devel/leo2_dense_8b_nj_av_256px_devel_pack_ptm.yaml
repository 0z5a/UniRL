  fl2v_task_kwargs:
    # required
    cls: av_loader.MultimodalAVIndexDataset
    batch_size: 1
    modality: [ vae_video ]
    max_token_length: 32768
    attn_type: ${MODEL_ARGS.attn-impl}
    shuffle_seed: 3333
    sequence_pack: True
    # dit specific
    extra_num_tokens: 0
    latent_channel_extend_type: fl2v  # one of {t2i, t2a, t2v, i2v, fl2v}
    crop_start: 108
    # sp
    system_prompt_type: li-dit-encode-video-qwen-vl-v2
    system_prompt_token_length: 108
    # video caption
    uncond_p: 0.1
    prompt_token_length: 896
    patcher_names: [ "fps" ]
    video_caption_resource:
      - caption_v4:
          caption_v4_src: '{"caption_v3_en_col": 0.5, "caption_v3_zh_col": 0.5}'
          caption_v4_caption_processor: video_caption_process_v4
          caption_v4_caption_sample_ratio: '{"long_caption":0.4,"medium_caption":0.4,"short_caption":0.2,"background":0.5,"shot_type":0.5,"shot_angle":0.5,"composition":0.5,"light":0.5,"style":0.7,"atmosphere":0.5,"camera_movement":0.5}'
          caption_v4_extra_processor: [ 'inject_camera' ]
  fl2v_index_kwargs:
    index_file:
      - /apdcephfs_nj10/share_301739632/0_public_datasets/leo_2.0/index_video/leo2_8b_video_256p_121f_part2.json
      - /apdcephfs_nj10/share_301739632/0_public_datasets/leo_2.0/index_video/leo2_8b_video_256p_121f_part3.json
    ceph_base_inv: '{"prefix": "/apdcephfs_jn3/share_300000488"}'
