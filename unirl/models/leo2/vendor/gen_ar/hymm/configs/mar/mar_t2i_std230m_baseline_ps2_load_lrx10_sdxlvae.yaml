training_config:    # resume: gbs=1280 -> gbs=3072
  trainer_name: Text2ImageMARTrainer
  micro_batch_size: 12    # 10 -> 12
  gradient_accumulation_steps: 1
  global_seed: 43       # 42 -> 43
  reproduce: False
  profile: False
  zero_stage: 2

  max_epochs: 8
  max_training_steps: 1_000_000_000
  ckpt_every: 10000    # 5000 -> 10000
  save_n_training_data: 1
  log_every: 10
  final_save: True

  gradient_checkpoint: False
  gradient_checkpoint_layers: -1

  # MLM
#  pretrained_ckpt: /apdcephfs_nj8/share_301739632/jarvizhang/workspace/hymm_ar/log_EXP/0018_phi_2_3drope_20241205_192856_n16_mar_t2i_std230m_baseline_ps2_load_lrx10_sdxlvae/checkpoints/0135000/mp_rank_00_model_states.pt    # phi-2 -> pretrained
  pretrained_ckpt: null
  load_llm_to_mllm: True
  expand_keys: [ "transformer.wte.weight", "lm_head.weight", "lm_head.bias" ]
  loss_predict: text__image_masked
  train_schedule_type: lognorm
  ignore_index: -100

  # Diffusion
  diffloss_weight: 1.0
  diff_batch_factor: 4
#  diffloss_lr: 0.001
#  training_parts: lrx10

validation_config:
  pipeline: mar
  batch_size: 8
  infer_steps: 30
  guidance_scale: 6.0
  schedule_type: shift
  mask_ratio_shift: 4.0
  pipeline_kwargs:
    temperature: 1.0
    guidance_dynamic: const
  validation_every: 10000   # 5000 -> 10000
  validation_at_steps:
    - 200
  validation_metrics: [ "image", "fid@coco30k", "clip_score@coco30k", "hpsv2@coco30k", "t2i_compbench" ]
  csv: std1000

  # Diffusion
  denoise_type: ddpm
  ddpm_noise_schedule: squaredcos_cap_v2
  ddpm_learn_sigma: True
  diff_infer_steps: 100

model_config:
  model_name: phi-2-3drope
  model_precision: bf16
  autocast_dtype: bf16
  media_vocab_size: 0
  model_kwargs:
    model_type: MarGPT
    patch_size: 2
    vae_embed_dim: 4
    diffloss_d: 6

extra_model_config:
  vae_type: 88-vae-sdxl
  vae_precision: bf16

optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.0001
    betas: [0.9, 0.96]
    eps: 0.000001
    weight_decay: 0.01

lr_scheduler_config:
  lr_scheduler_name: WarmupLR # WarmupCosineLR
  lr_scheduler_params:
    warmup_num_steps: 0
    warmup_max_lr: 0.0001
#    warmup_num_steps: 0    # 5000 -> 0
#    total_num_steps: -1
#    cos_min_ratio: 0.01

dataloader_config:
  image_size: 256
  index_file: /apdcephfs_nj10/share_301739632/ckczzjzhang/idk_data/merged_0918_300m_drop_aigc_dedup_remove_civitai_30_source_remove_wrong_size_mb256.json
  multireso: True
  use_pre_extracted_token: False
  image_token_offset: 51200           # equals to model_settings.padded_vocab_size
  text_token_length: 256
  uncond_p: 0.1                       # unconditional probability
  tokenizer_name: phi-2
  fast_shuffle: True
  shuffle_by: dataset
  index_kwargs:
    image_caption_rate: 0.95
    image_text_arrow_suffix: _trans
    image_text_col: trans
    image_caption_arrow_suffix: _caption_v2
    image_caption_col: result
    caption_sample_ratio: '{"long caption": 0.5, "short caption": 0.45, "background": 0.0, "shot type": 0.0, "style": 0.0, "light": 0.0, "atmosphere": 0.0, "camera movement": 0.0}'
  dataloader_params:
    num_workers: 16
    pin_memory: True
    prefetch_factor: 16
