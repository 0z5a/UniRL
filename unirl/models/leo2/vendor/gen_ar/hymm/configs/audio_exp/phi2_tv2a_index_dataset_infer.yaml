training_config:
  trainer_name: VisualText2Audio
  micro_batch_size: 16
  gradient_accumulation_steps: 1
  global_seed: 1
  reproduce: False
  profile: False
  output_dir: /apdcephfs_nj10/share_301739632/milesjyang/exp_dir/VisualText2Audio
  task_flag: audio_test
  zero_stage: 2

  max_epochs: 10
  max_training_steps: 10_000_000
  ckpt_every: 5000
  autocast_dtype: bf16

model_config:
  model_name: phi-2
  pretrained_ckpt: phi-2
  load_llm_to_mllm: True
  expand_keys: ["transformer.wte.weight", "lm_head.weight", "lm_head.bias"]
  model_precision: bf16
  model_type: ContinuousMultiModalGPT
  clip_dim: 768
  clip_start: 2
  t5_dim: 4096
  t5_start: 44
  use_t5: True
  media_vocab_size: 4096

extra_model_config:
  vae_type: dac-24khz
  vae_precision: fp32

# for audio infer
dac_ckpt: /apdcephfs_cq8/share_1367250/milesjyang/workspace/main_dev/dac_lite/models/5kh_4096_600kiter.pth

# t5 and clip
t5_path: /apdcephfs_gy2/share_302507476/1_public_models/flan-ul2-text-encoder/
clip_path: /apdcephfs_gy2/share_302507476/1_public_models/clip-vit-large-patch14/

sampling_config:
  # parquet: /apdcephfs_jn/share_302243067/0_public_datasets/V2A/audioset/val_dataset/val_dataset_simplified_filter_video_musiccap_smd_structure.parquet
  # eval_data_root: /apdcephfs_jn/share_302243067/0_public_datasets/V2A/audioset/val_dataset/
  # csv: null
  csv: /apdcephfs_cq8/share_1367250/milesjyang/dataset/audio_test/test.csv
  eval_data_root: /apdcephfs_cq8/share_1367250/milesjyang/dataset/audio_test/

  interactive: False
  slice_manualy: False

  logits_processors_cfg:
  - SliceVocabLogitsWarper:
      vocab_start: 51200
      vocab_end: 55296
  - CfgLogitsWarper:
      guidance_scale: 6.0
  - TopKLogitsWarper:
      top_k: 1024
  - TopPLogitsWarper:
      top_p: 0.9

optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.0001
    betas: [0.9, 0.95]
    eps: 0.000001
    weight_decay: 0.01
  
lr_scheduler_config:
  lr_scheduler_name: WarmupCosineLR
  lr_scheduler_params:
    warmup_num_steps: 5000
    total_num_steps: 100000

dataloader_config:
  index_file: /apdcephfs_nj10/share_301739632/0_public_datasets/video2audio/v2a_2m_filter_5_15_20241027.json
  t5_pad_emb: /apdcephfs_jn/share_302243067/0_public_datasets/V2A/audioset/T5_pad_embedding.pt
  clip_pad_emb: /apdcephfs_jn/share_302243067/0_public_datasets/V2A/audioset/black_video.pt
  text_tokenizer: "phi-2"
  audio_token_offset: 51200
  drop_clip: 0.1
  drop_text: 0.1
  feat_in_shadow: False
  double_codebook: False
  codebook_arrangement: concat  # no effect if double code book is False
  feat_in_shadow: False
  double_codebook: False
  dac_voca_size: 4096
  audio_token_max_length: 750
  max_sequence_len: 1025
  max_text_length: 227
  max_frames: 40
  dataloader_params:
    num_workers: 4
