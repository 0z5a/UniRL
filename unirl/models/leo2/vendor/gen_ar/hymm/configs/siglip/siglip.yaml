training_config:
  trainer_name: siglip_trainer.SiglipTrainer
  micro_batch_size: 32
  gradient_accumulation_steps: 1
  global_batch_size: null
  global_seed: 1
  reproduce: False
  profile: False
  zero_stage: 2
  log_every: 1
  tensorboard: True
  training_parts: null
  gradient_checkpoint: False
  gradient_checkpoint_layers: -1

  use_ema: False
  distributed_ema: False
  ema_precision: bf16
  ema_warmup: True
  ema_decay: null
  ema_warmup_power: null

  max_epochs: 100                           # Not used
  max_training_steps: 1000000
  ckpt_every: 500

  init_save: False
  final_save: True

  resume: null
  resume_dataloader: False
  no_load_optim_states: False
  no_load_ema: False
  default_rank0_ss: False
  fix_lr_scheduler: False

  validation_at_steps: []
  validation_every: 5000
  validation_metrics: null
  validation_metrics_save_image: False

sampling_config:
  ckpt: null
  load_key: module
  metric_image_size: 512
  metric_batch_size: 8
  evaluation_metrics: []
  rerank: 1
  sample_image_size: 512
  sample_batch_size: 8
  seed_type: auto
  seed: 123456

model_config:
  model_name: siglip2-so400m-patch16-naflex
  processor_path: "/apdcephfs_nj10/share_301739632/1_public_models/hymm_ar_assets/vision_encoder/siglip2-so400m-patch16-naflex/official"
  precision: fp32
  autocast_dtype: bf16
  vision_encoder_max_num_patches: 256
  text_encoder_max_length: 64

  model_kwargs:
    siglip_loss_bidir: True

optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.0001
    betas: [0.9, 0.95]
    eps: 0.000001
    weight_decay: 0.01

lr_scheduler_config:
  lr_schedule: WarmupCosineLR
  lr_scheduler_params:
    warmup_num_steps: 5000
    total_num_steps: 100000000
    cos_min_ratio: 1.0

dataloader_config:
  index_file: /apdcephfs_nj10/share_301739632/kathrinawu/taurus_train_data/1024p_data/1024p_multires_stage2_1024mb.json
  training_image_size: 256 # only used when multireso is False
  multireso: True
  shuffle_by: dataset
  fast_shuffle: True
  index_kwargs:
    image_key: cache_image
    try_first_use_source_text: False
    use_general_style: True
    image_caption_rate: 0.95
    image_text_col: text_source
    image_caption_col: caption_v2
    caption_sample_ratio: '{"long_caption":0.1,"medium_caption":0.25,"short_caption":0.65,"background":0.04,"shot_type":0.04,"style":0.04,"light":0.04,"atmosphere":0.04,"composition":0.04,"IP":0.04}'
    caption_processor: caption_process_v2
    caption_processor_kwargs: '{"ocr_only_long_caption": true}'
    index_strategy: uniform
    index_probability: null
  dataloader_params:
    num_workers: 8
    pin_memory: True
    prefetch_factor: 4