training_config:
  trainer_name: InstructionTuningMLMTrainer
  micro_batch_size: 8
  gradient_accumulation_steps: 2
  global_seed: 42
  reproduce: False
  profile: False
  zero_stage: 2

  max_epochs: 64
  max_training_steps: 1_000_000_000
  ckpt_every: 2000
  save_n_training_data: 1
  log_every: 10
#  init_save: True
  final_save: True

  gradient_checkpoint: True
  gradient_checkpoint_layers: 24
  loss_predict: text__image_masked
  train_schedule_type: lognorm

validation_config:
  batch_size: 8
  infer_steps: 30
  guidance_scale: 6.0
  pipeline_kwargs:
    temperature: 30
    guidance_dynamic: const
    schedule_type: shift
    mask_ratio_shift: 4.0
  validation_every: 2000
  validation_at_steps:
    - 2000
  validation_metrics: []

model_config:
  model_name: phi-2-3drope
  pretrained_ckpt: /apdcephfs_nj10/share_301739632/jarvizhang/workspace/hymm_ar/log_EXP_T2I/0013_phi_2_3drope_20241129_105949_n32_mlm_t2i_std230m_compare/checkpoints/0615000/mp_rank_00_model_states.pt
  load_llm_to_mllm: False
  expand_keys: [ "transformer.wte.weight", "lm_head.weight", "lm_head.bias" ]
  model_precision: bf16
  media_vocab_size: 16384
  ignore_index: -100
  rope_type: 3d-interleave
  rope_dim_list: [ 32, 24, 24 ]
  model_kwargs:
    block_size: 2304

extra_model_config:
  vae_type: 88-vqgan-hy_241024
  vae_precision: bf16

optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.000001
    betas: [0.9, 0.95]
    eps: 0.000001
    weight_decay: 0.01

lr_scheduler_config:
  lr_scheduler_name: WarmupLR
  lr_scheduler_params:
    warmup_num_steps: 5000
    warmup_max_lr: 0.000001

dataloader_config:
  image_size: 256
  index_file:
  - /apdcephfs_nj10/share_301739632/0_public_datasets/image_editing/HIVE/base.json
  - /apdcephfs_nj10/share_301739632/0_public_datasets/image_inpainting/v1/base.json
  multireso: False
  editing_test_arrow: /apdcephfs_nj10/share_301739632/0_public_datasets/image_editing/HIVE/test.arrow
  inpainting_test_arrow: /apdcephfs_nj10/share_301739632/0_public_datasets/image_inpainting/v1/test.arrow
  use_pre_extracted_token: True
  text_token_length: 256
  image_token_length: 1024
  image_token_offset: 51200           # equals to model_settings.padded_vocab_size
  uncond_p: 0.1                       # unconditional probability
  tokenizer_name: phi-2
  fast_shuffle: True
  shuffle_by: dataset
  index_kwargs:
    eiditing_src_img_token_col: src_img_token_256x256_88-vqgan-hy_241024
    eiditing_tgt_img_token_col: tgt_img_token_256x256_88-vqgan-hy_241024
    inpainting_mask_dataset_path: /apdcephfs_nj10/share_301739632/0_public_datasets/image_inpainting/v1/irregular_mask
    inpainting_mask_dataset_set: train
    inpainting_img_token_col: img_token_88-vqgan-hy_241024
    inpainting_caption_rate: 0.95
    inpainting_text_col: text
    inpainting_caption_col: caption
    inpainting_caption_sample_ratio: '{"long caption": 0.50, "short caption": 0.45, "background": 0.0, "shot type": 0.0, "style": 0.0, "light": 0.0, "atmosphere": 0.0, "camera movement": 0.0}'
    instruction_uncond_p: 0.1
  dataloader_params:
    num_workers: 4
    pin_memory: True
    prefetch_factor: 4
