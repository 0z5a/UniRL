training_config:
  trainer_name: Label2ImageTrainerV2
  micro_batch_size: 64
  gradient_accumulation_steps: 1
  global_seed: 42
  reproduce: False
  profile: False
  task_flag: test_base
  zero_stage: 2

  max_epochs: 300
  max_training_steps: 100_000_000
  ckpt_every: 5000
  save_n_training_data: 1

  validation_every: 2500
  validation_at_steps:
    - 10
    - 100
    - 1000
  validation_metrics:
    - image

validation_config:
  batch_size: 8
  infer_steps: 12
  guidance_scale: 4.0
  pipeline_kwargs:
    temperature: 4.5
    guidance_dynamic: linear_inc

model_config:
  model_name: maskgit-256-400m
  model_precision: fp32
  ignore_index: -100
  no_mask_token_prob: 0.0
  label_smoothing: 0.1
  uncond_p: 0.1
  schedule_type: arccos
  model_kwargs:
    padded_vocab_size: 1000
    media_vocab_size: 1024
    max_pos_embed: 257
    attn_drop_rate: 0.1
    mlp_drop_rate: 0.1

extra_model_config:
  vae_type: 1616-vqgan-maskgit_pytorch
  vae_precision: fp32

optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.0001
    betas: [0.9, 0.96]
    eps: 0.000001
    weight_decay: 1.0e-5

lr_scheduler_config:
  lr_scheduler_name: WarmupLR
  lr_scheduler_params:
    warmup_num_steps: 0
    warmup_min_lr: 1.0e-6
    warmup_max_lr: 0.0001

dataloader_config:
  image_size: 256
  index_file: /apdcephfs_nj8/share_301739632/jarvizhang/workspace/hymm_ar/__data/dataset_image/imagenet_1k.json
  fast_shuffle: True
  shuffle_by: dataset
  dataloader_params:
    num_workers: 8
