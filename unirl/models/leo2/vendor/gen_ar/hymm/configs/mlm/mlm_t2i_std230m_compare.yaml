training_config:
  trainer_name: Text2ImageMLMTrainer
  micro_batch_size: 12
  gradient_accumulation_steps: 1
  global_seed: 42
  reproduce: False
  profile: False
  zero_stage: 2

  max_epochs: 8
  max_training_steps: 1_000_000_000
  ckpt_every: 5000
  save_n_training_data: 0
  log_every: 10
  final_save: True

  gradient_checkpoint: True
  gradient_checkpoint_layers: 20
  loss_predict: text__image_masked
  train_schedule_type: lognorm

validation_config:
  batch_size: 8
  infer_steps: 12
  guidance_scale: 6.0
  pipeline_kwargs:
    temperature: 4.5
    guidance_dynamic: const
  validation_every: 5000
  validation_at_steps:
    - 5000
  validation_metrics: [ "image", "fid@coco30k", "clip_score@coco30k", "hpsv2@coco30k", "t2i_compbench" ]
  csv: std1000

model_config:
  model_name: phi-2-3drope
  pretrained_ckpt: null
  load_llm_to_mllm: True
  expand_keys: [ "transformer.wte.weight", "lm_head.weight", "lm_head.bias" ]
  model_precision: bf16
  media_vocab_size: 16384
  ignore_index: -100
  schedule_type: arccos

extra_model_config:
  vae_type: 88-vqgan-hy_241024
  vae_precision: bf16

optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.0001
    betas: [0.9, 0.96]
    eps: 0.000001
    weight_decay: 0.01

lr_scheduler_config:
  lr_scheduler_name: WarmupCosineLR
  lr_scheduler_params:
    warmup_num_steps: 5000
    total_num_steps: -1
    cos_min_ratio: 0.01

dataloader_config:
  image_size: 256
  index_file: /apdcephfs_nj10/share_301739632/ckczzjzhang/idk_data/merged_0918_300m_drop_aigc_dedup_remove_civitai_30_source_remove_wrong_size_mb256.json
  multireso: True
  use_pre_extracted_token: True
  image_token_offset: 51200           # equals to model_settings.padded_vocab_size
  text_token_length: 256
  uncond_p: 0.1                       # unconditional probability
  tokenizer_name: phi-2
  fast_shuffle: True
  shuffle_by: dataset
  index_kwargs:
    image_caption_rate: 0.95
    image_text_arrow_suffix: _trans
    image_text_col: trans
    image_caption_arrow_suffix: _caption_v2
    image_caption_col: result
    image_token_arrow_suffix: _token
    image_token_col: hy_magvitv2_241024
    caption_sample_ratio: '{"long caption": 0.5, "short caption": 0.45, "background": 0.0, "shot type": 0.0, "style": 0.0, "light": 0.0, "atmosphere": 0.0, "camera movement": 0.0}'
    image_token_arrow_ceph: /apdcephfs_nj10/share_301739632
  dataloader_params:
    num_workers: 4
    pin_memory: True
    prefetch_factor: 4
