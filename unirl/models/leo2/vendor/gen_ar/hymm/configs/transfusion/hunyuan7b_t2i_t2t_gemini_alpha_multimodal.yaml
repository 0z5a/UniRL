training_config:
  trainer_name: multimodal_gemini_alpha_trainer.GeminiTrainerAlphaMultiModal
  micro_batch_size: 4
  gradient_accumulation_steps: 1
  global_batch_size: null
  global_seed: 123
  zero_stage: 2
  log_every: 1
  tensorboard: True
  gradient_checkpoint: False
  gradient_checkpoint_layers: -1

  max_training_steps: 317_600
  ckpt_every: 5000

  init_save: False
  final_save: True

  resume: null
  resume_dataloader: False
  no_load_optim_states: False
  no_load_ema: False
  default_rank0_ss: False
  fix_lr_scheduler: False

  validation_at_steps: []
  validation_every: -1
  validation_metrics: []
  validation_metrics_save_image: False

sampling_config:
  ckpt: null
  load_key: module
  metric_image_size: 512
  metric_batch_size: 8
  evaluation_metrics: [fid@coco30k, clip_score@coco30k, hpsv2@coco30k, t2i_compbench]
  rerank: 1
  sample_image_size: 512
  sample_batch_size: 8
  seed_type: auto
  seed: 123456
  guidance_scale: 6.0
  diff_infer_steps: 100
  sample_flow_shift: 1.0
  sample_use_flux_shift: False

model_config:
  model_name: hunyuan-dense-7b
  model_structure: MultiModalTransfusion
  tokenizer_name: hunyuan-dense-7b
  pretrained_ckpt: null #/apdcephfs_gy2/share_302507476/ckczzjzhang/output_ar/ptm/gemini_alpha_stage2_epoch2/checkpoint/global_step75000/mp_rank_00_model_states.pt
  load_prepend_key: 'language_model.'
  precision: bf16
  autocast_dtype: bf16
  media_vocab_size: 0

  denoise_type: flow
  flow_path_type: linear
  flow_predict_type: velocity
  flow_loss_weight: null
  flow_train_eps: null
  flow_sample_eps: null
  flow_snr_type: lognorm
  flow_reverse: True
  flow_shift: 1.0
  use_flux_shift: False
  flux_base_shift: null
  flux_max_shift: null

  model_kwargs:
    block_size: 1536
    vision_model:
      vision_model_type: siglip2-large-patch16-512
      vision_model_precision: fp32
      vision_model_autocast_dtype: fp32
      vision_model_freeze: True
    vision_aligner:
      vision_aligner_type: mlp_gelu
      vision_aligner_precision: fp32
      vision_aligner_autocast_dtype: fp32
      vision_aligner_freeze: False
      vision_aligner_params:
        depth: 2
        input_dim: 1024   # Align to vision_model_type's hidden_dim
        n_embed: 4096     # Align to model_name's n_embd

  image_loss_weight: 5.0

  img_proj_type: unet
  patch_embed_hidden_dim: 1024
  patch_size: 1

  use_compile: True
  use_front_boi_token: True

extra_model_config:
  vae_type: 32x32-64c-hy_v2
  vae_precision: fp32
  vae_autocast_dtype: fp32
  vae_latent_dim: 64

optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.0001
    betas: [0.9, 0.95]
    eps: 0.000001
    weight_decay: 0.01

lr_scheduler_config:
  lr_schedule: WarmupCosineLR
  lr_scheduler_params:
    warmup_min_ratio: 0.0
    warmup_num_steps: 5000
    cos_min_ratio: 0.01
    total_num_steps: 317_600

dataloader_config:
  # Text-to-Image
#  index_file: /apdcephfs_gy2/share_302507476/0_public_datasets/text2image_gemini/gemini_json/mb1024.json
  index_file: /apdcephfs_gy2/share_302507476/jarvizhang/debug_index/debug_multireso_mb1024.json
  image_key: url_cos
  training_image_size: 1024 # only used when multireso is False
  image_token_length: 1024
  text_token_length: 512
  uncond_p: 0.1
  multireso: True
  add_iw_ih_token: True
  add_timestep_token: True
  try_first_use_source_text: True
  caption_processor: caption_process_v2
  caption_processor_kwargs: '{"ocr_only_long_caption": true}'
  use_general_style: True
  pred_text_boi_eos: [False, False, True]   # Keep to predict <eos> as the dummy lm token.
  index_kwargs:
    image_caption_rate: 0.2   # 表示遇到 text source 时, 有 1-60% 的概率使用 text source, 否则就使用
    image_text_col: text_source
    image_caption_col: caption_v2
    caption_sample_ratio: '{"long_caption":0.4,"medium_caption":0.3,"short_caption":0.25,"background":0.8,"shot_type":0.8,"style":0.8,"light":0.8,"atmosphere":0.8,"composition":0.8,"IP":0.8}'
    ceph_base: '{"/apdcephfs_gy2/share_302507476":"gy2"}'

  # Language Model
  text_index_file:
    - /apdcephfs_gy2/share_302507476/jarvizhang/debug_index/debug_hy_text.json
    - /apdcephfs_gy2/share_302507476/jarvizhang/debug_index/debug_gemini_alpha_caption.json
#  text_index_file:
#    - /apdcephfs_gy2/share_302507476/1_public_models/hymm_ar_assets/dataset/t2t_index/hy_text_930m.json
#    - /apdcephfs_gy2/share_302507476/1_public_models/hymm_ar_assets/dataset/t2t_index/gemini_alpha_caption.json
  # Caption dataset will be distinguished by the column name `caption_v2`.
  lm_caption_processor: caption_process_v2
  # here long caption always be used. Set to 1.0 as a placeholder.
  lm_caption_sample_ratio: '{"long_caption":1.0,"medium_caption":0.5,"short_caption":0.5,"background":0.8,"shot_type":0.8,"style":0.8,"light":0.8,"atmosphere":0.8,"composition":0.8,"IP":0.8}'
  lm_caption_processor_kwargs: '{"use_recaption_template": true}'
  lm_index_kwargs:
    lm_ceph_base: '{"/apdcephfs_gy2/share_302507476":"gy2"}'

  # Multimodal Understanding
  mmu_index_file:
    - /apdcephfs_gy2/share_302507476/1_public_models/hymm_ar_assets/dataset/mmu_index/vl_cauldron.json
    - /apdcephfs_gy2/share_302507476/1_public_models/hymm_ar_assets/dataset/mmu_index/vl_llava_onevision.json
    - /apdcephfs_gy2/share_302507476/1_public_models/hymm_ar_assets/dataset/mmu_index/cambrian10m.json
    - /apdcephfs_gy2/share_302507476/1_public_models/hymm_ar_assets/dataset/mmu_index/mammoth_vl_instruct_12m.json
    - /apdcephfs_gy2/share_302507476/0_public_datasets/text2image_gemini/gemini_json/t2i_caption_taurus_filter_60_filter_some_aigc_filter_mj_filter_quality_v2_0.75_base.json
    - /apdcephfs_gy2/share_302507476/0_public_datasets/text2image_gemini/gemini_json/t2i_caption_ar_filter_60_filter_some_aigc_filter_mj_base.json
    - /apdcephfs_gy2/share_302507476/0_public_datasets/text2image_gemini/gemini_json/t2i_caption_taurus_1024p_mj.json
    - /apdcephfs_gy2/share_302507476/0_public_datasets/text2image_gemini/gemini_json/t2i_caption_taurus_1024p_application.json
  mmu_caption_processor: caption_process_v2
  mmu_caption_sample_ratio: '{"long_caption":1.0,"medium_caption":0,"short_caption":0,"background":0,"shot_type":0,"style":0,"light":0,"atmosphere":0,"composition":0,"IP":0}'
  mmu_index_kwargs:
    mmu_ceph_base: '{"/apdcephfs_gy2/share_302507476":"gy2"}'

  # Common
  sampling_probs: [0.4, 0.2, 0.4]   # [t2i, lm, mmu]
#  sampling_probs: [0., 0.2, 0.]   # [t2i, lm, mmu]
  shuffle_by: dataset
  fast_shuffle: True
  dataloader_params:
    num_workers: 0
    pin_memory: True
    prefetch_factor: null
