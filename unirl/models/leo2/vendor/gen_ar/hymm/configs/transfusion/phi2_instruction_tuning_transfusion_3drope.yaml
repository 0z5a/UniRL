training_config:
  trainer_name: InstructionTuningTransfusionTrainer2
  micro_batch_size: 6
  gradient_accumulation_steps: 1
  global_batch_size: null
  global_seed: 1
  reproduce: False
  profile: False
  zero_stage: 2
  log_every: 10
  tensorboard: True
  training_parts: null
  gradient_checkpoint: False
  gradient_checkpoint_layers: -1

  use_ema: False
  distributed_ema: False
  ema_precision: bf16
  ema_warmup: True
  ema_decay: null
  ema_warmup_power: null

  max_epochs: 64
  max_training_steps: 1_000_000_000
  ckpt_every: 1000

  init_save: False
  final_save: True

  resume: null
  resume_dataloader: False
  no_load_optim_states: False
  no_load_ema: False
  default_rank0_ss: False
  fix_lr_scheduler: False

  validation_at_steps: [100]
  validation_every: 5000
  validation_metrics: null # metrics will be calculated during train
  validation_metrics_save_image: False

sampling_config:
  ckpt: null
  load_key: module
  metric_image_size: 256
  metric_batch_size: 1
  evaluation_metrics: []
  sample_image_size: 256
  sample_batch_size: 1
  seed_type: auto
  seed: 123456
  guidance_scale: 6.0
  diff_infer_steps: 100
  sample_flow_shift: 1.0
  sample_use_flux_shift: False
  inpainting_blend: False

model_config:
  model_name: phi-2-3drope
  model_type: Transfusion
  pretrained_ckpt: /apdcephfs_nj10/share_301739632/jarvizhang/workspace/hymm_ar/log_EXP_T2I/0033_phi_2_3drope_20241213_153527_n16_phi2_text2image_transfusion_3drope/checkpoints/0330000/mp_rank_00_model_states.pt
  load_llm_to_mllm: False
  expand_keys: []
  model_precision: bf16
  autocast_dtype: bf16
  media_vocab_size: 0

  denoise_type: flow
  flow_path_type: linear
  flow_predict_type: velocity
  flow_loss_weight: null
  flow_train_eps: null
  flow_sample_eps: null
  flow_snr_type: lognorm
  flow_reverse: True
  flow_shift: 1.0
  use_flux_shift: False
  flux_base_shift: null
  flux_max_shift: null

  model_kwargs:
    block_size: 768 # only used for Transfusion's KVCache, and it must be full token seq length
    # rope_base_rescale_factor: 4.0

  image_loss_weight: 1.0

  img_proj_type: unet
  patch_embed_hidden_dim: 1024
  patch_size: 2
  rope_type: 3d-interleave
  rope_dim_list: [32, 24, 24]

extra_model_config:
  vae_type: 88-vae-sdxl
  vae_precision: bf16
  vae_latent_dim: 4

optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.000001
    betas: [0.9, 0.95]
    eps: 0.000001
    weight_decay: 0.01

lr_scheduler_config:
  lr_scheduler_name: WarmupLR
  lr_scheduler_params:
    warmup_num_steps: 5000
    warmup_max_lr: 0.000001


dataloader_config:
  index_file: "/apdcephfs_nj10/share_301739632/0_public_datasets/image_subject_driven/subject_driven_mb256.json"
  editing_test_arrow: /apdcephfs_nj10/share_301739632/0_public_datasets/image_editing/HIVE/test.arrow
  # editing_test_arrow: /apdcephfs_gy2/share_302507476/0_public_datasets/image_editing/HIVE/test.arrow
  inpainting_test_arrow: /apdcephfs_nj10/share_301739632/0_public_datasets/image_inpainting/v1/test.arrow
  # inpainting_test_arrow: /apdcephfs_gy2/share_302507476/0_public_datasets/image_inpainting/v1/test.arrow
  training_image_size: 256
  image_token_length: 256  # must be largest length of image token sequence
  text_token_length: 256
  tokenizer_name: phi-2
  add_iw_ih_token: False
  add_timestep_token: False
  multireso: True
  mix_scale: False
  anchor_size: 256
  shuffle_by: dataset
  fast_shuffle: True
  debug: False
  index_kwargs:
    eiditing_src_img_col: src_img_bytes
    eiditing_tgt_img_col: tgt_img_bytes
    inpainting_mask_dataset_path: /apdcephfs_nj10/share_301739632/0_public_datasets/image_inpainting/v1/irregular_mask
    inpainting_mask_dataset_set: train
    inpainting_img_col: src_img_bytes
    inpainting_caption_rate: 0.95
    inpainting_text_col: text
    inpainting_caption_col: caption
    inpainting_caption_sample_ratio: '{"long caption": 0.50, "short caption": 0.45, "background": 0.0, "shot type": 0.0, "style": 0.0, "light": 0.0, "atmosphere": 0.0, "camera movement": 0.0}'
    instruction_uncond_p: 0.1
    index_strategy: uniform
    index_probability: null
  dataloader_params:
    num_workers: 4
    pin_memory: True
    prefetch_factor: 2
