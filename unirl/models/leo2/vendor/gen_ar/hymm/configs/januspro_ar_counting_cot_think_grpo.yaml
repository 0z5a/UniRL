training_config:
  trainer_name: Text2ImageARGRPOTrainer
  gradient_accumulation_steps: 1
  global_batch_size: null
  global_seed: 1
  reproduce: False
  profile: False
  zero_stage: 2
  tensorboard: True
  training_parts: null
  gradient_checkpoint: False
  gradient_checkpoint_layers: -1

  use_ema: False
  distributed_ema: False
  ema_precision: bf16
  ema_warmup: True
  ema_decay: null
  ema_warmup_power: null

  # grpo-related
  model_cpu_offload: True
  extra_und_penalty: False
  kl_beta: 0.04
  num_generations: 8
  micro_batch_size: 1
  log_every: 1
  enable_think_mode: True

  max_epochs: 100
  max_training_steps: 100_000
  ckpt_every: 200

  init_save: False
  final_save: True

  resume: null
  resume_dataloader: False
  no_load_optim_states: False
  no_load_ema: False
  default_rank0_ss: False
  fix_lr_scheduler: False

  validation_at_steps: [100]
  validation_every: 5000
  validation_metrics: null # metrics will be calculated during train
  validation_metrics_save_image: False

sampling_config:
  sample_save_path: vis/images/janus_pro_counting_cot_sft_think_grpo
  ckpt: null
  no_load_model: False
  load_key: module
  metric_image_size: 384
  metric_batch_size: 1
  evaluation_metrics: [counting_eval]
  evaluation_metrics_save_image: True
  # evaluation_metrics: [fid@coco30k, clip_score@coco30k, hpsv2@coco30k, t2i_compbench@t2i_compbench]
  sample_image_size: 384
  sample_batch_size: 1
  rerank: 1
  seed_type: auto
  seed: 123456
  format_prompt_type: think # default
  train_format_prompt_type: original  # used in grpo training process for generating samples
  # tokenizer_infer_fn: encode_ar_ti2t_infer
  # guidance_scale: 0.0
  text_do_sample: False
  save_inter_results: False # whether to save the inter-results of CoT
  max_generated_tokens: 4544
  image_logits_processors_cfg:
  - SliceVocabLogitsWarper:
      vocab_start: 0
      vocab_end: 16384
  - CfgLogitsWarper:
      guidance_scale: 6.0
  - TopKLogitsWarper:
      top_k: 128
  - TopPLogitsWarper:
      top_p: 0.9

  answer_mode_image_logits_processors_cfg:
  - SliceVocabLogitsWarper:
      vocab_start: 0
      vocab_end: 16384
  # - CfgLogitsWarper:
  #     guidance_scale: 0.0
  - TopKLogitsWarper:
      top_k: 128
  - TopPLogitsWarper:
      top_p: 0.9
  
  text_logits_processors_cfg:
  - SliceVocabLogitsWarper:
      vocab_start: 0
      vocab_end: 102400
  # - CfgLogitsWarper:
  #     guidance_scale: 6.0
  # - TopKLogitsWarper:
  #     top_k: 128
  # - TopPLogitsWarper:
  #     top_p: 0.9

model_config:
  model_name: janus-pro-7b
  image_preprocessor_pretrained_path: /apdcephfs_gy2/share_302507476/1_public_models/hymm_ar_assets/pretrained_llm/Janus-Pro-7B
  # pretrained_ckpt: /apdcephfs_gy2/share_302507476/1_public_models/hymm_ar_assets/pretrained_llm/Janus-Pro-7B/transformed_model.pt
  pretrained_ckpt: /apdcephfs_gy2/share_302507476/yutaocui/exp_dir/text2image_ar/log_COUNT_COT_EXP/0008_janus_pro_7b_20250321_005234_n1_januspro_ar_counting_cot_think/checkpoints/0006000/mp_rank_00_model_states.pt
  load_llm_to_mllm: True
  expand_keys: ["transformer.wte.weight", "lm_head.weight"]
  precision: bf16
  autocast_dtype: bf16
  media_vocab_size: 16384
  # frozen_layers: ["transformer_layers"]  # "transformer_layers0-6", "lm_head", "wte"
  enable_image_und: True
  frozen_layers: ["visual_und_encoder"]
  vision_model_type: janus-siglip_large_patch16_384
  enable_train_visual_encoder: True
  enable_sep_modal_adaptors: True
  training_parts: auto
  cfg_token_tag: "<｜▁pad▁｜>"
  pad_token_tag: "<｜▁pad▁｜>"
  boi_token_tag: "<begin_of_image>"
  eoi_token_tag: "<end_of_image>"
  img_token_tag: "<image_placeholder>"
  eos_token_tag: "<｜end▁of▁sentence｜>"

  model_kwargs:
    block_size: 4544 # max_length of the token sequence

extra_model_config:
  vae_type: 1616-vq-janus
  vae_precision: bf16

optimizer_config:
  optimizer_name: AdamW
  gradient_clipping: 1.0
  optimizer_params:
    lr: 0.000002
    betas: [0.9, 0.95]
    eps: 0.000001
    weight_decay: 0.01

lr_scheduler_config:
  lr_scheduler_name: WarmupLR #WarmupCosineLR
  lr_scheduler_params:
    warmup_num_steps: 0
    warmup_max_lr: 0.000002

dataloader_config:
  # index_file: /apdcephfs_nj10/share_301739632/ckczzjzhang/idk_data/merged_0918_300m_drop_aigc_dedup_remove_civitai_30_source_remove_wrong_size_mb256.json
  # index_file: /apdcephfs_nj8/share_301739632/jarvizhang/workspace/hymm_ar/__data/dataset_image/imagenet_1k.json
  # index_file: /apdcephfs_gy2/share_302507476/0_public_datasets/image_counting_1024x1024/counting_alpha_json/image_counting_cot_flux_20250302.json
  index_file: /apdcephfs_gy2/share_302507476/0_public_datasets/image_counting_1024x1024/counting_alpha_json/image_counting_cot_flux_grpo_objnum2to5_20250302.json
  training_image_size: 384  # training image size is used in non-multireso mode
  image_token_length: 576  # must be largest length of image token sequence in multireso mode
  image_token_offset: 102400  # equals to padded_vocab_size
  use_pre_extracted_token: False
  text_token_length: 512
  uncond_p: 0.1
  tokenizer_name: janus-pro-7b
  # multireso: True
  add_iw_ih_token: False #True
  shuffle_by: dataset
  fast_shuffle: True
  debug: False
  index_kwargs:
    index_strategy: uniform
    index_probability: null
  dataloader_params:
    num_workers: 8
    pin_memory: True
    prefetch_factor: 4
