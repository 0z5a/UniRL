# IMPORTANT NOTE: Write PTM args in YAML format:
# 0. all arguments specified here are one-one correspondences with PTM arguments; un-specified arguments use PTM default values.
# 1. arguments like '--hidden-size=2560' are written as 'hidden-size: 2560' (see below, note the space after colon).
# 2. YAML format is like a tree, and only the leaf nodes are considered as arguments.
#    Non-leaf nodes and structures are ignored, so arguments can be grouped as you like.
# 3. arguments like '--sequence-parallel' can be written as 'enabled: \n  - sequence-parallel' (see below, note the indent).
#    multiple `enabled` arguments in a same sub-tree must be put in a `enabled` list (see below for an example).

__GLOBAL_VARS__:
  _DEFAULT_OUTPUT_PATH: "/apdcephfs_wza/somoszhang/gemini35-exp/pure_torch/hy3vl_moe_a3b_example"
  DATA_PATH: "/root/dummy_data"
  OUTPUT_PATH: ${oc.env:OUTPUT_PATH,${__GLOBAL_VARS__._DEFAULT_OUTPUT_PATH}}

MODEL_ARGS:
  model-name: multimodal.hunyuan3-moe-a3b-gemini-mot-gen-a10b
  model-structure: HunyuanMultimodal

  # Mcore required.
  num-layers: 48
  hidden-size: 2048
  num-attention-heads: 32
  ffn-hidden-size: 6912
  kv-channels: 128
  # max-position-embeddings: 131072 # 128k
  # max-position-embeddings: 262144 # 256k
  max-position-embeddings: 153600 # 150k
  # max-position-embeddings: 358400 # 350k
  seq-length: ${MODEL_ARGS.max-position-embeddings}
  vocab-size: 126309
  normalization: RMSNorm
  num-query-groups: 4
  num-experts: 128
  init-method-std: 0.006
  moe-router-topk: 8
  moe-ffn-hidden-size: 768
  moe-shared-expert-intermediate-size: 768
  moe-layer-freq: '([0]+[1]*47)'
  # moe-layer-freq: '([0]+[1]*1)'
  moe-token-dispatcher-type: flex
  moe-router-dtype: fp32
  attention-dropout: 0.0
  hidden-dropout: 0.0
  # gen a10b
  hidden-size-mot-gen: 3200
  moe-topk-mot-gen: 16
  # other
  moe-router-load-balancing-type: seq_aux_loss
  moe-aux-loss-coeff: 0.0001
  moe-router-bias-update-rate: 0.001
  moe-router-score-function: sigmoid
  position-embedding-type: rope
  rotary-base: 11158840 
  embedding-init-method-std: 6e-3  # ds-v3 init std
  moe-router-topk-scaling-factor: 2.826
  transformer-impl: local
  extra-weight-decay-param-substrings:
    - "layernorm"
    - "layer_norm"

  init-device: meta  # [cpu, cuda, meta] pure torch specific
  autocast-dtype: bf16  # pure torch specific
  enabled:
      # common
    - bf16
    # mcore
    - use-mcore-models
    - group-query-attention
    - swiglu
    - disable-bias-linear
    - qk-layernorm
    - moe-grouped-gemm
    - moe-use-legacy-grouped-gemm
    - use-pre-qk-norm  #先qk-norm再rope
    - untie-embeddings-and-output-weights #untie
    - embedding-no-weight-decay
    - use-unified-init-method # output_layer unify init
    - moe-router-enable-expert-bias
    - disable-flash-attn-3
    - moe-router-enable-expert-bias-zero-mean-update
    - use-gate-torch-mm
    # torch
    - split-qkv
    - split-gate-and-up
    # mot
    - use-mot
    # - mot-und-frozen
    # - mot-embed-norm-lm-head-frozen
    - use-global-diffusion-loss-average
    - use-global-discrete-loss-average
    - dist-ckpt-save-pre-mcore-014  # 沿用旧逻辑，不拆分weights_w和weights_v

  patch-size: 1
  moe-impl: ep_moe
  gate-impl: deepseek
  rope-type-extended: "interleaved_mrope"
  cond-image-type: vae_vit
  cond-token-attn-type: full


EXTRA_MODEL_ARGS:
  enabled:
    - use-vae
    - use-vit
    # - vit-frozen
    - vit-recompute
    - vae-recompute
    - text-loss-recompute
  vae-type: 16x16-128c-flux2
  vae-latent-dim: 128
  vae-precision: fp32
  vae-autocast-dtype: fp32
  vit-type: anyres-vit-for-hy3-a3b
  compute-text-loss-chunk-num: 4

DENOISE_ARGS:
  denoise-type: flow
  flow-path-type: linear
  flow-predict-type: velocity
  flow-snr-type: lognorm
  flow-reverse: True
  use-flux2-shift: True

DATA_ARGS:
  tokenizer-type: NullTokenizer
  dataloader-type: external

  # extra args provider
  tokenizer-name: hunyuan3-moe-a3b-hymm-v3-5
  tokenizer-class: tokenization_hy3mm_v3_5.Hunyuan3MultimodalV3d5TokenizerFast
  conv-template: hunyuan3-moe-a3b-gemini-mot-gen-a10b
  sequence-template: pretrain
  gen-image-template: default
  shuffle-by: dataset
  combined-iterator-sampling-mode: fixed
  cos-base:
    - "/cos_nj1/share_302243067 -> /apdcephfs_wza2/share_304227829/hunyuan_data/{stem2}"
  ignore-start-tokens: []
  enabled:
    - cos-file-is-encrypted
    - enable-resample
    - fast-shuffle
    - first-epoch-no-shuffle
    - use-numpy-indices
    - add-timestep-token
    - add-tw-th-token
    - timestep-vae-full-attn
    - use-front-src-image
    # - independent-seq-length
    - use-rope-sample-offsets

  # vae
  vae-image-token-length: 16384 # 2048*2048/16/16
  # -- resolution group kwargs
  reso-strategy: anyres
  reso-base-size: 1024
  reso-max-area: 4194304 # 2048*2048
  reso-max-size: 8192
  reso-align: 16
  # vit
  vit-image-token-length: 4352  # 2048*2048/32/32+(2048*4/32)+2

  modality: [ text, vae_image, vit_image ]
  dummy-type: ["ts_proj", "vit"]
  sampling-probs: '{"t2i_ct": 0.05, "t2i_ct_ocr": 0.05, "t2i_ct_camera_exif_nonocr": 0.02, "t2i_ct_camera_exif_ocr": 0.02,  "t2i_ct_ocr_core_v4": 0.1, "t2i_ct_ip": 0.14, "t2i_ct_style": 0.02, "t2i_ct_videoframe": 0.02, "interleave_ct": 0.05, "interleave_ct_hecheng": 0.16, "interleave_ct_multigen": 0.05, "interleave_gen_COT_T2I": 0.03, "interleave_gen_COT_I2I": 0.06, "interleave_gen_COT_MULTIGEN": 0.03, "lm_mt": 0.1, "mmu_mt": 0.098, "mmu_mt_caption": 0.002}'

  und-token-type: [ "bos", "text", "boi", "vit", "eoi", "joint_image_sep", "eoi", "eos", "pad", "vae_info" ]
  gen-token-type: [ "vae" ]

  # Dataloader
  num-workers: 24
  prefetch-factor: 12

  # pack-buffer-factor: 1 # TODO


