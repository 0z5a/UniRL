TRAINING_ARGS:
  micro-batch-size: 1
  gradient-accumulation-steps: 2
  global-batch-size: ${mul:${div:${mul:${oc.env:HOST_GPU_NUM}, ${oc.env:HOST_NUM}}, ${mul:${mul:${MODEL_PARALLEL_ARGS.tensor-model-parallel-size}, ${MODEL_PARALLEL_ARGS.pipeline-model-parallel-size}}, ${MODEL_PARALLEL_ARGS.context-parallel-size}}}, ${mul:${TRAINING_ARGS.gradient-accumulation-steps}, ${TRAINING_ARGS.micro-batch-size}}} # GLOBAL_BATCH_SIZE = HOST_GPU_NUM * HOST_NUM / (TP_SIZE*PP_SIZE*CP_SIZE) * GRADIENT_ACCUMULATION_STEPS * MICRO_BATCH_SIZE  lr: 1e-4
  lr: 3e-5
  train-iters: 100_000_000
  lr-decay-iters: 100_000_000
  lr-decay-style: constant
  optimizer: muon
  muon-ema-gradient: True  # 对应sum_decay_momentum为False的情况
  muon-momentum: 0.95
  adam-beta1: 0.9
  adam-beta2: 0.95
  min-lr: 3e-5
  weight-decay: 0.1
  lr-warmup-iters: 100
  clip-grad: 1.0
  eval-interval: 1000
  eval-iters: 0
  seed: 1234
    # - optimizer-cpu-offload
    # - use-precision-aware-optimizer
  __FROZEN__OPTIMIZER_ARGS:  # pure torch specific
    optimizer_params:
      lr: ${TRAINING_ARGS.lr}
      adamw_betas:
      - ${TRAINING_ARGS.adam-beta1}
      - ${TRAINING_ARGS.adam-beta2}
      weight_decay: ${TRAINING_ARGS.weight-decay}
      momentum: ${TRAINING_ARGS.muon-momentum}
      adamw_eps: 0.00000001 # adam eps 1e-8
    special_adamw_params: ["*embed_tokens*", "*lm_head*", "*final_layer*", "*time_embed*", "*timestep_emb*", "*patch_embed*", "*embedding*", "*perceive.proj*"]
  __FROZEN__LR_SCHEDULER_ARGS:  # pure torch specific
    lr_scheduler_params:
      num_warmup_steps: ${TRAINING_ARGS.lr-warmup-iters}
      num_training_steps: ${TRAINING_ARGS.train-iters}
      min_lr: ${TRAINING_ARGS.min-lr}

  # loss related
  image-loss-weight: 1.0
  moe-expert-bias-update-rate: 0.001
  moe-score-func: "sigmoid"
  moe-aux-loss-coeff: 0.0001
  enabled:
    # - check-for-spiky-loss
    - accumulate-allreduce-grads-in-fp32
    - deterministic-mode
    # - override-opt_param-scheduler # 需要关掉，否则会resume时会覆盖special的max-lr、min-lr
    - use-dynamic-global-batch-size-convert-iters-to-samples
    # - moe-router-keep-high-precision-params
    # - calculate-per-token-loss
    - moe-enable-router-expert-bias
    - moe-enable-expert-bias-zero-mean-update
    - moe-aux-loss
    - moe-seq-aux-loss


PERFORMANCE_ARGS:
  manual-gc-interval: 100
  recompute-granularity: full
  recompute-method: uniform
  recompute-num-layers: 1
  # recompute-method: block
  # recompute-num-layers: 6
  # per-stage-recompute-num-layers: [6, 6, 4, 0]
  dp-load-balance-task-priority: ["lm", "interleave", "mmu", "t2i"]
  enabled:
    - manual-gc
    # - use-flash-attn
    - moe-enable-deepep
    - enable-experimental
    - moe-permute-fusion
    # - cross-entropy-loss-fusion
    # - moe-router-fusion
    # - moe-shared-expert-overlap # mcore目前实现不支持和deepep一起使用
    - overlap-grad-reduce
    - overlap-param-gather
    # - overlap-moe-expert-parallel-comm
    - no-persist-layer-norm
    - no-gradient-accumulation-fusion
    - no-masked-softmax-fusion
    - no-bias-swiglu-fusion
    - use-out-place-mask-local-attn
    - use-index-add-local-unpermute
    - deepep-moe-shared-expert-overlap
    - muon-overlap-momentum-gather
    - muon-use-batch-p2p-gather
    # - no-bias-dropout-fusion
    # - no-rope-fusion
    # - moe-router-force-load-balancing
    - no-align-grad-reduce
    - disable-gloo-process-groups
    - disable-fill-uninitialized-memory
    - moe-router-correct-valid-tokens
    - dp-load-balance


MODEL_PARALLEL_ARGS:
  tensor-model-parallel-size: 1
  pipeline-model-parallel-size: 2
  pipeline-model-parallel-layout: Et*20|t*28L
  context-parallel-size: 4
  expert-model-parallel-size: 8
  distributed-timeout-minutes: 30  # 增加分布式超时时间，解决进程组初始化超时问题（默认10分钟）
  enabled:
    - use-distributed-optimizer
    # - tp-comm-overlap
    # - sequence-parallel


CHECKPOINT_ARGS:
  ckpt-format: torch_dist
  dist-ckpt-strictness: log_all
  save-interval: 200
  save: ${__GLOBAL_VARS__.OUTPUT_PATH}/ckpt
  # ckpt: ${CHECKPOINT_ARGS.load}
  # load: "/apdcephfs_wza2/share_304227829/hunyuan/milesjyang/basic_train_milesjyang_20260407202045_a5b8364b/95a68c749e1c2e64019e1ce67c7a0093/ckpt" # pretrain
  load: "/apdcephfs_wza2/share_304227829/hunyuan/milesjyang/basic_train_milesjyang_20260407202045_a5b8364b/95a8ce269e6425be019e6a42baa702bf/ckpt/" # ct official

  key-mapping: []
  generation-config: /apdcephfs_wza/1_public_models/hymm_ar_assets/pretrained_llm/HunyuanImage3.5/hunyuan3-moe-a3b-gemini-mot-gen-a10b.json
  enabled:
    - fuse-experts-in-load
    - resume
    - use-dist-ckpt
    - no-load-optim
    - no-load-rng   # saving/loading rng is not supported yet
    - finetune
    - ckpt-fully-parallel-save
    - ckpt-assume-constant-structure

LOGGING_ARGS:
  log-interval: 1
  tensorboard-dir: ${__GLOBAL_VARS__.OUTPUT_PATH}/events
  saved-training-batch-dir: ${__GLOBAL_VARS__.OUTPUT_PATH}/saved_training_data
  save-n-training-data: 16
  enabled:
    - log-timers-to-tensorboard
    - log-memory-to-tensorboard
    - log-num-zeros-in-grad
    - log-params-norm
    - log-validation-ppl-to-tensorboard
    - log-throughput