training_config:
  trainer_name: multimodal_gemini_beta_trainer.MultiModalGeminiBetaTrainer
  micro_batch_size: 1
  global_seed: 123

model_config:
  model_name: hunyuan-dense-7b
  model_structure: MultiModalTransfusion
  tokenizer_name: hunyuan-dense-7b-tokenizer-refactor
  pretrained_ckpt: null
  precision: bf16
  autocast_dtype: bf16
  media_vocab_size: 0

  denoise_type: flow
  flow_path_type: linear
  flow_predict_type: velocity
  flow_loss_weight: null
  flow_train_eps: null
  flow_sample_eps: null
  flow_snr_type: lognorm
  flow_reverse: True
  flow_shift: 3.0
  use_flux_shift: False
  flux_base_num_tokens: null
  flux_base_log_shift: null
  flux_base_shift: null
  flux_max_num_tokens: null
  flux_max_log_shift: null
  flux_max_shift: null

  model_kwargs:
    block_size: 12800
  vision_model_type: siglip2-large-patch16-512

  image_loss_weight: 5.0

  img_proj_type: unet
  patch_embed_hidden_dim: 1024
  patch_size: 1

  use_compile: True

extra_model_config:
  vae_type: 16x16x4-32c-hy-image
  vae_precision: fp32
  vae_autocast_dtype: fp32
  vae_latent_dim: 32

dataloader_config:
  # Common
  shuffle_by: dataset
  fast_shuffle: True
  add_iw_ih_token: False
  add_timestep_token: True
  use_front_boi_token: True
  add_image_shape_token: True
  sequence_template: pretrain
  cos_base: "/apdcephfs_nj8/share_301739632/jarvizhang/workspace/datasets/ci_demo_data_gemini_beta/ -> ./"
  combined_iterator_sampling_mode: random

    # Text-to-Image
  t2i_batch_size: 4
  t2i_task_kwargs:
    training_image_size: 512 # only used when multireso is False
    image_token_length: 1024
    text_token_length: 256
    uncond_p: 0.1
    try_first_use_source_text: False
    caption_processor: caption_process_v2
    caption_processor_kwargs: '{"ocr_only_long_caption": true}'
    use_general_style: True
    image_caption_rate: 1.0   # 使用 caption 的比例
    caption_sample_ratio: '{"long_caption":0.4,"medium_caption":0.3,"short_caption":0.25,"background":0.8,"shot_type":0.8,"style":0.8,"light":0.8,"atmosphere":0.8,"composition":0.8,"IP":0.8}'
  t2i_index_kwargs:
    index_file: /root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta/t2i/mb512.json
    multireso: True
    ceph_base: '{"/root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta":"nj8"}'
    image_col: cache_image
    image_caption_col: caption_v2
    image_caption_col_2: simple_caption
    image_caption_col_3: gemini_beta_zh_caption@_gemini_beta    # image
    image_text_col: text_source

  # Inpainting
  inpainting_task_kwargs:
    inpainting_test_arrow: /apdcephfs_nj10/share_301739632/0_public_datasets/instruction_tuning_gemini/image_inpainting/test.arrow
    inpainting_training_image_size: 1024
    inpainting_image_token_length: 1024
    inpainting_text_token_length: 256
    inpainting_uncond_p: 0.1
    inpainting_caption_processor: caption_process_v2
    inpainting_caption_sample_ratio: '{"long_caption": 0.1, "medium_caption": 0.1, "short_caption": 0.8,"background": 0.0, "shot_type":0.0, "style": 0.0, "light":0.0, "atmosphere":0.0, "composition": 0.0, "IP": 0.0}'
    inpainting_mask_generator_probs: [0.4, 0.4, 0.2]  # random_irregular, random_rectangle, outpainting, LaMa use [0.5, 0.5, 0.0]
  inpainting_index_kwargs:
    inpainting_index_file: /apdcephfs_nj8/share_301739632/0_public_datasets/text2image_gemini/gemini_json/mb1024_v2/mb1024.json
    inpainting_multireso: True
    inpainting_ceph_base: '{"/apdcephfs_nj8/share_301739632": "gy2"}'
    inpainting_tgt_image_col: image@_image
    inpainting_image_caption_col: caption_v2

  # OmniEdit
  editing_OmniEdit_task_kwargs:
    editing_OmniEdit_test_arrow: /apdcephfs_nj10/share_301739632/0_public_datasets/instruction_tuning_gemini/image_editing/OmniEdit/test.arrow
    editing_OmniEdit_training_image_size: 1024
    editing_OmniEdit_image_token_length: 1024
    editing_OmniEdit_text_token_length: 256
    editing_OmniEdit_uncond_p: 0.1
  editing_OmniEdit_index_kwargs:
    editing_OmniEdit_index_file: /apdcephfs_nj8/share_301739632/0_public_datasets/instruction_tuning_gemini/image_editing/OmniEdit/mb1024.json
    editing_OmniEdit_multireso: True
    editing_OmniEdit_ceph_base: '{"/apdcephfs_nj8/share_301739632": "gy2"}'
    editing_OmniEdit_src_image_col: src_image
    editing_OmniEdit_tgt_image_col: image
    editing_OmniEdit_image_caption_col: instruction

  # video2frame
  editing_v2f_task_kwargs:
    editing_v2f_test_arrow: /apdcephfs_nj10/share_301739632/0_public_datasets/instruction_tuning_gemini/image_editing/extended_Video2Frame/test.arrow
    editing_v2f_training_image_size: 1024
    editing_v2f_image_token_length: 1024
    editing_v2f_text_token_length: 256
    editing_v2f_uncond_p: 0.1
  editing_v2f_index_kwargs:
    editing_v2f_index_file: /apdcephfs_nj8/share_301739632/0_public_datasets/instruction_tuning_gemini/image_editing/extended_Video2Frame/mb1024.json
    editing_v2f_multireso: True
    editing_v2f_ceph_base: '{"/apdcephfs_nj8/share_301739632": "gy2"}'
    editing_v2f_src_image_col: src_img_bytes
    editing_v2f_tgt_image_col: tgt_img_bytes
    editing_v2f_image_caption_col: instruction

  # subject driven
  subject_driven_task_kwargs:
    subject_driven_training_image_size: 1024
    subject_driven_image_token_length: 1024
    subject_driven_text_token_length: 256
    subject_driven_uncond_p: 0.1
    subject_driven_max_num_refs: 3
  subject_driven_index_kwargs:
    subject_driven_index_file: "/apdcephfs_nj8/share_301739632/0_public_datasets/instruction_tuning_gemini/subject_driven/mb1024.json"
    subject_driven_multireso: True
    subject_driven_ceph_base: '{"/apdcephfs_nj8/share_301739632": "gy2"}'
    subject_driven_tgt_image_col: image
    subject_driven_image_caption_col: caption

  # faceid preserve
  face_id_task_kwargs:
    face_id_test_dir: /apdcephfs_cq8/share_2938211/chenyangqi/datasets/hymm_ar_assets_gy/evaluation/dataset/real_world_face
    face_id_training_image_size: 1024
    face_id_image_token_length: 1024
    face_id_text_token_length: 256
    face_id_uncond_p: 0.3
    face_id_face_uncond_p: 0.3
    face_id_caption_processor: caption_process
    face_id_caption_sample_ratio: '{"long caption": 0.50, "short caption": 0.45, "background": 0.0, "shot type": 0.0, "style": 0.0, "light": 0.0, "atmosphere": 0.0, "camera movement": 0.0}'
    face_id_face_index_unique: True
    face_id_src_condition_type: face_embed
    face_id_resampler_token_length: 16
  face_id_index_kwargs:
    face_id_index_file: /apdcephfs_nj8/share_301739632/0_public_datasets/instruction_tuning_gemini/face_id_preserve/mb1024.json
    face_id_multireso: True
    face_id_ceph_base: '{"/apdcephfs_nj8/share_301739632": "gy2"}'
    face_id_face_bbox_col: bbox@_face_analysis_buffalo_l
    face_id_face_embed_col: embedding@_face_analysis_buffalo_l

  # Interleave
  interleave_task_kwargs:
    interleave_training_image_size: 1024 # only used when multireso is False
    interleave_max_length: 10645
    interleave_drop_last: True
    interleave_uncond_p: 0.1
    interleave_caption_sample_ratio: '{"long_caption":0.4,"medium_caption":0.3,"short_caption":0.25,"background":0.8,"shot_type":0.8,"style":0.8,"light":0.8,"atmosphere":0.8,"composition":0.8,"IP":0.8}'
    interleave_caption_processor: caption_process_v2
    interleave_caption_processor_kwargs: '{"ocr_only_long_caption": true}'
    interleave_caption_sample_ratio_video_cap: '{"long caption":0.4,"short caption":0.25,"background":0.8,"shot_type":0.8,"style":0.8,"light":0.8,"atmosphere":0.8,"camera movement":0.8}'
    interleave_caption_processor_video_cap: caption_process_v2
    interleave_caption_processor_kwargs_video_cap: '{"ocr_only_long_caption": true}'
  interleave_index_kwargs:
    interleave_index_file: /root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta/interleave/base.json
    interleave_multireso: False
    interleave_ceph_base: '{"/root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta":"nj8"}'
    interleave_message_col: caption
    interleave_image_key: cache_image

  # Language Model
  lm_index_file: /apdcephfs_nj8/share_301739632/1_public_models/hymm_ar_assets/dataset/t2t_index/instruct_text.json
  lm_token_length: 4096
  lm_index_kwargs:
    lm_ceph_base: '{"/apdcephfs_nj8/share_301739632":"gy2"}'

    # Multimodal Understanding
  mmu_batch_size: 4
  mmu_task_kwargs:
    mmu_token_length: 2560
    mmu_switch_image_text: True
    mmu_drop_last: True
  mmu_index_kwargs:
    mmu_index_file: /root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta/mmu/base.json
    mmu_ceph_base: '{"/root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta":"nj8"}'
    mmu_image_key: cache_image
    mmu_message_col: caption

  # Dataloader
  dataloader_params:
    num_workers: 0
    pin_memory: True
    prefetch_factor: null
