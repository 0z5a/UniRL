training_config:
  trainer_name: multimodal_gemini_beta_trainer.MultiModalGeminiBetaTrainer
  micro_batch_size: 1
  global_seed: 3409

model_config:
  model_name: hunyuan-dense-7b
  model_structure: MultiModalTransfusion
  tokenizer_name: hunyuan-dense-7b-tokenizer-refactor
  pretrained_ckpt: null
  precision: bf16
  autocast_dtype: bf16
  media_vocab_size: 0

  denoise_type: flow
  flow_path_type: linear
  flow_predict_type: velocity
  flow_loss_weight: null
  flow_train_eps: null
  flow_sample_eps: null
  flow_snr_type: lognorm
  flow_reverse: True
  flow_shift: 3.0
  sample_flow_shift: 3.0
  use_flux_shift: False
  flux_base_num_tokens: null
  flux_base_log_shift: null
  flux_base_shift: null
  flux_max_num_tokens: null
  flux_max_log_shift: null
  flux_max_shift: null
  

  model_kwargs:
    block_size: 20000
    vision_model:
      vision_model_type: siglip2-large-patch16-512

  img_proj_type: unet
  patch_embed_hidden_dim: 1024
  patch_size: 1

extra_model_config:
  vae_type: 16x16x4-32c-hy-image
  vae_precision: fp32
  vae_autocast_dtype: fp32
  vae_latent_dim: 32
#  vae_sample_size: 768
#  vae_spatial_tiling: True

dataloader_config:
  # Common
  shuffle_by: dataset
  fast_shuffle: True
  add_iw_ih_token: False
  add_timestep_token: True
  add_image_shape_token: True
  use_front_boi_token: True
  use_front_src_image: True
  use_joint_image_feature: True
  sequence_template: instruct
  combined_iterator_sampling_mode: random

  # Text-to-Image
  t2i_batch_size: 1
  t2i_task_kwargs:
    training_image_size: 1024 # only used when multireso is False
    image_token_length: 4096
    text_token_length: 384
    uncond_p: 0.1
    try_first_use_source_text: False    # Must be False
    caption_processor: caption_process_v2
    caption_processor_kwargs: '{"ocr_only_long_caption": true}'
    use_general_style: True
    image_caption_rate: 1.0   # 使用 caption 的比例
    caption_sample_ratio: '{"long_caption":0.4,"medium_caption":0.3,"short_caption":0.25,"background":0.08,"shot_type":0.08,"style":0.08,"light":0.08,"atmosphere":0.08,"composition":0.08,"IP":0.08}'
    attn_type: auto
    instruction_candidates_type: 'off'
  t2i_index_kwargs:
    index_file:
      - /root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta_instruct/gemini_t2i/mb1024.json
    multireso: True
    ceph_base: '{"/root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta_instruct": "nj10"}'
    image_col: cache_image
    image_col_2: image
    image_caption_col: caption_v2
    image_caption_col_2: simple_caption
    image_caption_col_3: gemini_beta_zh_caption@_gemini_beta    # image
    image_text_col: text_source

  # Editing 932w
  editing_batch_size: 1
  editing_task_kwargs:
    editing_training_image_size: 1024
    editing_image_token_length: 5120 # 4096 vae + 1024 vision encoder
    editing_text_token_length: 384
    editing_uncond_p: 0.1
    editing_uncond_p_src: 0.1
    editing_caption_processor: caption_process_v2
    editing_caption_processor_kwargs: '{"ocr_only_long_caption": true}'
    editing_image_caption_rate: 1.0
    editing_inpainting_lama_ratio: 0.5
    editing_caption_sample_ratio: '{"long_caption":0.4,"medium_caption":0.3,"short_caption":0.25,"background":0.08,"shot_type":0.08,"style":0.08,"light":0.08,"atmosphere":0.08,"composition":0.08,"IP":0.08}'
    editing_mask_generator_probs: [0.4, 0.4, 0.2]
    editing_grounding_with_caption: True
    # editing_grounding_n_select: 1
    editing_grounding_pred_mask_type: masked_image
    editing_grounding_coco_sample_mask_rate: 0.9
    editing_grounding_grit_box_score_threshold: 0.65
    editing_attn_type: auto
    editing_instruction_candidates_type: 'off'  # The quotation mark is required to avoid yaml parsing to False
  editing_index_kwargs:
    editing_index_file:
      - /root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta_instruct/gemini_editing/mb1024_0.json
      - /root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta_instruct/gemini_editing/mb1024_3.json
      - /root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta_instruct/gemini_editing/mb1024_5.json
    editing_multireso: True
    editing_ceph_base: '{"/root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta_instruct": "nj10"}'
    editing_src_image_col: src_img_bytes
    editing_tgt_image_col: tgt_img_bytes
    editing_extra_src_image_col: src_cache_image
    editing_extra_tgt_image_col: tgt_cache_image
    editing_image_caption_col: instruction
    editing_inpainting_image_col: image
    editing_inpainting_caption_col: tgt_caption_v2
    editing_controlnet_caption_v2_col: tgt_caption_v2
    editing_controlnet_pred_condition_ratio: 0.3
    editing_controlnet_src_cols: [
      "pose_img_full", "pose_img_only_body", "depth_midas", "depth_zoe", "normal_bae", "lineart", "lineart_coarse",
      "mlsd", "scribble_hed", "scribble_pidi", "edge_hed_results", "edge_hed_results_safe", "edge_pidi_results",
      "edge_pidi_results_safe", "seg_uniformer", "seg_oneformer_coco", "seg_oneformer_ade20k"
    ]
    editing_controlnet_caption_col: tgt_simple_caption

  # editcot
  editcot_batch_size: 1
  editcot_task_kwargs:
    editcot_training_image_size: 1024
    editcot_image_token_length: 5120 # 4096 vae + 1024 vision encoder
    editcot_text_token_length: 256
    editcot_description_token_length: 256
    editcot_uncond_p: 0.1
    editcot_uncond_p_src: 0.1
    editcot_caption_processor: caption_process_v2
    editcot_caption_processor_kwargs: '{"ocr_only_long_caption": true}'
    editcot_image_caption_rate: 1.0
    editcot_inpainting_lama_ratio: 0.5
    editcot_caption_sample_ratio: '{"long_caption":0.4,"medium_caption":0.3,"short_caption":0.25,"background":0.08,"shot_type":0.08,"style":0.08,"light":0.08,"atmosphere":0.08,"composition":0.08,"IP":0.08}'
    editcot_mask_generator_probs: [0.4, 0.4, 0.2]
    editcot_grounding_with_caption: True
    # editcot_grounding_n_select: 1
    editcot_grounding_pred_mask_type: masked_image
    editcot_grounding_coco_sample_mask_rate: 0.9
    editcot_grounding_grit_box_score_threshold: 0.65
    editcot_attn_type: auto
    editcot_instruction_candidates_type: 'off'  # The quotation mark is required to avoid yaml parsing to False
  editcot_index_kwargs:
    editcot_index_file:
      - /root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta_instruct/gemini_editcot/mb1024_0.json
    editcot_multireso: True
    editcot_ceph_base: '{"/root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta_instruct": "nj10"}'
    editcot_src_image_col: src_img_bytes
    editcot_tgt_image_col: tgt_img_bytes
    editcot_extra_src_image_col: src_cache_image
    editcot_extra_tgt_image_col: tgt_cache_image
    editcot_image_caption_col: instruction
    editcot_inpainting_image_col: image
    editcot_inpainting_caption_col: tgt_caption_v2
    editcot_controlnet_caption_v2_col: tgt_caption_v2
    editcot_controlnet_pred_condition_ratio: 0.3
    editcot_controlnet_src_cols: [
      "pose_img_full", "pose_img_only_body", "depth_midas", "depth_zoe", "normal_bae", "lineart", "lineart_coarse",
      "mlsd", "scribble_hed", "scribble_pidi", "edge_hed_results", "edge_hed_results_safe", "edge_pidi_results",
      "edge_pidi_results_safe", "seg_uniformer", "seg_oneformer_coco", "seg_oneformer_ade20k"
    ]
    editcot_controlnet_caption_col: tgt_simple_caption

  # Subject Driven 700w
  subject_driven_batch_size: 1
  subject_driven_task_kwargs:
    subject_driven_training_image_size: 1024
    subject_driven_image_token_length: 5120 # 4096 vae + 1024 vision encoder
    subject_driven_text_token_length: 384
    subject_driven_uncond_p: 0.1
    subject_driven_uncond_p_src: 0.1
    subject_driven_max_num_refs: 3
    subject_driven_attn_type: auto
    subject_driven_instruction_candidates_type: 'off'
  subject_driven_index_kwargs:
    subject_driven_index_file:
      - /root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta_instruct/gemini_subject_driven/mb1024_0.json
      - /root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta_instruct/gemini_subject_driven/mb1024_1.json
      - /root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta_instruct/gemini_subject_driven/mb1024_2.json
    subject_driven_multireso: True
    subject_driven_ceph_base: '{"/root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta_instruct": "nj10"}'
    subject_driven_tgt_image_col: tgt_img_bytes
    subject_driven_image_caption_col: simple_caption
    subject_driven_image_caption_col_2: tgt_simple_caption

  # Face ID 250w: face embedding + src_image as conditions
  face_id_clip_batch_size: 1
  face_id_clip_task_kwargs:
    face_id_clip_training_image_size: 1024
    face_id_clip_image_token_length: 5120 # 4096 vae + 1024 vision encoder
    face_id_clip_text_token_length: 384
    face_id_clip_uncond_p: 0.1
    face_id_clip_face_uncond_p: 0.1
    face_id_clip_caption_sample_ratio: '{"long_caption":0.4,"medium_caption":0.3,"short_caption":0.25,"background":0.08,"shot_type":0.08,"style":0.08,"light":0.08,"atmosphere":0.08,"composition":0.08,"IP":0.08}'
    face_id_clip_caption_processor: caption_process_v2
    face_id_clip_caption_processor_kwargs: '{"ocr_only_long_caption": true}'
    face_id_clip_caption_sample_ratio_photomaker: '{"long caption":0.75,"short caption":0.25,"background":0.08,"shot type":0.08,"style":0.08,"light":0.08,"atmosphere":0.08}'
    face_id_clip_caption_processor_photomaker: caption_process
    face_id_clip_attn_type: auto
    face_id_clip_condition_type: joint_image
    face_id_clip_instruction_candidates_type: 'merged'
  face_id_clip_index_kwargs:
    face_id_clip_index_file:
      - /root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta_instruct/gemini_face_id_clip/mb1024_0.json
      - /root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta_instruct/gemini_face_id_clip/mb1024_1.json
      - /root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta_instruct/gemini_face_id_clip/mb1024_2.json
      - /root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta_instruct/gemini_face_id_clip/mb1024_3.json
    face_id_clip_multireso: True
    face_id_clip_ceph_base: '{"/root/hymm_ar_ci_assets/mm_train/data/ci_demo_data_gemini_beta_instruct": "nj10"}'
    face_id_clip_face_photomaker_filtered_columns_col: "columns_of_face_number_pixel_mse_face_similarity@_face_sim_filtering"
    face_id_clip_merged_instruction: "merged_instruction@_instruction_caption_merge_rename"


  # Dataloader
  dataloader_params:
    num_workers: 0
    pin_memory: True
    prefetch_factor: null
