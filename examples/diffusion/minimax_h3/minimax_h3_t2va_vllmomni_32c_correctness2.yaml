# @package _global_
# Two-step fail-closed gate: rollout/replay parity, one post-update LoRA push,
# multi-frame+audio reward, and checkpoint persistence.

defaults:
  - minimax_h3_t2va_vllmomni_32c_quality100
  - _self_

num_rollouts: 2
save_interval: 2
save_dir: ${oc.env:H3_SAVE_DIR,checkpoints/minimax-h3-correctness2}
eval_interval: 0

logging:
  report_to_wandb: true
  log_media: true
  media_log_interval: 1
  media_max_items: 2
  run_name: h3-correctness2-hsdp4-up4
  tags: [minimax-h3, correctness-gate, hsdp4, up4, rollout-logprob, multimodal-reward]
