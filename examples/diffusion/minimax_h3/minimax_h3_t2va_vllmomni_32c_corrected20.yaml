# @package _global_
# Short quality qualification after the two-step correctness gate.

defaults:
  - minimax_h3_t2va_vllmomni_32c_quality100
  - _self_

num_rollouts: 20
save_interval: 5
save_dir: ${oc.env:H3_SAVE_DIR,checkpoints/minimax-h3-corrected20}
eval_interval: 5

logging:
  media_log_interval: 5
  run_name: h3-corrected20-hsdp4-up4
  tags: [minimax-h3, corrected20, hsdp4, up4, rollout-logprob, multimodal-reward]
