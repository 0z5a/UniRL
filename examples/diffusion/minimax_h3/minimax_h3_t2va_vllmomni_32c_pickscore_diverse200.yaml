# @package _global_
# PickScore-only generalization test: identical optimization recipe to the
# single-prompt overfit gate, but with diverse training and held-out prompts.

defaults:
  - minimax_h3_t2va_vllmomni_32c_overfit50
  - _self_

num_rollouts: 200
save_interval: 10
eval_interval: 10
save_dir: ${oc.env:H3_SAVE_DIR,checkpoints/minimax-h3-pickscore-diverse200}

data_source:
  args:
    run:
      data_path: ${oc.env:H3_PROMPT_FILE,examples/diffusion/minimax_h3/smoke_prompts.txt}
      eval_data_path: ${oc.env:H3_EVAL_PROMPT_FILE,examples/diffusion/minimax_h3/smoke_prompts.txt}
      seed: 42
      shuffle: true
      start_batch: 0

logging:
  media_log_interval: 10
  run_name: h3-pickscore-diverse200
  tags: [minimax-h3, pickscore-only, diverse-prompts, hsdp4, up4, corrected]
