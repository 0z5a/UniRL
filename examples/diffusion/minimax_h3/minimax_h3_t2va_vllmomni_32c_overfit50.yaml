# @package _global_
# Corrected single-prompt PickScore-only overfit preflight.

defaults:
  - minimax_h3_t2va_vllmomni_32c_corrected20
  - _self_

num_rollouts: 50
save_interval: 10
eval_interval: 5
save_dir: ${oc.env:H3_SAVE_DIR,checkpoints/minimax-h3-overfit50}
adv_use_global_std: false

data_source:
  args:
    run:
      data_path: ${oc.env:H3_OVERFIT_PROMPT_FILE,examples/diffusion/minimax_h3/smoke_prompts.txt}
      eval_data_path: ${oc.env:H3_OVERFIT_PROMPT_FILE,examples/diffusion/minimax_h3/smoke_prompts.txt}
      seed: 42
      shuffle: false
      start_batch: 0

backend:
  optimizer_cfg:
    learning_rate: 5.0e-5

reward:
  backend:
    config:
      frame_selection: uniform
      num_score_frames: 9
      weights:
        videopickscore: 1.0
        clap: 0.0

sampling:
  eta: 0.6
  sde_indices: [8, 16, 20]
  scheduler: null

logging:
  media_log_interval: 5
  run_name: h3-overfit50-pickscore-only
  tags: [minimax-h3, overfit50, pickscore-only, single-prompt, hsdp4, up4]
