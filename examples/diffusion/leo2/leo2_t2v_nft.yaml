# @package _global_
# Leo2 T2V DiffusionNFT, trainside LoRA with an EMA shadow adapter.

num_devices: 8
# One prompt is one reward group; each group forks samples_per_prompt videos.
batch_size: 48
num_rollouts: 10000
adv_use_global_std: true

logging:
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,true}}
  project_name: ${oc.env:WANDB_PROJECT,leo2-rl}
  run_name: ${oc.env:WANDB_RUN_NAME,leo2_t2v_nft}
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: [leo2, t2v, diffusionnft, trainside, lora-r64]
  log_media: true
  media_max_items: 1
  media_log_interval: 1

bundle:
  _target_: unirl.models.leo2.bundle.Leo2Bundle.from_config
  config:
    _target_: unirl.models.leo2.config.Leo2PipelineConfig
    model_precision: bf16
    autocast_precision: bf16
    trajectory_precision: bf16
    logprob_precision: fp32
    ckpt_path: ${oc.env:LEO2_CKPT_DIR}
    assets_base: ${oc.env:LEO2_ASSETS_BASE}
    video_shift: 3.0
    text_encoder_gpu_transient: true
    inference_cache_method: none
    context_parallel_size: 2
    expert_parallel_size: 8
    enable_deepep: true

pipeline:
  _target_: unirl.models.leo2.pipeline.Leo2Pipeline.from_bundle
  config: ${bundle.config}
  strategy:
    _target_: unirl.sde.kernels.FlowSDEStrategy

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["LeoLayer", "LeoDualLayer", "LeoTripleLayer"]
  trainable_attr: model
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    master_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    use_torch_compile: false
    root_wrap: true
    # UniRL calls this dispatch dimension SP; Leo2 consumes the same
    # contiguous rank pairs as hymm context parallelism.
    sp_size: 2
    # Expert-parallel parameters are loaded as rank-local shards and excluded
    # from FSDP's data-parallel sharding.
    ep_size: ${bundle.config.expert_parallel_size}
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 1.0e-4
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: 10000
  ema_lora_cfg:
    _target_: unirl.train.configs.EmaLoraConfig
    rank: 64
    alpha: 128
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    default_adapter: default
    shadow_adapter: old
    ema_decay: 0.001
    ema_decay_type: warmup
    ema_flat_steps: 0
    ema_uprate: 0.001
    ema_uphold: 0.5
    timing: rollout_end
    # Generation branch only: video/text attention plus shared and text MLPs.
    # Routed experts, router and audio modules remain frozen.
    target_modules:
      - self_attn.q_proj
      - self_attn.k_proj
      - self_attn.v_proj
      - self_attn.o_proj
      - self_attn.q_proj_txt
      - self_attn.k_proj_txt
      - self_attn.v_proj_txt
      - self_attn.o_proj_txt
      - shared_mlp.gate_and_up_proj
      - shared_mlp.down_proj
      - mlp_txt.gate_and_up_proj
      - mlp_txt.down_proj

rollout:
  _target_: unirl.rollout.engine.trainside.engine.TrainsideRolloutEngine
  stage_attrs: [diffusion]
  forward_batch_size: 1

reward:
  _target_: unirl.reward.service.RewardService
  backend:
    _target_: unirl.reward.local.video_pickscore.VideoPickScoreScorer
    base_device: cuda
    config:
      _target_: unirl.reward.local.video_pickscore.VideoPickScoreSpec
      batch_size: 8
      device: auto
      processor_id: laion/CLIP-ViT-H-14-laion2B-s32B-b79K
      model_id: yuvalkirstain/PickScore_v1
      frame_selection: uniform
      num_score_frames: 4

algorithm:
  _target_: unirl.algorithms.diffusionnft.DiffusionNFT
  stage_attr: diffusion
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.leo2.conditions.Leo2Conditions
  params: ${sampling}
  beta: 1.0
  adv_clip_max: 5.0
  adv_mode: raw
  use_adaptive_weight: true
  train_timestep_mode: random
  num_train_timesteps: 2
  timestep_sampling: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  # Match Leo2 rollout's static flow/logit shift.
  timestep_shift: ${bundle.config.video_shift}
  sigma_min: 1.0e-4
  shuffle_train_timesteps: true
  apply_time_shift_in_loss: false
  training_timestep_fraction: 1.0
  kl_coef: 0.0

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0
  num_updates_per_batch: 1

data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      data_path: ${oc.env:LEO2_PROMPT_FILE,/root/Flow-Factory/dataset/vid_prompt/train.txt}
      eval_data_path: ${oc.env:LEO2_EVAL_PROMPT_FILE,/root/Flow-Factory/dataset/vid_prompt/test.txt}
      seed: ${sampling.seed}
    algorithm:
      prompts_per_rollout: ${batch_size}

sampling:
  _target_: unirl.types.sampling.DiffusionSamplingParams
  num_inference_steps: 10
  guidance_scale: 1.0
  height: 464
  width: 848
  num_frames: 121
  eta: 0.0
  # Reward group size.
  samples_per_prompt: 16
  seed: 42
  init_same_noise: false
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32
  scheduler:
    _target_: unirl.sde.index_schedule.AllSDEScheduler
    num_timesteps: ${..num_inference_steps}
    num_sde_steps: 0
