# @package _global_
# Offline preprocessing is required; see unirl/models/leo2/README.md.
num_devices: 8
batch_size: 8
num_steps: 300
eval_interval: 20
eval_batch_size: 8
eval_num_samples: 128
save_interval: 100
save_dir: ${oc.env:OUTPUT_DIR,outputs/leo2_sft_cached}
save_mode: lora
transport_kind: colocate_store
workers_per_device: 1
logging:
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,false}}
  project_name: ${oc.env:WANDB_PROJECT,unirl-sft}
  run_name: leo2_sft_cached
  entity: ${oc.env:WANDB_ENTITY,null}
  tags:
  - sft
  - leo2
  - t2v
  - cached
  - lora
bundle:
  _target_: unirl.models.leo2.bundle.Leo2Bundle.from_config
  config:
    _target_: unirl.models.leo2.config.Leo2PipelineConfig
    model_precision: bf16
    autocast_precision: bf16
    trajectory_precision: bf16
    logprob_precision: fp32
    ckpt_path: ${oc.env:LEO2_CKPT_DIR}
    assets_base: ${oc.env:LEO2_ASSETS_BASE}
    video_shift: 3.0
    text_encoder_gpu_transient: true
    preprocessing_cache_dir: ${oc.env:LEO2_PREPROCESS_CACHE,outputs/leo2_preprocessed}
    preprocessing_cache_mode: readonly
    load_video_vae: false
    vae_on_gpu: false
pipeline:
  _target_: unirl.models.leo2.pipeline.Leo2Pipeline.from_bundle
  config: ${bundle.config}
  strategy:
    _target_: unirl.sde.kernels.FlowSDEStrategy
backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names:
  - LeoLayer
  - LeoDualLayer
  - LeoTripleLayer
  trainable_attr: model
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    master_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    use_torch_compile: false
    root_wrap: true
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 1.0e-05
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-08
    weight_decay: 0.0
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: ${num_steps}
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 64
    alpha: 256
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules:
    - self_attn.q_proj
    - self_attn.k_proj
    - self_attn.v_proj
    - self_attn.o_proj
    - self_attn.q_proj_txt
    - self_attn.k_proj_txt
    - self_attn.v_proj_txt
    - self_attn.o_proj_txt
    - shared_mlp.gate_and_up_proj
    - shared_mlp.down_proj
    - mlp_txt.gate_and_up_proj
    - mlp_txt.down_proj
algorithm:
  _target_: unirl.algorithms.sft.FlowMatchSFT
  stage_attr: diffusion
  timestep_sampling: logit_normal
  timestep_shift: 3.0
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.leo2.conditions.Leo2Conditions
  params: ${sampling}
stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0
track_builder:
  _target_: unirl.models.leo2.sft.Leo2CachedSupervisedTrackBuilder
  num_frames: ${sampling.num_frames}
  height: ${sampling.height}
  width: ${sampling.width}
  max_decode_frames: 256
data_source:
  _target_: unirl.data.sft.SupervisedDataSource
  manifest_path: ${oc.env:SFT_DATA}
  eval_manifest_path: ${oc.env:SFT_EVAL_DATA,${oc.env:SFT_DATA}}
  seed: 42
sampling:
  _target_: unirl.types.sampling.DiffusionSamplingParams
  num_inference_steps: 14
  guidance_scale: 1.0
  height: 464
  width: 848
  num_frames: 121
